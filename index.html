const _MESES_P = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                  'Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];

function _normFecha(f) {
  if(!f) return '';
  const s = String(f);
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  try { const d=new Date(s); if(!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; } catch(e){}
  return s;
}

async function renderMisPropinas(el) {
  const name    = CURRENT_USER;
  const nameUP  = (name||'').toUpperCase().trim();
  el.innerHTML  = moduleBreadcrumb('fin','Mis Propinas') +
    `<div style="padding:40px;text-align:center;color:#555;font-size:11px">Calculando métricas...</div>`;

  // ── 1. Fetch turnos de propinas ───────────────────────────────
  const r = await apiCall({ action:'getTurnosPropinas' });
  const turnos = (r?.data || []).map(t => ({ ...t, fecha: _normFecha(t.fecha) }));

  // ── 2. Pass único sobre DIAS → ventas y PAX por mes por salonero ──
  // ventasMesSal["2026-05"]["JUAN"] = { ventas, pax }
  const ventasMesSal = {};
  Object.keys(DIAS).forEach(fecha => {
    const mes     = fecha.substring(0,7);
    const salData = DIAS[fecha]?.saloneros;
    if(!salData) return;
    Object.keys(salData).forEach(k => {
      const s   = salData[k];
      const key = k.toUpperCase().trim();
      if(!ventasMesSal[mes])      ventasMesSal[mes]      = {};
      if(!ventasMesSal[mes][key]) ventasMesSal[mes][key] = { ventas:0, pax:0 };
      ventasMesSal[mes][key].ventas += s.total || 0;
      ventasMesSal[mes][key].pax   += s.pax   || 0;
    });
  });

  // ── 3. Pass único sobre turnos → propina_gen y take_home por mes por empleado ──
  // propMesSal["2026-05"]["JUAN"] = { gen, take, dias_turno, q1:{dias,take}, q2:{dias,take} }
  const propMesSal = {};
  turnos.forEach(t => {
    const mes = t.fecha.substring(0,7);
    const day = parseInt(t.fecha.split('-')[2]||'0');
    (t.datos?.lineas || []).forEach(l => {
      const key = (l.nombre||'').toUpperCase().trim();
      if(!propMesSal[mes])      propMesSal[mes]      = {};
      if(!propMesSal[mes][key]) propMesSal[mes][key] = {
        gen:0, take:0, dias:0,
        q1:{ dias:0, take:0 }, q2:{ dias:0, take:0 }
      };
      const p = propMesSal[mes][key];
      const q = day <= 15 ? 'q1' : 'q2';
      p.gen  += l.propina_gen || 0;
      p.take += l.take_home  || 0;
      p.dias++;
      p[q].dias++;
      p[q].take += l.take_home || 0;
    });
  });

  // ── 4. Meses con datos del empleado ──────────────────────────
  const mesesSet = new Set([
    ...Object.keys(propMesSal).filter(m => propMesSal[m][nameUP]),
    ...Object.keys(ventasMesSal).filter(m => ventasMesSal[m][nameUP]?.ventas > 0)
  ]);
  const meses = [...mesesSet].sort().reverse();

  if(!meses.length) {
    el.innerHTML = moduleBreadcrumb('fin','Mis Propinas') +
      emptyState('₡','Sin datos registrados','Subí reportes de ventas y cargá turnos de propinas para ver tus métricas');
    return;
  }

  // ── 5. Calcular ICP del equipo por mes (benchmark) ───────────
  // icp_equipo[mes] = promedio ICP de todos los saloneros ese mes
  const icpEquipo = {};
  Object.keys(propMesSal).forEach(mes => {
    const vals = [];
    Object.keys(propMesSal[mes]).forEach(k => {
      const gen    = propMesSal[mes][k].gen;
      const ventas = ventasMesSal[mes]?.[k]?.ventas || 0;
      if(ventas > 0 && gen > 0) vals.push(gen / ventas * 100);
    });
    if(vals.length) icpEquipo[mes] = vals.reduce((s,v)=>s+v,0) / vals.length;
  });

  // ── 6. Construir objeto por mes para el empleado ─────────────
  const byMes = {};
  meses.forEach(m => {
    const prop   = propMesSal[m]?.[nameUP]  || { gen:0, take:0, dias:0, q1:{dias:0,take:0}, q2:{dias:0,take:0} };
    const ventas = ventasMesSal[m]?.[nameUP] || { ventas:0, pax:0 };
    byMes[m] = {
      ventas:  ventas.ventas,
      pax:     ventas.pax,
      gen:     prop.gen,
      take:    prop.take,
      dias:    prop.dias,
      q1:      prop.q1,
      q2:      prop.q2,
      icp:     ventas.ventas > 0 && prop.gen > 0 ? prop.gen / ventas.ventas * 100 : null,
      icpEq:   icpEquipo[m] || null,
      balance: prop.gen - prop.take,
      propPax: ventas.pax > 0 && prop.gen > 0 ? prop.gen / ventas.pax : null,
    };
  });

  // ── 7. Totales y mes actual ───────────────────────────────────
  const now    = new Date();
  const curKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const cur    = byMes[curKey];

  const totalTake  = meses.reduce((s,m) => s + byMes[m].take,   0);
  const totalGen   = meses.reduce((s,m) => s + byMes[m].gen,    0);
  const totalDias  = meses.reduce((s,m) => s + byMes[m].dias,   0);
  const totalVentas= meses.reduce((s,m) => s + byMes[m].ventas, 0);
  const totalICP   = totalVentas > 0 && totalGen > 0 ? totalGen/totalVentas*100 : null;
  const maxGen     = Math.max(...meses.map(m => byMes[m].gen), 1);

  // Helper ICP display
  const icpBadge = (icp, icpEq) => {
    if(icp === null) return '<span class="prop-muted">—</span>';
    const txt   = icp.toFixed(1) + '%';
    const color = icp >= 13 ? 'var(--green)' : icp >= 10 ? 'var(--gold)' : 'var(--red)';
    if(icpEq === null) return `<span style="color:${color};font-weight:700">${txt}</span>`;
    const delta = icp - icpEq;
    const arr   = delta > 0.3 ? '▲' : delta < -0.3 ? '▼' : '●';
    const ac    = delta > 0.3 ? 'var(--green)' : delta < -0.3 ? 'var(--red)' : '#555';
    return `<span style="color:${color};font-weight:700">${txt}</span>
            <span style="color:${ac};font-size:9px;margin-left:3px">${arr} ${Math.abs(delta).toFixed(1)}%</span>`;
  };

  // ── 8. Detectar rol cocina para vista especial ────────────────
  const empRol = (EMPLEADOS_LOGIN.find(e => e.nombre.toUpperCase().trim() === nameUP)?.rol || '').toLowerCase();
  const esCocina = empRol === 'cocina';

  // ── 9. Render ─────────────────────────────────────────────────
  let html = moduleBreadcrumb('fin','Mis Propinas');

  const curGen    = cur?.gen    ?? 0;
  const curTake   = cur?.take   ?? 0;
  const curDias   = cur?.dias   ?? 0;

  if (esCocina) {
    // ── Vista cocina: sin ICP ni balance, solo take home por turnos ──
    const avgDia = totalDias > 0 ? Math.round(totalTake / totalDias) : 0;
    const curQ1  = cur?.q1 || { dias:0, take:0 };
    const curQ2  = cur?.q2 || { dias:0, take:0 };
    html += `
      <div style="background:#1a0e08;border:1px solid #c23b2230;border-radius:2px;
                  padding:10px 16px;margin-bottom:20px;font-size:9px;color:#c87060;letter-spacing:.08em">
        Pool de cocina · Reparto igual sin importar horas · 8h fijas por turno
      </div>
      <div class="kpi-grid" style="margin-bottom:28px">
        <div class="kpi">
          <div class="kpi-label">Take home este mes</div>
          <div class="kpi-val" style="color:var(--gold)">${fi(curTake)}</div>
          <div class="kpi-sub">${curDias} turno${curDias!==1?'s':''} trabajados</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Q1 este mes</div>
          <div class="kpi-val">${curQ1.take > 0 ? fi(curQ1.take) : '—'}</div>
          <div class="kpi-sub">${curQ1.dias} turno${curQ1.dias!==1?'s':''}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Q2 este mes</div>
          <div class="kpi-val">${curQ2.take > 0 ? fi(curQ2.take) : '—'}</div>
          <div class="kpi-sub">${curQ2.dias} turno${curQ2.dias!==1?'s':''}</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">Promedio / turno</div>
          <div class="kpi-val">${avgDia > 0 ? fi(avgDia) : '—'}</div>
          <div class="kpi-sub">${totalDias} turnos totales registrados</div>
        </div>
      </div>`;
    html += `<div class="prop-section">
      <div class="prop-section-title">Historial mensual — propinas cocina</div>
      <table class="prop-table" style="margin-top:12px">
        <thead>
          <tr>
            <th>Mes</th>
            <th class="r">Turnos</th>
            <th class="c">Q1<br><span style="color:#444;font-size:7px">turnos · take</span></th>
            <th class="c">Q2<br><span style="color:#444;font-size:7px">turnos · take</span></th>
            <th class="r">Take home</th>
          </tr>
        </thead>
        <tbody>
          ${meses.map(m => {
            const d      = byMes[m];
            const [y,mo] = m.split('-');
            const esCur  = m === curKey;
            return `<tr style="${esCur?'background:rgba(200,169,110,.04)':''}">
              <td>
                <span class="prop-mes-label">${_MESES_P[parseInt(mo)-1]}</span>
                <span class="prop-mes-anio">${y}</span>
                ${esCur?'<span class="prop-cur-badge">HOY</span>':''}
              </td>
              <td class="r prop-muted">${d.dias}</td>
              <td class="c prop-muted" style="font-size:11px">${d.q1.dias>0?`${d.q1.dias}t · ${fi(d.q1.take)}`:'—'}</td>
              <td class="c prop-muted" style="font-size:11px">${d.q2.dias>0?`${d.q2.dias}t · ${fi(d.q2.take)}`:'—'}</td>
              <td class="r prop-gold">${fi(d.take)}</td>
            </tr>`;
          }).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td>TOTAL</td>
            <td class="r prop-muted">${totalDias}</td>
            <td class="c prop-muted">${meses.reduce((s,m)=>s+byMes[m].q1.dias,0)}t · ${fi(meses.reduce((s,m)=>s+byMes[m].q1.take,0))}</td>
            <td class="c prop-muted">${meses.reduce((s,m)=>s+byMes[m].q2.dias,0)}t · ${fi(meses.reduce((s,m)=>s+byMes[m].q2.take,0))}</td>
            <td class="r prop-gold" style="font-size:14px">${fi(totalTake)}</td>
          </tr>
        </tfoot>
      </table>
    </div>`;
    el.innerHTML = html;
    return;
  }

  // ── Vista sala/bar/runner: ICP + balance pool ─────────────────
  const curICP    = cur?.icp    ?? null;
  const curIcpEq  = cur?.icpEq  ?? null;
  const curBal    = cur?.balance ?? 0;
  const icpColor  = curICP === null ? '#f0ece4' : curICP >= 13 ? 'var(--green)' : curICP >= 10 ? 'var(--gold)' : 'var(--red)';
  const balColor  = curBal >= 0 ? 'var(--green)' : 'var(--red)';
  const icpVsEq   = curICP !== null && curIcpEq !== null
    ? `<div class="kpi-sub" style="color:${curICP>=curIcpEq?'var(--green)':'var(--red)'}">
        ${curICP>=curIcpEq?'▲':'▼'} equipo ${curIcpEq.toFixed(1)}%</div>` : '';

  html += `<div class="kpi-grid" style="margin-bottom:28px">
    <div class="kpi">
      <div class="kpi-label">ICP este mes</div>
      <div class="kpi-val" style="color:${icpColor}">${curICP !== null ? curICP.toFixed(1)+'%' : '—'}</div>
      ${icpVsEq}
      <div class="kpi-sub" style="margin-top:4px;color:#444">Propina gen. / Ventas</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Propina generada</div>
      <div class="kpi-val">${fi(curGen)}</div>
      <div class="kpi-sub">Lo que generaste en datáfono</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Take home</div>
      <div class="kpi-val" style="color:var(--gold)">${fi(curTake)}</div>
      <div class="kpi-sub">${curDias} día${curDias!==1?'s':''} · prom ${curDias>0?fi(Math.round(curTake/curDias)):'—'}/día</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Balance pool</div>
      <div class="kpi-val" style="color:${balColor}">${curBal>=0?'+':''}${fi(curBal)}</div>
      <div class="kpi-sub" style="color:${balColor}">${curBal>=0?'Aportás más de lo que recibís':'Recibís más de lo que aportás'}</div>
    </div>
  </div>`;

  // Tabla histórica con métricas cruzadas
  html += `<div class="prop-section">
    <div class="prop-section-title">Historial mensual — ventas + propinas + ICP</div>
    <table class="prop-table" style="margin-top:12px">
      <thead>
        <tr>
          <th>Mes</th>
          <th class="r">Ventas</th>
          <th class="r">Prop. gen.</th>
          <th class="r">ICP <span style="color:#333;font-size:7px">vs equipo</span></th>
          <th class="c">Q1<br><span style="color:#444;font-size:7px">días · take</span></th>
          <th class="c">Q2<br><span style="color:#444;font-size:7px">días · take</span></th>
          <th class="r">Take home</th>
          <th class="r">Balance</th>
        </tr>
      </thead>
      <tbody>
        ${meses.map(m => {
          const d      = byMes[m];
          const [y,mo] = m.split('-');
          const esCur  = m === curKey;
          const barPct = Math.round(d.gen / maxGen * 100);
          const bc     = d.balance >= 0 ? 'var(--green)' : 'var(--red)';
          return `<tr style="${esCur?'background:rgba(200,169,110,.04)':''}">
            <td>
              <span class="prop-mes-label">${_MESES_P[parseInt(mo)-1]}</span>
              <span class="prop-mes-anio">${y}</span>
              ${esCur?'<span class="prop-cur-badge">HOY</span>':''}
            </td>
            <td class="r prop-muted">${d.ventas>0 ? fi(d.ventas) : '<span style="color:#333">—</span>'}</td>
            <td class="r">
              <span class="prop-bar-wrap"><span class="prop-bar-fill" style="width:${barPct}%"></span></span>
              ${d.gen>0 ? fi(d.gen) : '<span class="prop-muted">—</span>'}
            </td>
            <td class="r">${icpBadge(d.icp, d.icpEq)}</td>
            <td class="c prop-muted" style="font-size:11px">${d.q1.dias>0?`${d.q1.dias}d · ${fi(d.q1.take)}`:'—'}</td>
            <td class="c prop-muted" style="font-size:11px">${d.q2.dias>0?`${d.q2.dias}d · ${fi(d.q2.take)}`:'—'}</td>
            <td class="r prop-gold">${fi(d.take)}</td>
            <td class="r" style="color:${bc};font-weight:700">${d.balance>=0?'+':''}${fi(d.balance)}</td>
          </tr>`;
        }).join('')}
      </tbody>
      <tfoot>
        <tr>
          <td>TOTAL</td>
          <td class="r prop-muted">${totalVentas>0?fi(totalVentas):'—'}</td>
          <td class="r">${fi(totalGen)}</td>
          <td class="r">${totalICP!==null?`<span style="font-weight:700">${totalICP.toFixed(1)}%</span>`:'—'}</td>
          <td class="c prop-muted">${meses.reduce((s,m)=>s+byMes[m].q1.dias,0)}d · ${fi(meses.reduce((s,m)=>s+byMes[m].q1.take,0))}</td>
          <td class="c prop-muted">${meses.reduce((s,m)=>s+byMes[m].q2.dias,0)}d · ${fi(meses.reduce((s,m)=>s+byMes[m].q2.take,0))}</td>
          <td class="r prop-gold" style="font-size:14px">${fi(totalTake)}</td>
          <td class="r" style="font-weight:700;color:${totalGen-totalTake>=0?'var(--green)':'var(--red)'}">${totalGen-totalTake>=0?'+':''}${fi(totalGen-totalTake)}</td>
        </tr>
      </tfoot>
    </table>
    <div style="padding:12px 16px;font-size:9px;color:#444;border-top:1px solid #1a1a1a;line-height:1.8">
      <strong style="color:#555">ICP</strong> Índice de Conversión de Propina = Propina generada / Ventas.
      <span style="color:var(--green)">+13% excelente</span> ·
      <span style="color:var(--gold)">10–13% bueno</span> ·
      <span style="color:var(--red)">−10% a mejorar</span> ·
      <strong style="color:#555">Balance</strong> positivo = aportás más al pool de lo que retirás.
    </div>
  </div>`;

  el.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────────────────────
// PROPINAS GERENCIAL — Vista resumen manager/owner
// ─────────────────────────────────────────────────────────────────────────────
async function renderPropinasGerencial(el) {
  el.innerHTML = moduleBreadcrumb('fin','Propinas — Resumen Gerencial') +
    `<div style="padding:40px;text-align:center;color:#555;font-size:11px">Cargando datos...</div>`;

  // ── Fetch turnos ──────────────────────────────────────────────
  const r = await apiCall({ action:'getTurnosPropinas' });
  const turnos = (r?.data || []).map(t => ({ ...t, fecha: _normFecha(t.fecha) }));

  // ── ventasMesSal[mes][SAL_UP] = { ventas, pax } ──────────────
  const ventasMesSal = {};
  Object.keys(DIAS).forEach(fecha => {
    const mes = fecha.substring(0,7);
    const salData = DIAS[fecha]?.saloneros;
    if(!salData) return;
    Object.keys(salData).forEach(k => {
      const key = k.toUpperCase().trim();
      const s   = salData[k];
      if(!ventasMesSal[mes])      ventasMesSal[mes]      = {};
      if(!ventasMesSal[mes][key]) ventasMesSal[mes][key] = { ventas:0, pax:0 };
      ventasMesSal[mes][key].ventas += s.total || 0;
      ventasMesSal[mes][key].pax   += s.pax   || 0;
    });
  });

  // ── propMesSal[mes][SAL_UP] = { gen, take, dias, q1, q2 } ────
  const propMesSal = {};
  let turnoCount = 0;
  turnos.forEach(t => {
    const mes = t.fecha.substring(0,7);
    if(!mes || mes.length < 7) return;
    const day = parseInt(t.fecha.split('-')[2]||'0');
    turnoCount++;
    (t.datos?.lineas || []).forEach(l => {
      const key = (l.nombre||'').toUpperCase().trim();
      if(!key) return;
      if(!propMesSal[mes])      propMesSal[mes]      = {};
      if(!propMesSal[mes][key]) propMesSal[mes][key] = {
        gen:0, take:0, dias:0,
        q1:{ dias:0, gen:0, take:0 }, q2:{ dias:0, gen:0, take:0 }
      };
      const p = propMesSal[mes][key];
      const q = day <= 15 ? 'q1' : 'q2';
      p.gen  += l.propina_gen || 0;
      p.take += l.take_home  || 0;
      p.dias++;
      p[q].dias++;
      p[q].gen  += l.propina_gen || 0;
      p[q].take += l.take_home  || 0;
    });
  });

  // ── Meses con cualquier dato ──────────────────────────────────
  const mesesSet = new Set([
    ...Object.keys(propMesSal),
    ...Object.keys(ventasMesSal)
  ]);
  const meses = [...mesesSet].sort().reverse();

  if(!meses.length && !turnoCount) {
    el.innerHTML = moduleBreadcrumb('fin','Propinas — Resumen Gerencial') +
      emptyState('₡','Sin datos','Cargá reportes XLS y registrá turnos de propinas para ver el resumen gerencial');
    return;
  }

  const now    = new Date();
  const curKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  // ── Helpers ───────────────────────────────────────────────────
  const icpColor = icp => icp === null ? '#555' : icp >= 13 ? 'var(--green)' : icp >= 10 ? 'var(--gold)' : 'var(--red)';
  const icpSpan  = (icp, bold) => {
    if(icp === null) return '<span class="prop-muted">—</span>';
    const c = icpColor(icp);
    return `<span style="color:${c}${bold?';font-weight:700':''}">${icp.toFixed(1)}%</span>`;
  };

  // ── Agregar por mes (totales restaurante) ────────────────────
  // resMes[mes] = { ventas, gen, take, saloneros_set, turnos, q1gen, q2gen, q1take, q2take }
  const resMes = {};
  meses.forEach(m => {
    let ventas=0, gen=0, take=0, q1gen=0, q1take=0, q2gen=0, q2take=0;
    const salSet = new Set();
    // ventas de todos los saloneros ese mes
    Object.keys(ventasMesSal[m] || {}).forEach(k => { ventas += ventasMesSal[m][k].ventas; });
    // propinas de todos los empleados ese mes
    Object.keys(propMesSal[m] || {}).forEach(k => {
      const p = propMesSal[m][k];
      gen    += p.gen;  take   += p.take;
      q1gen  += p.q1.gen;  q1take += p.q1.take;
      q2gen  += p.q2.gen;  q2take += p.q2.take;
      salSet.add(k);
    });
    resMes[m] = { ventas, gen, take, sals: salSet.size, q1gen, q1take, q2gen, q2take };
  });

  // ── Turnos por mes ────────────────────────────────────────────
  const turnosPorMes = {};
  turnos.forEach(t => {
    const m = t.fecha.substring(0,7);
    turnosPorMes[m] = (turnosPorMes[m] || 0) + 1;
  });

  // ── Ranking saloneros MES ACTUAL ─────────────────────────────
  const curProp   = propMesSal[curKey]   || {};
  const curVentas = ventasMesSal[curKey] || {};
  const allSalsCur = new Set([...Object.keys(curProp), ...Object.keys(curVentas)]);

  const ranking = [...allSalsCur].map(k => {
    const p = curProp[k]   || { gen:0, take:0, dias:0, q1:{dias:0,gen:0,take:0}, q2:{dias:0,gen:0,take:0} };
    const v = curVentas[k] || { ventas:0, pax:0 };
    const icp = v.ventas > 0 && p.gen > 0 ? p.gen / v.ventas * 100 : null;
    return { k, gen:p.gen, take:p.take, dias:p.dias, ventas:v.ventas,
             balance: p.gen - p.take, icp,
             q1:p.q1, q2:p.q2 };
  }).sort((a,b) => (b.icp??-1) - (a.icp??-1));

  // ICP promedio equipo (mes actual)
  const icpVals = ranking.filter(s => s.icp !== null).map(s => s.icp);
  const icpEquipoCur = icpVals.length ? icpVals.reduce((s,v)=>s+v,0)/icpVals.length : null;

  // Alertas: saloneros ICP < 10
  const alertas = ranking.filter(s => s.icp !== null && s.icp < 10);

  // ── KPIs globales mes actual ─────────────────────────────────
  const curRes  = resMes[curKey] || { ventas:0, gen:0, take:0, sals:0, q1gen:0, q1take:0, q2gen:0, q2take:0 };
  const curIcpR = curRes.ventas > 0 && curRes.gen > 0 ? curRes.gen / curRes.ventas * 100 : null;
  const curTurnos = turnosPorMes[curKey] || 0;

  let html = moduleBreadcrumb('fin','Propinas — Resumen Gerencial');

  // ── Mes selector label ────────────────────────────────────────
  const [cy,cm] = curKey.split('-');
  html += `<div style="font-size:9px;letter-spacing:.2em;color:#555;margin-bottom:16px;text-transform:uppercase">
    ${_MESES_P[parseInt(cm)-1]} ${cy} · Período actual
  </div>`;

  // ── KPI cards ─────────────────────────────────────────────────
  const icpRColor = icpColor(curIcpR);
  html += `<div class="kpi-grid" style="margin-bottom:32px">
    <div class="kpi">
      <div class="kpi-label">ICP Restaurante</div>
      <div class="kpi-val" style="color:${icpRColor}">${curIcpR !== null ? curIcpR.toFixed(1)+'%' : '—'}</div>
      <div class="kpi-sub">Prop. generada / Ventas totales</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Pool generado</div>
      <div class="kpi-val">${fi(curRes.gen)}</div>
      <div class="kpi-sub">Total propinas en datáfono este mes</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Total distribuido</div>
      <div class="kpi-val" style="color:var(--gold)">${fi(curRes.take)}</div>
      <div class="kpi-sub">Take home total del equipo</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Turnos registrados</div>
      <div class="kpi-val">${curTurnos}</div>
      <div class="kpi-sub">${allSalsCur.size} empleado${allSalsCur.size!==1?'s':''} con propinas</div>
    </div>
  </div>`;

  // ── Alertas ───────────────────────────────────────────────────
  if(alertas.length) {
    html += `<div style="background:#1a0808;border:1px solid #4a1a1a;border-radius:3px;padding:14px 18px;margin-bottom:24px">
      <div style="font-size:9px;letter-spacing:.2em;color:var(--red);margin-bottom:10px;text-transform:uppercase">⚠ ICP bajo — requiere atención</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        ${alertas.map(s => `<span style="background:#2a0808;border:1px solid var(--red);border-radius:2px;padding:5px 12px;font-size:10px;color:#e08080">
          ${s.k} · <strong style="color:var(--red)">${s.icp.toFixed(1)}%</strong>
        </span>`).join('')}
      </div>
    </div>`;
  }

  // ── Ranking saloneros mes actual ──────────────────────────────
  if(ranking.length) {
    const maxGen = Math.max(...ranking.map(s => s.gen), 1);
    html += `<div class="prop-section" style="margin-bottom:28px">

function renderMisCompetencias(el){
  const name=CURRENT_USER;
  const myComps=COMPS.filter(c=>c.parts.includes(name));

  if(!myComps.length){
    el.innerHTML=emptyState('🏆','Sin competencias activas','El manager no ha creado competencias aún');
    return;
  }

  el.innerHTML=`<div class="sl">Mis competencias · ${name}</div>`;
  const today_mc=today();
  const stateOrder=c=>today_mc>c.fin?2:today_mc<c.inicio?1:0;
  const sortedMyComps=[...myComps].sort((a,b)=>{
    const diff=stateOrder(a)-stateOrder(b);
    if(diff!==0) return diff;
    // En curso: más reciente inicio primero
    if(stateOrder(a)===0) return b.inicio.localeCompare(a.inicio);
    // Próximas: más próxima primero
    if(stateOrder(a)===1) return a.inicio.localeCompare(b.inicio);
    // Finalizadas: más reciente primero
    return b.fin.localeCompare(a.fin);
  });
  sortedMyComps.forEach(comp=>{
    const ranking=buildCompRanking(comp);
    const myRank=ranking.findIndex(r=>r.sal===name)+1;
    const myData=ranking.find(r=>r.sal===name);
    const totalDias=Math.max(1,daysBetween(comp.inicio,comp.fin));
    const pasados=Math.min(Math.max(daysBetween(comp.inicio,today()),0),totalDias);

    const card=document.createElement('div');
    card.className='comp-card';
    card.innerHTML=`
      <div class="comp-head">
        <div><div class="comp-name">${esc(comp.nombre)}</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="comp-badge badge-${comp.tipo}">${comp.tipo}</span>
          ${comp.premio?`<span style="color:var(--gold);font-size:10px">🏅 ${comp.premio}</span>`:''}
        </div>
      </div>
      <div class="comp-body">
        <div style="display:flex;gap:20px;align-items:center;margin-bottom:18px;flex-wrap:wrap">
          <div style="text-align:center">
            <div style="font-family:Syne,sans-serif;font-size:48px;font-weight:800;color:${myRank===1?'var(--gold)':myRank===2?'#999':myRank===3?'#cd7f32':'var(--ink)'}">
              #${myRank}</div>
            <div style="font-size:9px;color:var(--muted);letter-spacing:.2em">MI POSICIÓN</div>
          </div>
          <div style="flex:1">
            <div class="comp-prod-tags">${comp.prods.map(p=>{const k=typeof p==='string'?p:p.name; const pts=typeof p==='string'?1:p.pts; const uds=myData?.prods[k]||0; return `<span class="prod-tag">${k}: <strong>${uds} uds</strong> · ${uds*pts}pts</span>`}).join('')}</div>
            <div style="font-size:9px;color:var(--muted);margin-top:8px">Progreso competencia · ${pasados}/${totalDias} días</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${(pasados/totalDias*100).toFixed(0)}%"></div></div>
          </div>
        </div>
        ${renderCompRankingTable(comp, ranking)}
      </div>
    `;
    el.appendChild(card);
  });
}

function renderMiSemana(el){
  el.innerHTML = '';
  const name = CURRENT_USER;
  const DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const DAYS_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const dowOrder = [1,2,3,4,5,6,0];

  // Group this salonero's data by day-of-week
  const byDow = {};
  Object.entries(DIAS).forEach(([date, dia]) => {
    const s = dia.saloneros?.[name];
    if(!s || !s.pax) return;
    const dow = new Date(date + 'T12:00:00').getDay();
    if(!byDow[dow]) byDow[dow] = [];
    byDow[dow].push({ date, ...s });
  });

  const activeDows = dowOrder.filter(d => byDow[d]);

  if(!activeDows.length){
    el.innerHTML = '<div style="padding:40px;text-align:center;color:#555">No hay suficientes días registrados aún.<br>Los patrones por día aparecen con el tiempo.</div>';
    return;
  }

  // Header
  el.innerHTML = `<div class="sl-header"><div class="sl">Mi semana · ${name}</div></div>`;

  // ── Cards por día ──
  const cardsWrap = document.createElement('div');
  cardsWrap.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:28px;';
  el.appendChild(cardsWrap);

  // Find best promPax day for highlighting
  const bestPromPax = Math.max(...activeDows.map(d => {
    const days = byDow[d];
    let vt=0, pax=0;
    days.forEach(s => { vt+=s.total; pax+=s.pax; });
    return pax ? vt/pax : 0;
  }));

  activeDows.forEach(dow => {
    const days = byDow[dow];
    let vt=0, pax=0, beb=0, com=0, iBeb=0, iCom=0;
    days.forEach(s => { vt+=s.total; pax+=s.pax; beb+=s.beb||0; com+=s.com||0; iBeb+=s.iBeb||0; iCom+=s.iCom||0; });
    const promPax  = pax ? vt/pax : 0;
    const bebPax   = pax ? iBeb/pax : 0;
    const ratioCB  = beb ? com/beb : 0;
    const ratioU   = iBeb ? iCom/iBeb : 0;
    const isBest   = Math.abs(promPax - bestPromPax) < 1;
    const borderColor = isBest ? 'var(--green)' : 'var(--gold)';

    const card = document.createElement('div');
    card.style.cssText = `background:var(--ink);border-radius:2px;padding:18px 20px;position:relative;overflow:hidden;`;
    card.innerHTML = `
      <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:${borderColor}"></div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">
        <div style="font-size:17px;font-weight:800;font-family:Syne,sans-serif;color:#f0ece4">${DAYS[dow]}</div>
        ${isBest ? '<div style="font-size:8px;color:var(--green);letter-spacing:.1em">✦ MEJOR DÍA</div>' : ''}
      </div>
      <div style="font-size:9px;letter-spacing:.2em;color:#555;margin-bottom:14px">${days.length} ${days.length===1?'vez':'veces'}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;">
        <div>
          <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:2px">Prom/PAX</div>
          <div style="font-size:15px;font-weight:700;font-family:Syne,sans-serif;color:#f0ece4">${fi(promPax)}</div>
        </div>
        <div>
          <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:2px">PAX promedio</div>
          <div style="font-size:15px;font-weight:700;font-family:Syne,sans-serif;color:#f0ece4">${Math.round(pax/days.length)}</div>
        </div>
        <div>
          <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:2px">Beb/PAX</div>
          <div style="font-size:14px;font-weight:700">${fmtBebPax(bebPax)}</div>
        </div>
        <div>
          <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:2px">Ratio C/B</div>
          <div style="font-size:12px">${fmtBothRatios(ratioCB, ratioU)}</div>
        </div>
      </div>`;
    cardsWrap.appendChild(card);
  });

  // ── Mini bar chart: Prom/PAX por día ──
  const chartTitle = document.createElement('div');
  chartTitle.innerHTML = '<div class="sl" style="margin-bottom:14px">Mi Prom/PAX por día</div>';
  el.appendChild(chartTitle);

  const chartWrap = document.createElement('div');
  chartWrap.style.cssText = 'display:flex;align-items:flex-end;gap:8px;height:100px;padding:0 4px;margin-bottom:28px;';

  dowOrder.forEach(dow => {
    const days = byDow[dow];
    const col = document.createElement('div');
    col.style.cssText = 'flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;';
    if(!days){
      col.innerHTML = `<div style="flex:1"></div><div style="font-size:9px;color:#333">${DAYS_SHORT[dow]}</div>`;
    } else {
      let vt=0, pax=0;
      days.forEach(s => { vt+=s.total; pax+=s.pax; });
      const avg = pax ? vt/pax : 0;
      const pct = bestPromPax ? (avg/bestPromPax*100) : 0;
      const isB = Math.abs(avg-bestPromPax)<1;
      col.innerHTML = `
        <div style="font-size:8px;color:#888;white-space:nowrap">${fi(avg)}</div>

        <div style="font-size:9px;color:#aaa;font-weight:600">${DAYS_SHORT[dow]}</div>
      `;
    }
    chartWrap.appendChild(col);
  });
  el.appendChild(chartWrap);

  // ── Comparativa: este salonero vs general por día ──
  const compTitle = document.createElement('div');
  compTitle.innerHTML = '<div class="sl" style="margin-bottom:14px">Vs promedio del restaurante</div>';
  el.appendChild(compTitle);

  const compTbl = document.createElement('table');
  compTbl.className = 'rt';
  compTbl.innerHTML = `<thead><tr>
    <th>Día</th><th>Mi Prom/PAX</th><th>Resto del restaurante</th><th>Diferencia</th><th>Días trabajados</th>
  </tr></thead>`;
  const compBody = document.createElement('tbody');

  activeDows.forEach(dow => {
    const myDays = byDow[dow];
    let myVt=0, myPax=0;
    myDays.forEach(s=>{ myVt+=s.total; myPax+=s.pax; });
    const myProm = myPax ? myVt/myPax : 0;

    // General for same days (all saloneros except this one)
    let genVt=0, genPax=0;
    (byDow[dow]||[]).forEach(dayEntry => {
      // byDow[dow] has this salonero's records, need to get gen from DIAS
    });
    // Get general from DIAS for those dates
    const datesForDow = Object.keys(DIAS).filter(date => new Date(date+'T12:00:00').getDay()===dow);
    datesForDow.forEach(date => {
      Object.values(DIAS[date]?.saloneros||{}).forEach(s => {
        genVt += s.total||0; genPax += s.pax||0;
      });
    });
    const genProm = genPax ? genVt/genPax : 0;
    const diff = myProm - genProm;
    const above = diff >= 0;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-weight:700">${DAYS[dow]}</td>

      <td>${fi(genProm)}</td>
      <td><span class="badge badge-${above?'up':'down'}">${above?'▲':'▼'} ${fi(Math.abs(diff))}</span></td>
      <td style="color:#555">${myDays.length}</td>

    compBody.appendChild(tr);
  });
  compTbl.appendChild(compBody);
  el.appendChild(compTbl);
}

  const lastDate = allDates[allDates.length-1];
  const lastObj  = new Date(lastDate+'T12:00:00');

  const defTo    = new Date(lastObj.getFullYear(), lastObj.getMonth()+1, 0).toISOString().slice(0,10);
  const monthKey = lastDate.slice(0,7); // YYYY-MM

  // ── SECCIÓN 1: Metas ──

  if(!METAS.global)    METAS.global    = {};
  if(!METAS.salMetas)  METAS.salMetas  = {};

  const gm = METAS.global;
  const METRIC_DEFS = [
    { key:'promPax',    label:'Prom/PAX',    placeholder:'ej: 15000', unit:'₡', hint:'Ticket promedio por persona' },
    { key:'bebPax',     label:'Beb/PAX',     placeholder:'ej: 1.2',   unit:'',  hint:'Bebidas por persona (ideal ≥ 1.2)' },
    { key:'ratioCB',    label:'Ratio C/B',   placeholder:'ej: 3.0',   unit:'',  hint:'Ratio comida/bebida en unidades' },
    { key:'ticketItem', label:'Ticket/item', placeholder:'ej: 7500',  unit:'₡', hint:'Precio promedio por producto' },
    { key:'ventas',     label:'Ventas/día',  placeholder:'ej: 800000',unit:'₡', hint:'Meta de ventas netas por día' },
  ];

  const metaSection = document.createElement('div');
  metaSection.style.cssText = 'background:var(--ink);border-radius:2px;padding:20px 24px;margin-bottom:24px;border-left:3px solid var(--gold);';
  metaSection.innerHTML = `
    <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:16px">🎯 Metas</div>

    <!-- Meta ventas mensual restaurante + Margen -->
    <div style="margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:720px;">
      <div>
        <div style="font-size:9px;color:#888;margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase">Meta mensual restaurante · ${monthKey}</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="meta-rest-inp" type="number" placeholder="Meta ventas mes en ₡"
            value="${metaRestaurante||''}"
            style="flex:1;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:7px 10px;color:#f0ece4;font-family:'DM Mono',monospace;font-size:11px;outline:none;">
          <button class="btn-sm" onclick="saveMetaRestaurante('${monthKey}')">Guardar</button>
        </div>
      </div>
      <div>
        <div style="font-size:9px;color:#888;margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase">% Margen del contador · ${monthKey}</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="meta-margen-inp" type="number" step="0.1" placeholder="ej: 27.5"
            value="${METAS.margen?.[monthKey]||''}"
            style="flex:1;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:7px 10px;color:#f0ece4;font-family:'DM Mono',monospace;font-size:11px;outline:none;">
          <button class="btn-sm" onclick="saveMetaMargen('${monthKey}')">Guardar</button>
        </div>
        <div style="font-size:9px;color:#444;margin-top:4px">Ganancia bruta % de venta bruta. Se muestra en pestaña Análisis.</div>
      </div>
    </div>

    <!-- Metas globales de performance -->
    <div style="margin-bottom:20px;">
      <div style="font-size:9px;color:#888;margin-bottom:10px;letter-spacing:.1em;text-transform:uppercase">Metas globales de performance (aplica a todos los saloneros)</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;" id="global-metas-grid">
        ${METRIC_DEFS.map(m => `
          <div style="background:#0a0a0a;border-radius:2px;padding:10px 12px;">
            <div style="font-size:9px;color:#888;margin-bottom:4px">${m.label} <span style="color:#555">· ${m.hint}</span></div>
            <input type="number" step="any" id="gmeta-${m.key}" placeholder="${m.placeholder}"
              value="${gm[m.key]||''}"
              style="width:100%;background:transparent;border:none;border-bottom:1px solid #2a2a2a;padding:4px 0;color:#f0ece4;font-family:'DM Mono',monospace;font-size:11px;outline:none;">
          </div>`).join('')}
      </div>
      <button class="btn-sm" style="margin-top:10px" onclick="saveGlobalMetas()">Guardar metas globales</button>
    </div>

    <!-- Overrides individuales — colapsable -->
    <div>
      <div style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;margin-bottom:8px;"
           onclick="const b=document.getElementById('overrides-body');const a=document.getElementById('overrides-arrow');const open=b.style.display!=='none';b.style.display=open?'none':'block';a.textContent=open?'▶':'▼';">
        <div style="font-size:9px;color:#888;letter-spacing:.1em;text-transform:uppercase">
          Overrides individuales <span style="color:#444;font-size:8px">(dejar vacío = usa meta global)</span>
        </div>
        <span id="overrides-arrow" style="font-size:10px;color:#555">▶</span>
      </div>
      <div id="overrides-body" style="display:none;">
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:10px;">
          <thead>
            <tr style="border-bottom:1px solid #222;">
              <th style="text-align:left;padding:6px 10px;color:#555;font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:400">Salonero</th>
              ${METRIC_DEFS.map(m=>`<th style="text-align:center;padding:6px 8px;color:#555;font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:400">${m.label}</th>`).join('')}
            </tr>
          </thead>
          <tbody id="sal-metas-tbody">
            ${ALL_SALS.map(name => {
              const sm = METAS.salMetas?.[name] || {};
              return `<tr style="border-bottom:1px solid #111;">
                <td style="padding:6px 10px;color:#aaa;white-space:nowrap">${name}</td>
                ${METRIC_DEFS.map(m=>`
                  <td style="padding:4px 6px;text-align:center;">
                    <input type="number" step="any" id="smeta-${name.replace(/\s/g,'_')}-${m.key}"
                      value="${sm[m.key]||''}" placeholder="${gm[m.key]||m.placeholder}"
                      style="width:80px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:2px;padding:3px 6px;color:#f0ece4;font-family:'DM Mono',monospace;font-size:10px;outline:none;text-align:center;">
                  </td>`).join('')}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <button class="btn-sm" style="margin-top:10px" onclick="saveSalMetas()">Guardar overrides</button>
      </div><!-- end overrides-body -->
    </div>
  `;
  el.appendChild(metaSection);

  // ── Progress bar meta restaurante ──
  if(metaRestaurante > 0){
    const datesInMonth = allDates.filter(d => d.startsWith(monthKey));
    let ventasMes = 0;
    datesInMonth.forEach(d => {
      const gen = aggGeneral([d]);
      ventasMes += gen.totalRest || gen.total;
    });
    const pctMeta = Math.min((ventasMes/metaRestaurante)*100, 100);
    // Dias del mes y proyección
    const daysInMonth = new Date(lastObj.getFullYear(), lastObj.getMonth()+1, 0).getDate();
    const daysPassed  = datesInMonth.length;
    const projected   = daysPassed ? (ventasMes/daysPassed)*daysInMonth : 0;
    const pctProj     = Math.min((projected/metaRestaurante)*100, 100);
    const onTrack     = projected >= metaRestaurante;

    const progSection = document.createElement('div');
    progSection.style.cssText = 'background:var(--ink);border-radius:2px;padding:20px 24px;margin-bottom:24px;';
    progSection.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
        <div>
          <div style="font-size:14px;font-weight:800;font-family:Syne,sans-serif;color:#f0ece4">Progreso · Meta mensual restaurante</div>
          <div style="font-size:9px;color:#555;margin-top:2px">${monthKey} · ${daysPassed} de ${daysInMonth} días con datos</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:800;font-family:Syne,sans-serif;color:var(--red)">${fi(ventasMes)}</div>
          <div style="font-size:9px;color:#555">de ${fi(metaRestaurante)} meta</div>
        </div>
      </div>
      <div style="height:8px;background:#1a1a1a;border-radius:4px;margin-bottom:8px;overflow:hidden;">
        <div style="height:100%;width:${pctMeta.toFixed(1)}%;background:${pctMeta>=100?'var(--green)':pctMeta>=70?'var(--gold)':'var(--red)'};border-radius:4px;transition:width .5s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;">
        <span style="color:#888">${pctMeta.toFixed(1)}% completado</span>
        <span style="color:${onTrack?'var(--green)':'var(--red)'}">
          ${onTrack?'✓ En camino':'⚠ Por debajo'} · Proyección: ${fi(projected)} (${pctProj.toFixed(0)}%)
        </span>
      </div>
      <div style="margin-top:12px;font-size:10px;color:#666;display:flex;gap:16px;flex-wrap:wrap;">
        <span>Meta diaria implícita: <strong style="color:#f0ece4">${fi(metaRestaurante/daysInMonth)}</strong></span>
        <span>Promedio actual/día: <strong style="color:${(ventasMes/Math.max(daysPassed,1)) >= (metaRestaurante/daysInMonth)?'var(--green)':'var(--red)'}">${fi(ventasMes/Math.max(daysPassed,1))}</strong></span>
        ${(()=>{
          const _diasRest = daysInMonth - daysPassed;
          const _faltante = metaRestaurante - ventasMes;
          if(_faltante <= 0) return '<span style="color:var(--green)">✓ Meta alcanzada</span>';
          if(_diasRest <= 0) return '<span style="color:var(--red)">⚠ Sin días restantes</span>';
          const _esf = _faltante / _diasRest;
          const _metaDia = metaRestaurante / daysInMonth;
          const _esfColor = _esf <= _metaDia ? 'var(--green)' : 'var(--red)';
          return `<span style="color:${_esfColor}">⚡ Esfuerzo req. (${_diasRest}d): <strong>${fi(_esf)}</strong>/día</span>`;
        })()} 
      </div>
    `;
    el.appendChild(progSection);
  }

  // ── SECCIÓN 2: Filtro de rango ──
  const filterBar = document.createElement('div');
  filterBar.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px;';
  filterBar.innerHTML = `
    <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a5040;font-weight:600">Período de evaluación</span>
    <input type="date" id="eval-from" value="${defFrom}" style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:5px 8px;color:#f0ece4;font-size:11px;">
    <span style="color:#555">→</span>
    <input type="date" id="eval-to" value="${defTo}" style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:5px 8px;color:#f0ece4;font-size:11px;">
    <button class="btn-sm" onclick="applyEvalFilter()">Aplicar</button>
    <button class="btn-sm" onclick="setEvalPreset('month')">Este mes</button>
    <button class="btn-sm" onclick="setEvalPreset('week')">Última semana</button>
    <button class="btn-sm" onclick="setEvalPreset('all')">Todo</button>
  `;
  el.appendChild(filterBar);

  const evalContent = document.createElement('div');
  evalContent.id = 'eval-content';
  el.appendChild(evalContent);
  // JS listeners for eval date inputs
  setTimeout(() => {
    const ef = document.getElementById('eval-from');
    const et = document.getElementById('eval-to');
    function watchEvalInput(inp, fn){
      if(!inp) return;
      let last = inp.value;
      ['change','input','blur'].forEach(e => inp.addEventListener(e, ()=>{ if(inp.value!==last){last=inp.value;fn();} }));
      inp.addEventListener('focus', ()=>{
        const p=setInterval(()=>{ if(document.activeElement!==inp){clearInterval(p);return;} if(inp.value!==last){last=inp.value;fn();} },300);
        setTimeout(()=>clearInterval(p),30000);
      });
    }
    watchEvalInput(ef, applyEvalFilter);
    watchEvalInput(et, applyEvalFilter);
  }, 50);

  window.saveMetaMargen = function(mk){
    const val = parseFloat(document.getElementById('meta-margen-inp')?.value) || 0;
    if(!METAS.margen) METAS.margen = {};
    METAS.margen[mk] = val;
    saveMetas(); renderEvaluacion(el);
  };
  window.saveMetaRestaurante = function(mk){
    const val = parseFloat(document.getElementById('meta-rest-inp')?.value) || 0;
    if(!METAS.restaurante) METAS.restaurante = {};
    METAS.restaurante[mk] = val;
    saveMetas(); renderEvaluacion(el);
  };
  window.saveGlobalMetas = function(){
    if(!METAS.global) METAS.global = {};
    ['promPax','bebPax','ratioCB','ticketItem','ventas'].forEach(key => {
      const inp = document.getElementById('gmeta-'+key);
      if(inp){ const v=parseFloat(inp.value)||0; METAS.global[key]=v; }
    });
    saveMetas(); renderEvaluacion(el);
  };
  window.saveSalMetas = function(){
    if(!METAS.salMetas) METAS.salMetas = {};
    ALL_SALS.forEach(name => {
      const safe = name.replace(/\s/g,'_');
      METAS.salMetas[name] = METAS.salMetas[name] || {};
      ['promPax','bebPax','ratioCB','ticketItem','ventas'].forEach(key => {
        const inp = document.getElementById('smeta-'+safe+'-'+key);
        if(inp){ const v=parseFloat(inp.value)||0; METAS.salMetas[name][key]=v||undefined; }
      });
    });
    saveMetas(); renderEvaluacion(el);
  };
  // Legacy — keep for backward compat
  window.saveMetasSaloneros = window.saveSalMetas;
  window.applyEvalFilter = function(){
    const from = document.getElementById('eval-from')?.value || defFrom;
    const to   = document.getElementById('eval-to')?.value   || defTo;
    buildEvalContent(from, to);
  };
  window.setEvalPreset = function(preset){
    const last = new Date(lastDate+'T12:00:00');
    let from, to = lastDate;
    if(preset==='month'){
      from = defFrom; to = defTo;
    } else if(preset==='week'){
      const d = new Date(last); d.setDate(d.getDate()-6);
      from = d.toISOString().slice(0,10);
    } else {
      from = allDates[0]; to = lastDate;
    }
    document.getElementById('eval-from').value = from;
    document.getElementById('eval-to').value   = to;
    buildEvalContent(from, to);
  };

  buildEvalContent(defFrom, defTo);

  function buildEvalContent(fromStr, toStr){
    const cont = document.getElementById('eval-content');
    if(!cont) return;
    cont.innerHTML = '';
    const dates = allDates.filter(d => d >= fromStr && d <= toStr);
    if(!dates.length){
      cont.innerHTML = '<div style="padding:20px;text-align:center;color:#555">Sin datos en ese rango.</div>';
      return;
    }

    // ── Calcular métricas por salonero ──
    const evalData = ALL_SALS.map(name => {
      const diasConDatos = dates.filter(d => DIAS[d]?.saloneros?.[name]?.pax > 0);
      if(!diasConDatos.length) return null;

      // Acumulados
      let totVentas=0, totPax=0, totBeb=0, totiBeb=0;
      diasConDatos.forEach(d => {
        const s = DIAS[d].saloneros[name];
        totVentas += s.total||0; totPax += s.pax||0;
        totBeb += s.beb||0; totiBeb += s.iBeb||0;
      });
      const promPaxAcum = totPax ? totVentas/totPax : 0;
      const bebPaxAcum  = totPax ? totiBeb/totPax : 0;

      // Promedio general del restaurante en esos mismos días
      let genVt=0, genPax=0;
      diasConDatos.forEach(d => {
        Object.values(DIAS[d]?.saloneros||{}).forEach(s => {
          if(!s.esCajero){ genVt+=s.total||0; genPax+=s.pax||0; }
        });
      });
      const genProm = genPax ? genVt/genPax : 0;

      // Consistencia: % días sobre el promedio general de ese día
      let diasSobre=0;
      diasConDatos.forEach(d => {
        const s = DIAS[d].saloneros[name];
        const sProm = s.pax ? s.total/s.pax : 0;
        let dayGenVt=0, dayGenPax=0;
        Object.values(DIAS[d]?.saloneros||{}).forEach(x => {
          if(!x.esCajero){ dayGenVt+=x.total||0; dayGenPax+=x.pax||0; }
        });
        const dayGen = dayGenPax ? dayGenVt/dayGenPax : 0;
        if(sProm >= dayGen) diasSobre++;
      });
      const consistencia = diasConDatos.length ? (diasSobre/diasConDatos.length*100) : 0;

      // Tendencia: comparar primera mitad vs segunda mitad del período
      const mid = Math.floor(diasConDatos.length/2);
      let firstVt=0,firstPax=0,lastVt=0,lastPax=0;
      diasConDatos.slice(0,mid).forEach(d=>{const s=DIAS[d].saloneros[name];firstVt+=s.total||0;firstPax+=s.pax||0;});
      diasConDatos.slice(mid).forEach(d=>{const s=DIAS[d].saloneros[name];lastVt+=s.total||0;lastPax+=s.pax||0;});
      const firstProm = firstPax?firstVt/firstPax:0;
      const lastProm  = lastPax?lastVt/lastPax:0;
      const tendencia = firstProm ? ((lastProm-firstProm)/firstProm*100) : 0;

      // Meta individual
      const metaInd = METAS.saloneros?.[name] || 0;
      const vsMetaInd = metaInd ? ((promPaxAcum-metaInd)/metaInd*100) : null;

      return {
        name, diasConDatos: diasConDatos.length, promPaxAcum, bebPaxAcum,
        genProm, consistencia, tendencia, metaInd, vsMetaInd,
        vsGeneral: genProm ? ((promPaxAcum-genProm)/genProm*100) : 0
      };
    }).filter(Boolean).sort((a,b) => b.promPaxAcum - a.promPaxAcum);

    if(!evalData.length){
      cont.innerHTML = '<div style="padding:20px;text-align:center;color:#555">Sin datos de saloneros en ese rango.</div>';
      return;
    }

    // ── Tabla de evaluación ──
    const tblTitle = document.createElement('div');
    tblTitle.innerHTML = `<div class="sl" style="margin-bottom:14px">Evaluación · ${fmtDate(fromStr)} → ${fmtDate(toStr)}</div>`;
    cont.appendChild(tblTitle);

    const tblWrap = document.createElement('div');
    tblWrap.className = 'rt-wrap';
    const tbl = document.createElement('table');
    tbl.className = 'rt';
    tbl.innerHTML = `<thead><tr>
      <th>#</th><th>Salonero</th><th>Días</th>
      <th>Prom/PAX</th><th>vs General</th><th>vs Meta</th>
      <th>Beb/PAX</th><th>Consistencia</th><th>Tendencia</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');

    evalData.forEach((d,i) => {
      const tr = document.createElement('tr');
      const pos = i+1;

      // vs General
      const vsGenCls = d.vsGeneral>=0?'var(--green)':'var(--red)';
      const vsGenStr = `<span style="color:${vsGenCls};font-size:10px">${d.vsGeneral>=0?'▲':'▼'} ${Math.abs(d.vsGeneral).toFixed(1)}%</span>`;

      // vs Meta individual
      let vsMetaStr = '<span style="color:#555;font-size:10px">—</span>';
      if(d.vsMetaInd !== null){
        const cls = d.vsMetaInd>=0?'var(--green)':'var(--red)';
        vsMetaStr = `<div style="font-size:10px;color:${cls}">${d.vsMetaInd>=0?'▲':'▼'} ${Math.abs(d.vsMetaInd).toFixed(1)}%</div>
          <div style="font-size:9px;color:#555">meta ${fi(d.metaInd)}</div>`;
      } else if(d.metaInd===0){
        vsMetaStr = '<span style="font-size:9px;color:#444">sin meta</span>';
      }

      // Consistencia semáforo
      const consCls = d.consistencia>=70?'var(--green)':d.consistencia>=40?'#c8a030':'var(--red)';
      const consStr = `<div style="color:${consCls};font-weight:700">${d.consistencia.toFixed(0)}%</div>
        <div style="font-size:8px;color:#555">${Math.round(d.consistencia/100*d.diasConDatos)} de ${d.diasConDatos} días</div>`;

      // Tendencia flecha
      const tendCls = d.tendencia>2?'var(--green)':d.tendencia<-2?'var(--red)':'#888';
      const tendIcon = d.tendencia>2?'↗':d.tendencia<-2?'↘':'→';
      const tendStr = d.diasConDatos>=4
        ? `<span style="color:${tendCls};font-size:16px">${tendIcon}</span><span style="font-size:9px;color:${tendCls}"> ${d.tendencia>0?'+':''}${d.tendencia.toFixed(1)}%</span>`
        : '<span style="font-size:9px;color:#444">pocos datos</span>';

      tr.innerHTML = `
        <td><div class="rank-pos ${pos<4?'p'+pos:''}">${pos}</div></td>
        <td><div class="td-name">${d.name}</div></td>
        <td style="color:#888;font-size:11px">${d.diasConDatos}</td>
        <td style="font-weight:700">${fi(d.promPaxAcum)}</td>
        <td>${vsGenStr}<div style="font-size:8px;color:#555">gen: ${fi(d.genProm)}</div></td>
        <td>${vsMetaStr}</td>
        <td>${fmtBebPax(d.bebPaxAcum)}</td>
        <td>${consStr}</td>
        <td>${tendStr}</td>
      `;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    tblWrap.appendChild(tbl);
    cont.appendChild(tblWrap);

    // ── Tarjetas individuales con metas ──
    if(evalData.some(d => d.metaInd > 0)){
      const mTitle = document.createElement('div');
      mTitle.innerHTML = '<div class="sl" style="margin:24px 0 14px">Progreso metas individuales</div>';
      cont.appendChild(mTitle);

      const mGrid = document.createElement('div');
      mGrid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;';
      cont.appendChild(mGrid);

      evalData.filter(d=>d.metaInd>0).forEach(d => {
        const pct = Math.min((d.promPaxAcum/d.metaInd)*100,100);
        const color = pct>=100?'var(--green)':pct>=80?'var(--gold)':'var(--red)';
        const card = document.createElement('div');
        card.style.cssText = 'background:var(--ink);border-radius:2px;padding:16px 18px;';
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
            <div style="font-weight:700;color:#f0ece4">${d.name}</div>
            <div style="font-size:12px;font-weight:700;color:${color}">${pct.toFixed(0)}%</div>
          </div>
          <div style="height:5px;background:#1a1a1a;border-radius:3px;margin-bottom:8px;overflow:hidden;">
            <div style="height:100%;width:${pct.toFixed(1)}%;background:${color};border-radius:3px;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:9px;color:#555;">
            <span>Actual: <strong style="color:#f0ece4">${fi(d.promPaxAcum)}</strong></span>
            <span>Meta: <strong style="color:#f0ece4">${fi(d.metaInd)}</strong></span>
          </div>
        `;
        mGrid.appendChild(card);
      });
    }
  }
}

// ── PRODUCTOS UPLOAD (desde Config) ───────────────────────────
// Parsea el XLS de productos en el browser usando el parser BIFF8 existente
// y sube la lista clasificada a Google Sheets
async function handleProductosUpload(input) {
  const file = input.files[0];
  if(!file) return;
  const statusEl = document.getElementById('prod-upload-status');
  const setStatus = (msg, color='#888') => {
    if(statusEl) statusEl.innerHTML = `<span style="color:${color}">${msg}</span>`;
  };
  setStatus('⟳ Leyendo archivo...');

  try {
    if(!BACKEND_URL){ setStatus('✗ Sin backend configurado','var(--red)'); return; }

    const buf  = await file.arrayBuffer();
    const b    = new Uint8Array(buf);
    const name = file.name.toLowerCase();
    const isXlsx = b[0]===0x50 && b[1]===0x4B; // PK magic = ZIP = xlsx

    // ── Helpers ──────────────────────────────────────────────────
    const u16 = p => b[p]   | (b[p+1]<<8);
    const u32 = p => b[p]   | (b[p+1]<<8) | (b[p+2]<<16) | (b[p+3]<<24);
    const dec = new TextDecoder('utf-8');

    // ── Classification rules ─────────────────────────────────────
    const NON_FOOD = new Set(['REMERAS','TSHIRTS','T-DARUMAS','T-GORRAS','T-STICKERS','GIFT CARDS','A PAX']);
    const BEV      = new Set(['BEBIDAS']);
    const CORT     = new Set(['X CORTESIAS']);
    const PERS     = new Set(['PERSONAL','XX DUEÑOS']);
    const isValidName = s =>
      s && s.length >= 2 && s.length <= 80 &&
      [...s].filter(c => c.charCodeAt(0) >= 32 && c.charCodeAt(0) <= 255).length / s.length > 0.85;

    let rows = {};  // { rowIndex: { colIndex: stringValue } }

    if(isXlsx){
      // ── XLSX (ZIP+XML) ─────────────────────────────────────────
      // 1. Find End of Central Directory to get Central Directory location
      let eocd = -1;
      for(let i = b.length - 22; i >= 0; i--){
        if(b[i]===0x50 && b[i+1]===0x4B && b[i+2]===0x05 && b[i+3]===0x06){ eocd=i; break; }
      }
      if(eocd < 0) throw new Error('Archivo XLSX inválido');

      // 2. Parse Central Directory → get real comp_size and offset for each file
      //    (Central Directory always has correct sizes even with data descriptors)
      const cdStart = u32(eocd+16);
      const cdSize  = u32(eocd+12);
      const entries = {};
      let p = cdStart;
      while(p < cdStart + cdSize && u32(p) === 0x02014B50){
        const fnLen  = u16(p+28), exLen = u16(p+30), cmLen = u16(p+32);
        entries[dec.decode(b.slice(p+46, p+46+fnLen))] = {
          compSize: u32(p+20),
          lhOffset: u32(p+42),
          method:   u16(p+10)
        };
        p += 46 + fnLen + exLen + cmLen;
      }

      // 3. Read + decompress one ZIP entry
      const readEntry = async entryName => {
        const e = entries[entryName];
        if(!e) return null;
        const lh   = e.lhOffset;
        const ds   = lh + 30 + u16(lh+26) + u16(lh+28); // skip local header
        const comp = b.slice(ds, ds + e.compSize);
        if(e.method === 0) return comp;            // stored, no compression
        if(e.method !== 8) throw new Error('Compression method ' + e.method + ' not supported');
        // deflate-raw via DecompressionStream
        const stream = new DecompressionStream('deflate-raw');
        const writer = stream.writable.getWriter();
        writer.write(comp); writer.close();
        const reader = stream.readable.getReader();
        const chunks = [];
        for(;;){ const {done,value} = await reader.read(); if(done) break; chunks.push(value); }
        const out = new Uint8Array(chunks.reduce((s,c)=>s+c.length, 0));
        let off = 0; chunks.forEach(c=>{ out.set(c,off); off+=c.length; });
        return out;
      };

      // 4. Parse sharedStrings.xml
      const sst = [];
      const ssRaw = await readEntry('xl/sharedStrings.xml');
      if(ssRaw){
        const ssDoc = new DOMParser().parseFromString(dec.decode(ssRaw), 'application/xml');
        ssDoc.querySelectorAll('si').forEach(si =>
          sst.push([...si.querySelectorAll('t')].map(t => t.textContent).join(''))
        );
      }

      // 5. Parse sheet1.xml
      const shRaw = await readEntry('xl/worksheets/sheet1.xml');
      if(!shRaw) throw new Error('No se pudo leer la hoja del XLSX');
      const shDoc = new DOMParser().parseFromString(dec.decode(shRaw), 'application/xml');
      shDoc.querySelectorAll('row').forEach(rowEl => {
        const r = parseInt(rowEl.getAttribute('r')) - 1;
        rows[r] = {};
        rowEl.querySelectorAll('c').forEach(cell => {
          // Col ref: "A1" → col 0, "E5" → col 4
          const colStr = cell.getAttribute('r').replace(/[0-9]/g,'');
          const col = colStr.split('').reduce((a,c) => a*26 + (c.charCodeAt(0)-64), 0) - 1;
          const vEl = cell.querySelector('v');
          if(!vEl) return;
          rows[r][col] = cell.getAttribute('t')==='s'
            ? (sst[parseInt(vEl.textContent)] ?? '')
            : vEl.textContent;
        });
      });

    } else {
      // ── XLS (BIFF8 / OLE2) ────────────────────────────────────
      const r16 = (d,p) => d[p] | (d[p+1]<<8);
      const r32 = (d,p) => d[p] | (d[p+1]<<8) | (d[p+2]<<16) | (d[p+3]<<24);
      const secSz = 1 << r16(b,30);
      const fat = [];
      for(let i=0; i<109; i++){
        const fsn = r32(b, 76+i*4);
        if(fsn >= 0xFFFFFFFC) break;
        for(let j=0; j<secSz/4; j++) fat.push(r32(b, 512+fsn*secSz+j*4));
      }
      const dirOff  = 512 + r32(b,48)*secSz;
      const wbStart = r32(b, dirOff+128+116);
      const wbSize  = r32(b, dirOff+128+120);
      const wbData  = new Uint8Array(wbSize);
      let pos=0, sec=wbStart;
      while(sec<0xFFFFFFFC && pos<wbSize){
        const chunk = Math.min(secSz, wbSize-pos);
        wbData.set(b.slice(512+sec*secSz, 512+sec*secSz+chunk), pos);
        pos+=chunk; sec=fat[sec]??0xFFFFFFFF;
      }
      const sst = [];
      let i=0;
      while(i < wbData.length-4){
        const rt=r16(wbData,i), rl=r16(wbData,i+2);
        if(rt === 0x00FC){ // SST
          let p=i+12;
          for(let s=0; s<r32(wbData,i+8); s++){
            if(p+2>=wbData.length) break;
            const nc=r16(wbData,p); p+=2;
            const fl=wbData[p]; p+=1;
            let rc=0;
            if(fl&0x08){ rc=r16(wbData,p); p+=2; }
            if(fl&0x04) p+=4;
            let str='';
            if(!(fl&0x01)){ for(let c=0;c<nc;c++) str+=String.fromCharCode(wbData[p+c]); p+=nc; }
            else { for(let c=0;c<nc;c++) str+=String.fromCharCode(r16(wbData,p+c*2)); p+=nc*2; }
            p+=rc*4; sst.push(str);
          }
        } else if(rt===0x00FD && rl>=10){
          const row=r16(wbData,i+4), col=r16(wbData,i+6), idx=r32(wbData,i+10);
          if(!rows[row]) rows[row]={};
          if(idx<sst.length) rows[row][col]=sst[idx];
        }
        i+=4+rl;
      }
    }

    // ── Detectar formato del archivo ─────────────────────────────
    // Formato A (POS): col0=CodigoTipo, col1=NombreClasif, col3=NombreSubClasif, col4=Nombre
    // Formato B (nuestro): col0=Nombre, col1=Tipo, col2=Clasificacion, col3=SubClasif, col4=Mult
    const header0 = (rows[0]?.[0]??'').toString().trim().toLowerCase();
    const header1 = (rows[0]?.[1]??'').toString().trim().toLowerCase();
    const isOurFormat = header0 === 'nombre' && header1 === 'tipo';

    const seen = {};
    Object.keys(rows).map(Number).sort((a,b)=>a-b).slice(1).forEach(r => {
      const row = rows[r];

      if(isOurFormat){
        // ── Formato propio (lista_productos_satori.xlsx) ──
        // col0=Nombre, col1=Tipo, col2=Clasificacion, col3=SubClasificacion, col4=Multiplicador
        const nombre = (row[0]??'').toString().trim().toUpperCase();
        const tipo   = (row[1]??'').toString().trim().toLowerCase();
        const clas   = (row[2]??'').toString().trim();
        const subcl  = (row[3]??'').toString().trim();
        const mult   = parseFloat(row[4]) || 1;
        if(!nombre || nombre==='NOMBRE' || !isValidName(nombre)) return;
        const tipoFinal = tipo.trim().toLowerCase();
        if(!tipoFinal || tipoFinal === 'nan' || tipoFinal === 'tipo') return;
        if(seen[nombre]) return;
        seen[nombre] = { tipo: tipoFinal, clas, subcl, mult };

      } else {
        // ── Formato POS (lista_de_productos.xlsx del sistema) ──
        // col1=NombreClasif, col3=NombreSubClasif, col4=Nombre
        const nombre = (row[4]??'').toString().trim().toUpperCase();
        const cat    = (row[1]??'').toString().trim().toUpperCase();
        const subcl  = (row[3]??'').toString().trim();
        if(!nombre || !cat || nombre==='NOMBRE' || !isValidName(nombre)) return;
        if(seen[nombre]) return;
        let tipo;
        if(NON_FOOD.has(cat))  tipo = 'nofood';
        else if(BEV.has(cat))  tipo = 'bebida';
        else if(CORT.has(cat)) tipo = 'cortesia';
        else if(PERS.has(cat)) tipo = 'personal';
        else                    tipo = 'comida';
        const isWineBottle = (cat === 'VINOS' || cat === 'VINOS AN') &&
          (nombre.includes('BOTELLA') || nombre.includes('PROMO BBOTELLA'));
        const mult = isWineBottle ? 5 : 1;
        seen[nombre] = { tipo, clas: cat, subcl, mult };
      }
    });

    const items = Object.entries(seen).map(([nombre,v]) => ({ nombre, ...v }));
    if(items.length < 5){
      setStatus('✗ No se encontraron productos. ¿Es el archivo correcto?','var(--red)'); return;
    }

    // ── Save to Google Sheets ─────────────────────────────────────
    setStatus(`⟳ Guardando ${items.length} productos en Sheets...`);
    const result = await apiPost({ action:'saveProductos', data:JSON.stringify(items) });
    if(!result?.ok){
      setStatus('✗ Error al guardar: ' + (result?.error||'sin respuesta'),'var(--red)'); return;
    }

    // ── Update local PRODUCT_MAP ──────────────────────────────────
    PRODUCT_MAP = {};
    items.forEach(p => { PRODUCT_MAP[p.nombre] = { tipo:p.tipo, clas:p.clas, subcl:p.subcl }; });
    PRODUCTOS_LOADED = true;
    _PROD_NORM_CACHE = null;
    localStorage.setItem('satori_productos', JSON.stringify(PRODUCT_MAP));

    const counts = items.reduce((acc,p) => { acc[p.tipo]=(acc[p.tipo]||0)+1; return acc; }, {});
    const statsStr = [
      counts.bebida         && `${counts.bebida} bebidas`,
      counts.merchandising  && `${counts.merchandising} merchandising`,
      counts.comida    && `${counts.comida} comidas`,
      counts.cortesia  && `${counts.cortesia} cortesías`,
      counts.personal  && `${counts.personal} personal`,
      counts.nofood    && `${counts.nofood} merch`,
    ].filter(Boolean).join(' · ');
    setStatus(`✓ ${items.length} productos · ${statsStr}`, '#4a7');
    setTimeout(() => renderConfig(document.getElementById('view-config')), 500);

  } catch(err){
    console.error('handleProductosUpload:', err);
    setStatus('✗ Error: ' + err.message, 'var(--red)');
  }
}

function exportCSV(filename,headers,rows){var BOM='\uFEFF';var lines=[headers.join(',')];rows.forEach(function(row){lines.push(row.map(function(cell){var s=String(cell===null||cell===undefined?'':cell);if(s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0){s='"'+s.replace(/"/g,'""')+'"';}return s;}).join(','));});var csv=BOM+lines.join('\n');var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1000);}
function exportarReporteVentas(rows,tot,periodoLabel){var headers=['Dia','Semana','Venta Bruta','IVA','Servicio','Venta Neta','Salon','Delivery','PAX','Prom/PAX'];var data=rows.map(function(r){return[r.dayNum,r.dow,Math.round(r.ventaBruta),Math.round(r.iva),Math.round(r.serv),Math.round(r.ventaNeta),Math.round(r.salon),Math.round(r.delivery),r.pax,Math.round(r.promedio)];});data.push(['TOTAL','',Math.round(tot.ventaBruta),Math.round(tot.iva),Math.round(tot.serv),Math.round(tot.ventaNeta),Math.round(tot.salon),Math.round(tot.delivery),tot.pax,Math.round(tot.promedio)]);exportCSV('satori_ventas_'+periodoLabel.replace(/ /g,'_')+'.csv',headers,data);}
function exportarReporteMix(clasMap,clasOrd,totG,periodoLabel){var headers=['Clasificacion','Subclasificacion','Producto','Tipo','Unidades','Monto','% Total','% Clasif','Salon','Delivery'];var data=[];clasOrd.forEach(function(clas){var cd=clasMap[clas];Object.keys(cd.subcls).sort().forEach(function(subcl){var sd=cd.subcls[subcl];sd.prods.slice().sort(function(a,b){return a.nombre<b.nombre?-1:1;}).forEach(function(p){var pct=totG?(p.monto/totG*100):0;var pctClas=cd.monto?(p.monto/cd.monto*100):0;data.push([clas,subcl,p.nombre,p.tipo,Math.round(p.unidades),Math.round(p.monto),pct.toFixed(2)+'%',pctClas.toFixed(2)+'%',Math.round(p.salon||0),Math.round(p.delivery||0)]);});});});exportCSV('satori_mix_'+periodoLabel.replace(/ /g,'_')+'.csv',headers,data);}
function renderContabilidad(el){
  el.innerHTML = moduleBreadcrumb('fin','Ventas');

  const allDates = getDates().sort();
  if(!allDates.length){
    el.innerHTML = '<div style="padding:40px;text-align:center;color:#888">Sin datos. Subí los XLS primero.</div>';
    return;
  }

  // ── Month/Year picker ──────────────────────────────────────────
  const months = {};
  allDates.forEach(d => {
    const [y,m] = d.split('-');
    const key = `${y}-${m}`;
    if(!months[key]) months[key] = { year:+y, month:+m, dates:[] };
    months[key].dates.push(d);
  });

  const monthKeys = Object.keys(months).sort().reverse();

  // Años disponibles para botones "Todo YYYY"
  const yearsPresent = [...new Set(monthKeys.map(k => k.slice(0,4)))].sort().reverse();

  // Persist selected month (o 'todo-YYYY')
  if(!renderContabilidad._month ||
     (!months[renderContabilidad._month] && !renderContabilidad._month.startsWith('todo-')))
    renderContabilidad._month = monthKeys[0];

  // Picker UI
  const pickerWrap = document.createElement('div');
  pickerWrap.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;align-items:center;';
  const pickerLabel = document.createElement('span');
  pickerLabel.style.cssText = 'font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#888;';
  pickerLabel.textContent = 'Mes:';
  pickerWrap.appendChild(pickerLabel);

  const MONTH_NAMES = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  // Botones "Todo YYYY" — uno por año, primero
  yearsPresent.forEach(yr => {
    const todoKey = 'todo-' + yr;
    const btn = document.createElement('div');
    btn.style.cssText = 'padding:4px 12px;border-radius:2px;font-size:9px;letter-spacing:.1em;cursor:pointer;border:1px solid var(--border);transition:all .15s;user-select:none;font-weight:700;';
    btn.textContent = 'Todo ' + yr;
    btn.dataset.key = todoKey;
    btn.onclick = () => { renderContabilidad._month = todoKey; renderContabilidad(el); };
    pickerWrap.appendChild(btn);
  });

  // Botones por mes
  monthKeys.forEach(k => {
    const {year,month} = months[k];
    const btn = document.createElement('div');
    btn.style.cssText = 'padding:4px 12px;border-radius:2px;font-size:9px;letter-spacing:.1em;cursor:pointer;border:1px solid var(--border);transition:all .15s;user-select:none;';
    btn.textContent = MONTH_NAMES[month] + ' ' + year;
    btn.dataset.key = k;
    btn.onclick = () => { renderContabilidad._month = k; renderContabilidad(el); };
    pickerWrap.appendChild(btn);
  });
  el.appendChild(pickerWrap);

  // ── Modo Todo año vs mes individual ───────────────────────────
  const isTodo = renderContabilidad._month.startsWith('todo-');
  const todoYear = isTodo ? renderContabilidad._month.slice(5) : null;

  // ── Build daily data ──────────────────────────────────────────
  const selKey = renderContabilidad._month;
  const selDates = isTodo
    ? monthKeys.filter(k => k.startsWith(todoYear)).flatMap(k => months[k].dates).sort()
    : months[selKey].dates.sort();
  const year  = isTodo ? +todoYear : months[selKey].year;
  const month = isTodo ? null      : months[selKey].month;
  const DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  // Update pill styles
  pickerWrap.querySelectorAll('[data-key]').forEach(b => {
    const active = b.dataset.key === selKey;
    b.style.background  = active ? 'var(--ink)' : 'transparent';
    b.style.color       = active ? 'var(--gold)' : '#888';
    b.style.borderColor = active ? 'var(--ink)' : 'var(--border)';
  });

  const rows = selDates.map(d => {
    const day  = DIAS[d];
    const sals = Object.values(day?.saloneros || {});
    const nonCaj = sals.filter(s => !s.esCajero);
    const caj    = sals.filter(s =>  s.esCajero);

    // VentaNeta = suma col D (MontoTotal) de todos los saloneros
    // IVA       = suma col E — guardado en s.iva desde el parser
    // Servicio  = suma col F — guardado en s.serv desde el parser
    const ventaNeta  = nonCaj.reduce((a,s) => a+(s.total||0), 0)
                     + caj.reduce((a,s) => a+(s.total||0), 0);
    const ivaStored  = nonCaj.reduce((a,s) => a+(s.iva||0),  0)
                     + caj.reduce((a,s) => a+(s.iva||0), 0);
    const servStored = nonCaj.reduce((a,s) => a+(s.serv||0), 0)
                     + caj.reduce((a,s) => a+(s.serv||0), 0);
    const salNeta    = nonCaj.reduce((a,s) => a+(s.total||0), 0);
    // Fallback for old data without iva/serv stored
    const iva        = ivaStored  > 0 ? ivaStored  : Math.round(salNeta * 0.13);
    const serv       = servStored > 0 ? servStored : Math.round(salNeta * 0.10);
    const ventaBruta = ventaNeta + iva + serv;
    const salon      = nonCaj.reduce((a,s) => a+(s.total||0), 0);
    const delivery   = caj.reduce((a,s)   => a+(s.delivery||s.total||0), 0);
    const pax        = nonCaj.reduce((a,s) => a+(s.pax||0), 0);
    const promedio   = pax ? ventaNeta/pax : 0;

    const dateObj = new Date(d + 'T12:00:00');
    const dow = DOW[dateObj.getDay()];
    const dayNum = +d.split('-')[2];

    return { d, dayNum, dow, ventaBruta, iva, serv, ventaNeta, salon, delivery, pax, promedio, ivaEstimado: ivaStored === 0 && salNeta > 0 };
  });

  // ── Monthly totals ─────────────────────────────────────────────
  const tot = rows.reduce((a,r) => ({
    ventaBruta: a.ventaBruta+r.ventaBruta,
    iva:        a.iva+r.iva,
    serv:       a.serv+r.serv,
    ventaNeta:  a.ventaNeta+r.ventaNeta,
    salon:      a.salon+r.salon,
    delivery:   a.delivery+r.delivery,
    pax:        a.pax+r.pax,
  }), {ventaBruta:0,iva:0,serv:0,ventaNeta:0,salon:0,delivery:0,pax:0});
  tot.promedio = tot.pax ? tot.ventaNeta/tot.pax : 0;

  // ── Title ──────────────────────────────────────────────────────
  const title = document.createElement('div');
  title.className = 'sl';
  title.textContent = isTodo ? `Contabilidad · Todo ${year}` : `Contabilidad · ${MONTH_NAMES[month]} ${year}`;
  el.appendChild(title);

  // ── KPI summary cards ──────────────────────────────────────────
  const kpiGrid = document.createElement('div');
  kpiGrid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:18px 0 24px;overflow:hidden;';
  const kpis = [
    { label:'Venta Bruta',    val: tot.ventaBruta, color:'var(--gold)' },
    { label:'IVA',            val: tot.iva,         color:'var(--red)' },
    { label:'Servicio',       val: tot.serv,        color:'var(--red)' },
    { label:'Venta Neta',     val: tot.ventaNeta,   color:'#7ec8a0' },
    { label:'Ventas Salón',   val: tot.salon,       color:'#f0ece4' },
    { label:'Delivery',       val: tot.delivery,    color:'#f0ece4' },
    { label:'PAX Totales',    val: tot.pax,         color:'#f0ece4', noFormat:true },
    { label:'Prom/PAX',       val: tot.promedio,    color:'var(--gold)' },
  ];
  kpis.forEach(k => {
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--ink);padding:10px 12px;border-radius:2px;min-width:0;';
    card.innerHTML = `
      <div style="font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#666;margin-bottom:5px;white-space:nowrap">${k.label}</div>
      <div style="font-family:Syne,sans-serif;font-size:clamp(11px,1.4vw,16px);font-weight:800;color:${k.color};white-space:nowrap">
        ${k.noFormat ? Math.round(k.val).toLocaleString('es-CR') : '₡'+Math.round(k.val).toLocaleString('es-CR')}
      </div>`;
    kpiGrid.appendChild(card);
  });
  el.appendChild(kpiGrid);

  // Meta bar placeholder — rendered inside buildTable
  const _metaBarEl = document.createElement('div');
  _metaBarEl.id = 'cont-meta-bar';
  el.appendChild(_metaBarEl);

  // ── Daily table ────────────────────────────────────────────────
  const titleRow=document.createElement('div');titleRow.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;';
  const tableTitle=document.createElement('div');tableTitle.style.cssText='font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#888;';
  tableTitle.textContent=isTodo?`Detalle diario — ${selDates.length} días · ${year}`:`Detalle diario — ${selDates.length} días`;
  const exportBtnV=document.createElement('button');exportBtnV.className='btn-sm';exportBtnV.style.cssText='font-size:8px;padding:4px 10px;border-color:#2a4a2a;color:#7aaa7a;background:#0a1a0a;';
  exportBtnV.textContent='⬇ Exportar CSV';
  exportBtnV.onclick=()=>exportarReporteVentas(rows,tot,isTodo?`Todo_${year}`:`${MONTH_NAMES[month]}_${year}`);
  titleRow.appendChild(tableTitle);titleRow.appendChild(exportBtnV);el.appendChild(titleRow);

  const fmtC = v => v > 0 ? '₡'+Math.round(v).toLocaleString('es-CR') : '—';
  const fmtN = v => v > 0 ? Math.round(v).toLocaleString('es-CR') : '—';

  const colDefs = [
    { key:'dayNum',     label:'#',          align:'center', fmt: r => r.dayNum },
    { key:'dow',        label:'Día',         align:'left',   fmt: r => r.dow },
    { key:'ventaBruta', label:'Venta Bruta', align:'right',  fmt: r => fmtC(r.ventaBruta) },
    { key:'iva',        label:'IVA (13%)',   align:'right',  fmt: r => r.ivaEstimado ? fmtC(r.iva)+'*' : fmtC(r.iva) },
    { key:'serv',       label:'Servicio',    align:'right',  fmt: r => fmtC(r.serv) },
    { key:'ventaNeta',  label:'Venta Neta',  align:'right',  fmt: r => fmtC(r.ventaNeta), bold:true },
    { key:'salon',      label:'Salón',       align:'right',  fmt: r => fmtC(r.salon) },
    { key:'delivery',   label:'Delivery',    align:'right',  fmt: r => fmtC(r.delivery) },
    { key:'pax',        label:'PAX',         align:'center', fmt: r => fmtN(r.pax) },
    { key:'promedio',   label:'Prom/PAX',    align:'right',  fmt: r => fmtC(r.promedio) },
  ];

  // Sort state
  if(!renderContabilidad._sort) renderContabilidad._sort = { key:'dayNum', asc:true };

  function buildTable(sortKey, asc){
    renderContabilidad._sort = { key:sortKey, asc };
    const sorted = [...rows].sort((a,b) => {
      const va = a[sortKey], vb = b[sortKey];
      return asc ? (va>vb?1:va<vb?-1:0) : (va<vb?1:va>vb?-1:0);
    });

    // ── Meta progress bar (inside buildTable so sorted is available) ─────────
    {
      const _selMK = renderContabilidad._month;
      const _isTodo = _selMK.startsWith('todo-');
      const _mbarEl = document.getElementById('cont-meta-bar');
      if(_mbarEl) _mbarEl.innerHTML = '';

      let _metaV = 0;
      if(_isTodo) {
        const _yr = _selMK.slice(5);
        Object.keys(METAS.restaurante || {}).forEach(mk => {
          if(mk.startsWith(_yr)) _metaV += (METAS.restaurante[mk] || 0);
        });
      } else {
        _metaV = METAS.restaurante?.[_selMK] || 0;
      }

      if(_metaV > 0 && _mbarEl){
        const _ventasMes = rows.reduce((a,r)=>a+(r.ventaNeta||0),0);
        const _pct = Math.min((_ventasMes/_metaV)*100,100);
        let _dim, _dp, _proj, _ok, _label;
        if(_isTodo) {
          const _yr = +_selMK.slice(5);
          const _daysInYear = (new Date(_yr,11,31) - new Date(_yr,0,1)) / 86400000 + 1;
          _dp    = sorted.length;
          _dim   = _daysInYear;
          _proj  = _dp ? (_ventasMes/_dp)*_daysInYear : 0;
          _ok    = _ventasMes >= _metaV;
          _label = `Todo ${_yr} · ${_dp} días cargados`;
        } else {
          _dim   = new Date(parseInt(_selMK.slice(0,4)),parseInt(_selMK.slice(5,7)),0).getDate();
          _dp    = sorted.length;
          _proj  = _dp ? (_ventasMes/_dp)*_dim : 0;
          _ok    = _proj >= _metaV;
          _label = `Meta ${_selMK} · ${_dp} de ${_dim} días`;
        }
        _mbarEl.style.cssText='background:var(--ink);border-radius:2px;padding:14px 18px;margin-bottom:18px;border-left:3px solid '+(_ok?'var(--green)':'var(--red)')+';';
        _mbarEl.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#888">${_label}</span>
          <div>
            <span style="font-family:Syne,sans-serif;font-size:16px;font-weight:800;color:${_ok?'var(--green)':'var(--red)'}">${fi(_ventasMes)}</span>
            <span style="font-size:9px;color:#555;margin-left:6px">de ${fi(_metaV)}</span>
          </div></div>
          <div style="height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin-bottom:8px">
