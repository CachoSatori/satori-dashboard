// CONFIG (solo Owner)
// ═══════════════════════════════════════════════════════════════
// ── PRODUCTOS UPLOAD (desde Config) ───────────────────────────
// Parsea el XLS de productos en el browser usando el parser BIFF8 existente
// y sube la lista clasificada a Google Sheets
async function handleProductosUpload(input) {
  const file = input.files[0];
  if(!file) return;
  const statusEl = document.getElementById('prod-upload-status');
  if(statusEl) statusEl.textContent = '⟳ Leyendo archivo...';

  try {
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    const fname = file.name.toLowerCase();

    // Clasificación por categoría
    const NON_FOOD = new Set(['REMERAS','TSHIRTS','T-DARUMAS','T-GORRAS','T-STICKERS','GIFT CARDS','A PAX']);
    const BEV      = new Set(['BEBIDAS']);
    const CORT     = new Set(['X CORTESIAS']);
    const PERS     = new Set(['PERSONAL','XX DUEÑOS']);
    const isValidName = s => s && s.length>=2 && s.length<=80 &&
      [...s].filter(c=>c.charCodeAt(0)>=32&&c.charCodeAt(0)<=255).length/s.length>0.85;

    let rows = {};

    const isXlsx = fname.endsWith('.xlsx') || fname.endsWith('.xlsm') ||
      (bytes[0]===0x50&&bytes[1]===0x4B&&bytes[2]===0x03&&bytes[3]===0x04);

    if(isXlsx){
      // ── XLSX: read ZIP using Central Directory (handles data descriptors correctly) ──
      const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const u32 = p => dv.getUint32(p, true);
      const u16 = p => dv.getUint16(p, true);

      // Find End of Central Directory record (search from end)
      let eocdPos = -1;
      for(let i = bytes.length-22; i >= 0; i--){
        if(bytes[i]===0x50&&bytes[i+1]===0x4B&&bytes[i+2]===0x05&&bytes[i+3]===0x06){
          eocdPos = i; break;
        }
      }
      if(eocdPos < 0) throw new Error('No es un archivo XLSX válido (no se encontró directorio ZIP)');

      const cdSize  = u32(eocdPos + 12);
      const cdStart = u32(eocdPos + 16);

      // Build entry map from Central Directory
      const entries = {};
      let cdPos = cdStart;
      while(cdPos < cdStart + cdSize){
        if(u32(cdPos) !== 0x02014B50) break;
        const fnLen    = u16(cdPos+28);
        const extraLen = u16(cdPos+30);
        const cmtLen   = u16(cdPos+32);
        const compSize = u32(cdPos+20);
        const lhOffset = u32(cdPos+42);
        const fn = new TextDecoder().decode(bytes.slice(cdPos+46, cdPos+46+fnLen));
        entries[fn] = { compSize, lhOffset };
        cdPos += 46 + fnLen + extraLen + cmtLen;
      }

      // Read a ZIP entry: get compressed data from local file header + decompress
      async function readEntry(name){
        const e = entries[name];
        if(!e) return null;
        const lh = e.lhOffset;
        if(u32(lh) !== 0x04034B50) return null;
        const lhFnLen    = u16(lh+26);
        const lhExtraLen = u16(lh+28);
        const dataStart  = lh + 30 + lhFnLen + lhExtraLen;
        const compMethod = u16(lh+8);
        const compressed = bytes.slice(dataStart, dataStart + e.compSize);
        if(compMethod === 0) return compressed;
        if(compMethod === 8){
          const ds = new DecompressionStream('deflate-raw');
          const w = ds.writable.getWriter();
          w.write(compressed); w.close();
          const chunks = []; const r = ds.readable.getReader();
          while(true){ const {done,value}=await r.read(); if(done)break; chunks.push(value); }
          const out = new Uint8Array(chunks.reduce((a,c)=>a+c.length,0));
          let off=0; chunks.forEach(c=>{out.set(c,off);off+=c.length;});
          return out;
        }
        throw new Error('Método de compresión no soportado: '+compMethod);
      }

      const dec = new TextDecoder('utf-8');
      const parseXML = raw => new DOMParser().parseFromString(dec.decode(raw),'application/xml');

      // Shared strings table
      const sst = [];
      const ssRaw = await readEntry('xl/sharedStrings.xml');
      if(ssRaw){
        parseXML(ssRaw).querySelectorAll('si').forEach(si=>{
          sst.push([...si.querySelectorAll('t')].map(t=>t.textContent).join(''));
        });
      }

      // Sheet data
      const shRaw = await readEntry('xl/worksheets/sheet1.xml');
      if(!shRaw) throw new Error('No se pudo leer la hoja del XLSX');
      parseXML(shRaw).querySelectorAll('row').forEach(rowEl=>{
        const r = parseInt(rowEl.getAttribute('r'))-1;
        rows[r]={};
        rowEl.querySelectorAll('c').forEach(cell=>{
          const ref = cell.getAttribute('r');
          const colStr = ref.replace(/[0-9]/g,'');
          const col = colStr.split('').reduce((a,c)=>a*26+(c.charCodeAt(0)-64),0)-1;
          const t = cell.getAttribute('t')||'';
          const vEl = cell.querySelector('v');
          if(!vEl) return;
          rows[r][col] = t==='s' ? (sst[parseInt(vEl.textContent)]||'') : vEl.textContent;
        });
      });

    } else {
      // ── XLS / BIFF8 parser ──────────────────────────────────────
      function r16(d,p){ return d[p]|(d[p+1]<<8); }
      function r32(d,p){ return d[p]|(d[p+1]<<8)|(d[p+2]<<16)|(d[p+3]<<24); }
      const secSize = 1 << r16(bytes,30);
      const fat = [];
      for(let i=0;i<109;i++){
        const fsn=r32(bytes,76+i*4);
        if(fsn>=0xFFFFFFFC) break;
        const off=512+fsn*secSize;
        for(let j=0;j<secSize/4;j++) fat.push(r32(bytes,off+j*4));
      }
      const dirOff=512+r32(bytes,48)*secSize;
      const wbStart=r32(bytes,dirOff+128+116);
      const wbSize=r32(bytes,dirOff+128+120);
      let wbData=new Uint8Array(wbSize);
      let pos=0, sec=wbStart;
      while(sec<0xFFFFFFFC&&pos<wbSize){
        const o=512+sec*secSize;
        const chunk=Math.min(secSize,wbSize-pos);
        wbData.set(bytes.slice(o,o+chunk),pos);
        pos+=chunk; sec=fat[sec]||0xFFFFFFFF;
      }
      const sst=[];
      let i=0; const wb=wbData;
      while(i<wb.length-4){
        const rt=r16(wb,i),rl=r16(wb,i+2);
        if(rt===0x00FC){
          const unique=r32(wb,i+8); let p=i+12;
          for(let s=0;s<unique;s++){
            if(p+2>=wb.length) break;
            const nc=r16(wb,p); p+=2;
            const flags=wb[p]; p+=1;
            let rc=0;
            if(flags&0x08){rc=r16(wb,p);p+=2;}
            if(flags&0x04) p+=4;
            let str='';
            if(!(flags&0x01)){for(let c=0;c<nc;c++) str+=String.fromCharCode(wb[p+c]); p+=nc;}
            else{for(let c=0;c<nc;c++) str+=String.fromCharCode(r16(wb,p+c*2)); p+=nc*2;}
            p+=rc*4; sst.push(str);
          }
        } else if(rt===0x00FD&&rl>=10){
          const row=r16(wb,i+4),col=r16(wb,i+6),idx=r32(wb,i+10);
          if(!rows[row]) rows[row]={};
          if(idx<sst.length) rows[row][col]=sst[idx];
        }
        i+=4+rl;
      }
    }

    // ── Classify products (same for both formats) ──────────────────
    const seen={};
    Object.keys(rows).sort((a,b)=>+a-+b).slice(1).forEach(r=>{
      const row=rows[r];
      const nombre=(row[4]||'').trim().toUpperCase();
      const cat   =(row[1]||'').trim().toUpperCase();
      const subcl =(row[3]||'').trim();
      if(!nombre||!cat||!isValidName(nombre)||nombre==='NOMBRE') return;
      if(seen[nombre]) return;
      let tipo;
      if(NON_FOOD.has(cat))  tipo='nofood';
      else if(BEV.has(cat))  tipo='bebida';
      else if(CORT.has(cat)) tipo='cortesia';
      else if(PERS.has(cat)) tipo='personal';
      else                    tipo='comida';
      seen[nombre]={tipo, clas:cat, subcl};
    });

    const items = Object.entries(seen).map(([nombre,{tipo,clas,subcl}])=>({nombre,tipo,clas,subcl}));
    if(items.length < 5){
      if(statusEl) statusEl.textContent = '✗ No se encontraron productos. ¿Es el archivo correcto?';
      return;
    }

    if(statusEl) statusEl.textContent = `⟳ Guardando ${items.length} productos...`;

    if(!BACKEND_URL){ if(statusEl) statusEl.textContent='✗ Sin backend configurado'; return; }
    const r = await apiPost({ action:'saveProductos', data:JSON.stringify(items) });
    if(r && r.ok){
      PRODUCT_MAP={};
      items.forEach(p=>{ PRODUCT_MAP[p.nombre.toUpperCase().trim()]={tipo:p.tipo,clas:p.clas,subcl:p.subcl}; });
      PRODUCTOS_LOADED=true;
      _PROD_NORM_CACHE = null; // invalidate normalize cache
      localStorage.setItem('satori_productos', JSON.stringify(PRODUCT_MAP));
      const counts=items.reduce((acc,p)=>{ acc[p.tipo]=(acc[p.tipo]||0)+1; return acc; },{});
      const statsStr=[
        counts.bebida   ?`${counts.bebida} bebidas`:'',
        counts.comida   ?`${counts.comida} comidas`:'',
        counts.cortesia ?`${counts.cortesia} cortesías`:'',
        counts.personal ?`${counts.personal} personal`:'',
        counts.nofood   ?`${counts.nofood} merch`:'',
      ].filter(Boolean).join(' · ');
      if(statusEl) statusEl.innerHTML=`<span style="color:#4a7">✓ ${items.length} productos · ${statsStr}</span>`;
      setTimeout(()=>renderConfig(document.getElementById('view-config')),500);
    } else {
      if(statusEl) statusEl.textContent='✗ Error al guardar. Intentá de nuevo.';
    }
  } catch(err){
    console.error('handleProductosUpload error:', err);
    if(statusEl) statusEl.textContent='✗ Error: '+err.message;
  }
}

  el.innerHTML = `
    <div class="sl-header"><div class="sl">Configuración · Owner</div></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:8px;">

      <!-- PINs info -->
      <div style="background:var(--ink);border-radius:2px;padding:22px 24px;border-left:3px solid var(--gold);">
        <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:14px">🔑 PINs de acceso</div>
        <div style="font-size:10px;color:#888;margin-bottom:14px">
          Los PINs están hardcodeados en el archivo <code style="color:#c8a96e">index.html</code>.<br>
          Para cambiarlos: editá el archivo en GitHub, buscá las líneas abajo y cambiá el número.
        </div>
        <div style="background:#0a0a18;border:1px solid #2a2a4a;border-radius:2px;padding:14px 16px;font-family:'DM Mono',monospace;font-size:12px;line-height:2;">
          <div>const OWNER_PIN = <span style="color:var(--gold)">'${OWNER_PIN}'</span>;</div>
          <div>const MANAGER_PIN = <span style="color:var(--gold)">'${MANAGER_PIN}'</span>;</div>
        </div>
      </div>

      <!-- Backend URL -->
      <div style="background:var(--ink);border-radius:2px;padding:22px 24px;border-left:3px solid #2a4a2a;">
        <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:14px">☁ Google Sheets Backend</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input id="config-backend-url" type="url" value="${BACKEND_URL}"
            placeholder="URL del Apps Script..."
            style="flex:1;min-width:180px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;
            padding:7px 10px;color:#f0ece4;font-family:'DM Mono',monospace;font-size:10px;outline:none;">
          <button class="btn-sm" onclick="saveConfigBackendUrl()">Guardar</button>
        </div>
        <div style="margin-top:8px;font-size:9px;color:${BACKEND_URL?'#4a7':'#666'};">
          ${BACKEND_URL ? '✓ Conectado' : '⚠ Sin backend configurado'}
        </div>
      </div>

      <!-- Lista de productos -->
      <div style="background:var(--ink);border-radius:2px;padding:22px 24px;border-left:3px solid #4a6a8a;grid-column:1/-1;">
        <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:8px">📋 Lista de Productos</div>
        <div style="font-size:11px;color:#888;margin-bottom:16px;line-height:1.6">
          Subí el XLS de productos del sistema para que el dashboard clasifique automáticamente
          bebidas, comidas, cortesías y comida personal.<br>
          La lista se guarda en la hoja <code style="color:#c8a96e">productos</code> del Google Sheet
          y se descarga automáticamente en cada sincronización.
        </div>
        <div style="font-size:11px;margin-bottom:16px">${prodStatus}</div>

        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <label style="cursor:pointer;">
            <input type="file" id="prod-xls-input" accept=".xls,.xlsx,.xlsm" style="display:none"
              onchange="handleProductosUpload(this)">
            <div class="btn-sm" style="cursor:pointer;background:#1a2a3a;border-color:#3a5a7a;">
              📂 Seleccionar XLS de productos
            </div>
          </label>
          <div id="prod-upload-status" style="font-size:11px;color:#888"></div>
        </div>

        <div style="margin-top:14px;font-size:9px;color:#444;line-height:1.7">
          Columnas necesarias: <code style="color:#888">CodigoTipoClasificacion · NombreClasificacion · CodigoSubClasificacion · NombreSubClasificacion · Nombre · PrecioVenta</code><br>
          Categoría <b>BEBIDAS</b> = bebida · <b>X CORTESIAS</b> = cortesía · <b>PERSONAL / XX DUEÑOS</b> = comida personal · resto = comida
        </div>
      </div>

    </div>
  `;

  window.saveConfigBackendUrl = function(){
    const url = document.getElementById('config-backend-url')?.value?.trim();
    setBackendUrl(url);
    syncFromCloud();
    renderConfig(el);
  };
}


// ── AUTO-FIT KPI VALUES ──
function fitKpiVals(){
  document.querySelectorAll('.kpi-val').forEach(el => {
    el.style.transform = 'scaleX(1)';
    const parent = el.closest('.kpi');
    if(!parent) return;
    const pStyle = getComputedStyle(parent);
    const maxW = parent.clientWidth
      - parseFloat(pStyle.paddingLeft)
      - parseFloat(pStyle.paddingRight)
      - 4; // small buffer
    const elW = el.getBoundingClientRect().width;
    if(elW > maxW && maxW > 0){
      el.style.transform = 'scaleX(' + (maxW / elW).toFixed(3) + ')';
    }
  });
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', function(){
  console.log('DOM ready, building login');
  rebuildAllSals();
  buildLogin();
  updateStorageBadge();
  // Auto-sync from cloud on load
  if(BACKEND_URL) syncFromCloud();
  // Fit KPI values on resize
  if(window.ResizeObserver){
    new ResizeObserver(()=>{ requestAnimationFrame(fitKpiVals); }).observe(document.body);
  }
  console.log('Login built');
});
</script>
