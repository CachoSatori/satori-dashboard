            <div style="height:100%;width:${_pct.toFixed(1)}%;border-radius:3px;background:${_pct>=100?'var(--green)':_pct>=70?'var(--gold)':'var(--red)'}"></div></div>
          <div style="display:flex;justify-content:space-between;font-size:9px;color:#666">
            <span>${_pct.toFixed(1)}% completado</span>
            <span style="color:${_ok?'var(--green)':'var(--red)'}">${_ok?'✓ En camino':'⚠ Por debajo'} · Proyección: ${fi(_proj)} (${(Math.min(_proj/_metaV,9.99)*100).toFixed(0)}%)</span>
          </div>
        `;
        // ── Detalle diario (meta implícita + promedio + esfuerzo) ──
        if(!_isTodo && _dp>0 && _mbarEl){
          const _metaDia = _metaV/_dim;
          const _promDia = _ventasMes/_dp;
          const _diasRest = _dim - _dp;
          const _faltante = _metaV - _ventasMes;
          const _esfuerzo = _diasRest>0 ? _faltante/_diasRest : null;
          const _promColor = _promDia>=_metaDia ? 'var(--green)' : 'var(--red)';
          let _esfHtml = '';
          if(_esfuerzo!==null && _faltante>0) {
            const _ec = _esfuerzo<=_metaDia ? 'var(--green)' : 'var(--red)';
            _esfHtml = '<span style="color:'+_ec+'">⚡ Esfuerzo req. ('+_diasRest+'d): <strong>'+fi(_esfuerzo)+'</strong>/día</span>';
          } else if(_faltante<=0) {
            _esfHtml = '<span style="color:var(--green)">✓ Meta alcanzada</span>';
          }
          const _detDiv = document.createElement('div');
          _detDiv.style.cssText = 'margin-top:10px;font-size:10px;color:#666;display:flex;gap:16px;flex-wrap:wrap;';
          _detDiv.innerHTML =
            '<span>Meta diaria implícita: <strong style="color:#f0ece4">'+fi(_metaDia)+'</strong></span>'+
            '<span>Promedio actual/día: <strong style="color:'+_promColor+'">'+fi(_promDia)+'</strong></span>'+
            _esfHtml;
          _mbarEl.appendChild(_detDiv);
        }
      }
    }

    const tbl = document.createElement('table');
    tbl.style.cssText = 'width:100%;border-collapse:collapse;font-size:11px;';

    // Header
    const thead = document.createElement('thead');
    thead.innerHTML = `<tr style="background:var(--ink);color:#aaa;">
      ${colDefs.map(c => {
        const isSort = c.key === sortKey;
        const arrow = isSort ? (asc ? ' ↑' : ' ↓') : '';
        return `<th onclick="window._contSort('${c.key}')"
          style="padding:9px 12px;text-align:${c.align};font-size:8px;letter-spacing:.15em;
          text-transform:uppercase;font-weight:500;cursor:pointer;user-select:none;
          color:${isSort ? 'var(--gold)' : '#aaa'};white-space:nowrap">
          ${c.label}${arrow}</th>`;
      }).join('')}
    </tr>`;
    tbl.appendChild(thead);

    // Body
    const tbody = document.createElement('tbody');
    // Color scale: sorted by day number, rank by ventaNeta
    const sortedByNeta = [...rows].filter(r=>r.ventaNeta>0).sort((a,b)=>b.ventaNeta-a.ventaNeta);
    const netaRank = {}; sortedByNeta.forEach((r,i)=>netaRank[r.d]=i);
    const n = sortedByNeta.length;

    function dayBg(d) {
      const rank = netaRank[d];
      if(rank===undefined) return '';
      if(rank===0)         return 'rgba(46,125,50,.22)';   // 🟢 mejor día
      if(rank===1)         return 'rgba(46,125,50,.10)';   // 🟢 claro 2º mejor
      if(rank===n-1)       return 'rgba(194,59,34,.22)';   // 🔴 peor día
      if(rank===n-2)       return 'rgba(194,59,34,.10)';   // 🔴 claro anteúltimo
      // Middlers: yellow gradient based on position in middle
      const mid = (rank-2)/(Math.max(n-4,1));
      const alpha = 0.04 + mid*0.03;
      return `rgba(200,169,110,${alpha.toFixed(2)})`;      // 🟡 tonos medios
    }

    function dayTextColor(d) {
      const rank = netaRank[d];
      if(rank===undefined) return 'var(--ink)';
      if(rank===0)         return 'var(--green)';
      if(rank===n-1)       return 'var(--red)';
      return 'var(--ink)';
    }

    sorted.forEach((r,i) => {
      const tr = document.createElement('tr');
      const bg = dayBg(r.d);
      const textCol = dayTextColor(r.d);
      tr.style.cssText = `border-bottom:1px solid var(--border);background:${bg};`;
      tr.onmouseenter = () => tr.style.background = 'rgba(200,169,110,.09)';
      tr.onmouseleave = () => tr.style.background = bg;

      colDefs.forEach(c => {
        const td = document.createElement('td');
        const isBoldCol = c.bold || c.key==='ventaNeta';
        td.style.cssText = `padding:8px 10px;text-align:${c.align};
          ${isBoldCol ? `font-weight:700;color:${textCol};` : 'color:var(--ink);'}`;
        td.textContent = c.fmt(r);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);

    // Totals footer
    const tfoot = document.createElement('tfoot');
    const tfr = document.createElement('tr');
    tfr.style.cssText = 'background:var(--ink);font-weight:700;border-top:2px solid var(--border);';
    colDefs.forEach(c => {
      const td = document.createElement('td');
      td.style.cssText = `padding:10px 12px;text-align:${c.align};color:var(--gold);font-size:11px;`;
      if(c.key === 'dayNum') td.textContent = selDates.length;
      else if(c.key === 'dow') { td.textContent = isTodo ? 'TOTAL '+year : 'TOTAL'; td.style.letterSpacing='.1em'; td.style.fontSize='8px'; }
      else if(c.key === 'pax') td.textContent = fmtN(tot.pax);
      else td.textContent = fmtC(tot[c.key] || 0);
      tfr.appendChild(td);
    });
    tfoot.appendChild(tfr);
    tbl.appendChild(tfoot);

    // Replace table
    const existing = el.querySelector('.cont-table-wrap');
    if(existing) existing.innerHTML = '';
    const wrap = existing || document.createElement('div');
    wrap.className = 'cont-table-wrap';
    wrap.style.cssText = 'overflow-x:auto;margin-bottom:32px;';
    wrap.innerHTML = '';
    wrap.appendChild(tbl);
    if(!existing) el.appendChild(wrap);
  }

  window._contSort = key => {
    const cur = renderContabilidad._sort;
    const asc = cur.key === key ? !cur.asc : (key === 'dayNum');
    buildTable(key, asc);
  };

  buildTable(renderContabilidad._sort.key, renderContabilidad._sort.asc);

  // ── Weekly averages ────────────────────────────────────────────
  // Footnote if any rows have estimated IVA
  const hasEstimated = rows.some(r => r.ivaEstimado);
  if(hasEstimated){
    const note = document.createElement('div');
    note.style.cssText = 'font-size:9px;color:#666;margin:-20px 0 20px;font-style:italic;';
    note.textContent = '* IVA y Servicio estimados (13% y 10% del neto). Re-subí el XLS para datos exactos.';
    el.appendChild(note);
  }

  const dowTitle = document.createElement('div');
  dowTitle.style.cssText = 'font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#888;margin-bottom:12px;';
  dowTitle.textContent = 'Promedio por día de la semana';
  el.appendChild(dowTitle);

  // Accumulate by day of week
  const dowAcc = {};
  DOW.forEach(d => dowAcc[d] = {ventaNeta:0,salon:0,delivery:0,pax:0,count:0});
  rows.forEach(r => {
    const acc = dowAcc[r.dow];
    acc.ventaNeta += r.ventaNeta;
    acc.salon     += r.salon;
    acc.delivery  += r.delivery;
    acc.pax       += r.pax;
    acc.count++;
  });

  // Sort Mon–Sun
  const DOW_ORDER = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const dowGrid = document.createElement('div');
  dowGrid.style.cssText = 'display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:32px;';
  DOW_ORDER.forEach(d => {
    const acc = dowAcc[d];
    const n = acc.count;
    // Color scale for day-of-week averages
    const dowAvgs = DOW_ORDER.map(dd => {
      const a = dowAcc[dd];
      return a && a.count > 0 ? Math.round(a.ventaNeta / a.count) : null;
    }).filter(v => v !== null);
    const maxAvg = Math.max(...dowAvgs), minAvg = Math.min(...dowAvgs);
    const sortedAvgs = [...dowAvgs].sort((a,b)=>b-a);
    const avgNeta = n > 0 ? Math.round(acc.ventaNeta/n) : 0;
    const avgRank = sortedAvgs.indexOf(avgNeta);
    const nAvgs = sortedAvgs.length;

    function dowBg(rank) {
      if(nAvgs<=1) return 'var(--ink)';
      if(rank===0)       return 'rgba(46,125,50,.25)';
      if(rank===1)       return 'rgba(46,125,50,.12)';
      if(rank===nAvgs-1) return 'rgba(194,59,34,.25)';
      if(rank===nAvgs-2) return 'rgba(194,59,34,.12)';
      const mid=(rank-2)/Math.max(nAvgs-4,1);
      return `rgba(200,169,110,${(0.06+mid*0.06).toFixed(2)})`;
    }
    function dowColor(rank) {
      if(nAvgs<=1) return 'var(--gold)';
      if(rank===0) return 'var(--green)';
      if(rank===nAvgs-1) return 'var(--red)';
      return 'var(--gold)';
    }

    const cardBg = n>0 ? dowBg(avgRank) : 'var(--ink)';
    const valColor = n>0 ? dowColor(avgRank) : '#444';

    const card = document.createElement('div');
    card.style.cssText = `background:${cardBg};padding:12px;border-radius:2px;text-align:center;`;
    card.innerHTML = n > 0 ? `
      <div style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#888;margin-bottom:8px">${d}</div>
      <div style="font-size:8px;color:#666;margin-bottom:4px">${n} día${n>1?'s':''}</div>
      <div style="font-family:Syne,sans-serif;font-size:16px;font-weight:800;color:${valColor}">
        ₡${Math.round(acc.ventaNeta/n).toLocaleString('es-CR')}</div>
      <div style="font-size:9px;color:#888;margin-top:4px">prom neto</div>
      <div style="font-size:9px;color:#666;margin-top:8px;border-top:1px solid rgba(255,255,255,.07);padding-top:8px">
        PAX: ${Math.round(acc.pax/n)}</div>
    ` : `
      <div style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#444;margin-bottom:8px">${d}</div>
      <div style="font-size:9px;color:#333">—</div>`;
    dowGrid.appendChild(card);
  });
  el.appendChild(dowGrid);
}


// ═══════════════════════════════════════════════════════════════
// PARSER — XLSX HISTÓRICO (Google Sheets export con pestañas por mes)
// Formato: columnas A=día, B=VentaBruta, C=ImpuestoVentas, D=ImpuestoServicio,
//          E=VentaNeta, F=día#, G=diaSemana, H=ventasSalon, I=ventasDelivery,
//          J=paxDia, K=promedio
// Pestañas: "julio25", "agosto25", "enero24", etc.
// ═══════════════════════════════════════════════════════════════
async function handleHistXLSUpload(input) {
  const file = input.files[0];
  if(!file) return;
  const statusEl = document.getElementById('hist-upload-status');
  const setStatus = (msg, color='#888') => {
    if(statusEl) statusEl.innerHTML = `<span style="color:${color}">${msg}</span>`;
  };
  setStatus('⟳ Leyendo archivo histórico...');

  try {
    const buf = await file.arrayBuffer();
    const b   = new Uint8Array(buf);
    const u16 = p => b[p]|(b[p+1]<<8);
    const u32 = p => b[p]|(b[p+1]<<8)|(b[p+2]<<16)|(b[p+3]<<24);

    // ── Locate ZIP central directory ─────────────────────────────
    let eocd = -1;
    for(let i=b.length-22; i>=0; i--){
      if(b[i]===0x50&&b[i+1]===0x4B&&b[i+2]===0x05&&b[i+3]===0x06){ eocd=i; break; }
    }
    if(eocd<0){ setStatus('✗ Archivo inválido (no es XLSX)','var(--red)'); return; }

    const cdSize=u32(eocd+12), cdOff=u32(eocd+16);
    const entries={};
    let pos=cdOff;
    while(pos < cdOff+cdSize){
      if(!(b[pos]===0x50&&b[pos+1]===0x4B&&b[pos+2]===0x01&&b[pos+3]===0x02)) break;
      const fnLen=u16(pos+28), exLen=u16(pos+30), cmLen=u16(pos+32);
      const fn=new TextDecoder().decode(b.slice(pos+46, pos+46+fnLen));
      entries[fn]={ lh:u32(pos+42), cs:u32(pos+20), method:u16(pos+10) };
      pos+=46+fnLen+exLen+cmLen;
    }

    // ── Decompress entry ─────────────────────────────────────────
    async function readEntry(name){
      const e=entries[name]; if(!e) return null;
      const fnLen2=u16(e.lh+26), exLen2=u16(e.lh+28);
      const ds=e.lh+30+fnLen2+exLen2;
      const comp=b.slice(ds, ds+e.cs);
      if(e.method===0) return comp;
      if(e.method===8){
        const ds2=new DecompressionStream('deflate-raw');
        const w=ds2.writable.getWriter(); w.write(comp); w.close();
        const chunks=[]; const r=ds2.readable.getReader();
        while(true){ const {done,value}=await r.read(); if(done)break; chunks.push(value); }
        const tot=chunks.reduce((a,c)=>a+c.length,0);
        const out=new Uint8Array(tot); let p2=0;
        chunks.forEach(c=>{out.set(c,p2);p2+=c.length;});
        return out;
      }
      return null;
    }
    const parseXML = bytes => bytes ?
      new DOMParser().parseFromString(new TextDecoder('utf-8').decode(bytes),'text/xml') : null;

    // ── Shared strings ───────────────────────────────────────────
    const ssXML=parseXML(await readEntry('xl/sharedStrings.xml'));
    const sst=[];
    if(ssXML) ssXML.querySelectorAll('si').forEach(si=>{
      sst.push([...si.querySelectorAll('t')].map(t=>t.textContent||'').join(''));
    });

    // ── Sheet names + rels ───────────────────────────────────────
    const wbXML=parseXML(await readEntry('xl/workbook.xml'));
    if(!wbXML){ setStatus('✗ Workbook inválido','var(--red)'); return; }
    const sheets=[...wbXML.querySelectorAll('sheet')].map(s=>({
      name:s.getAttribute('name'),
      rid: s.getAttribute('r:id')||s.getAttribute('id')
    }));
    const relsXML=parseXML(await readEntry('xl/_rels/workbook.xml.rels'));
    const rels={};
    if(relsXML) [...relsXML.querySelectorAll('Relationship')].forEach(r=>{
      rels[r.getAttribute('Id')]=r.getAttribute('Target');
    });

    // ── Parse sheet XML → rows ────────────────────────────────────
    function parseSheet(xml){
      const rows={};
      xml.querySelectorAll('row').forEach(rowEl=>{
        const r=parseInt(rowEl.getAttribute('r'))-1; rows[r]={};
        rowEl.querySelectorAll('c').forEach(cell=>{
          const ref=cell.getAttribute('r');
          const cs=[...ref].filter(c=>/[A-Z]/i.test(c));
          let col=0; cs.forEach(c=>col=col*26+(c.toUpperCase().charCodeAt(0)-64)); col--;
          const t=cell.getAttribute('t')||'';
          const v=cell.querySelector('v');
          if(!v||!v.textContent) return;
          rows[r][col] = t==='s' ? (sst[parseInt(v.textContent)]||'')
                                  : (parseFloat(v.textContent)||v.textContent||0);
        });
      });
      return rows;
    }

    // ── Safe numeric conversion ───────────────────────────────────
    function toNum(v){
      if(typeof v==='number') return v;
      const s=String(v).replace(/,/g,'').trim();
      const n=parseFloat(s);
      return isNaN(n)?0:n;
    }

    // ── Month name → number ───────────────────────────────────────
    const MONTH_MAP={
      'enero':1,'febrero':2,'marzo':3,'abril':4,'mayo':5,'junio':6,
      'julio':7,'agosto':8,'septiembre':9,'octubre':10,'noviembre':11,'diciembre':12,
      'jan':1,'feb':2,'mar':3,'apr':4,'may':5,'jun':6,
      'jul':7,'aug':8,'sep':9,'oct':10,'nov':11,'dec':12
    };

    // Detect year from filename (e.g. "VENTAS_Y_PROMEDIOS_POR_MES_2025.xlsx" → 2025)
    const yearMatch = file.name.match(/(\d{4})/);
    const fileYear  = yearMatch ? parseInt(yearMatch[1]) : null;

    // Detect month from sheet name:
    // Supports: "enero", "julio", "julio25", "agosto24", "01", etc.
    function detectMonth(name){
      const s=name.toLowerCase().trim();
      // Direct name match
      if(MONTH_MAP[s]) return { month: MONTH_MAP[s], year: fileYear };
      // Name + 2-digit year suffix e.g. "julio25"
      for(const [mn,mm] of Object.entries(MONTH_MAP)){
        if(s.startsWith(mn)){
          const rest=s.slice(mn.length).replace(/[^0-9]/g,'');
          if(rest.length>=2){
            const yr=rest.length===2?2000+parseInt(rest):parseInt(rest);
            return { month:mm, year:yr };
          }
          if(rest.length===0 && fileYear) return { month:mm, year:fileYear };
        }
      }
      return null;
    }

    // ── Process each sheet ────────────────────────────────────────
    let imported=0, skippedSheets=[];
    const newHist={ ...HIST };

    for(const sheet of sheets){
      const detected = detectMonth(sheet.name);
      if(!detected){ skippedSheets.push(sheet.name); continue; }
      const { month, year } = detected;
      if(!year){ skippedSheets.push(sheet.name); continue; }

      const target=rels[sheet.rid]||'';
      const shPath=target.startsWith('xl/')?target:'xl/'+target;
      const shXML=parseXML(await readEntry(shPath));
      if(!shXML){ skippedSheets.push(sheet.name); continue; }

      const rows=parseSheet(shXML);
      const header=rows[0]||{};

      // Detect columns from header
      let COL={dayNum:0,bruta:1,iva:2,serv:3,neta:4,salon:7,delivery:8,pax:9,prom:10};
      Object.entries(header).forEach(([col,val])=>{
        const v=String(val).toLowerCase().trim(); const c=parseInt(col);
        if(v.includes('bruta'))                      COL.bruta=c;
        else if(v.includes('impuesto')&&v.includes('vent')) COL.iva=c;
        else if(v.includes('servicio'))              COL.serv=c;
        else if(v.includes('neta'))                  COL.neta=c;
        else if(v.includes('salon')||v.includes('salón')) COL.salon=c;
        else if(v.includes('delivery'))              COL.delivery=c;
        else if(v.includes('pax'))                   COL.pax=c;
        else if(v.includes('promedio'))              COL.prom=c;
      });

      // Parse data rows
      Object.entries(rows).forEach(([rIdx,row])=>{
        if(parseInt(rIdx)===0) return;
        const dayNum=toNum(row[COL.dayNum]);
        if(dayNum<1||dayNum>31) return;
        const neta=toNum(row[COL.neta]), bruta=toNum(row[COL.bruta]);
        if(neta<=0&&bruta<=0) return;

        const fecha=`${year}-${String(month).padStart(2,'0')}-${String(Math.round(dayNum)).padStart(2,'0')}`;
        if(DIAS[fecha]) return; // POS data takes priority

        newHist[fecha]={
          ventaBruta: Math.round(bruta),
          ventaNeta:  Math.round(neta),
          iva:        Math.round(toNum(row[COL.iva])),
          serv:       Math.round(toNum(row[COL.serv])),
          salon:      Math.round(toNum(row[COL.salon])),
          delivery:   Math.round(toNum(row[COL.delivery])),
          pax:        Math.round(toNum(row[COL.pax])),
          promPax:    Math.round(toNum(row[COL.prom])),
          source:     'hist'
        };
        imported++;
      });
    }

    HIST = newHist;
    saveHist();

    const months=[...new Set(Object.keys(HIST).map(d=>d.slice(0,7)))].length;
    setStatus(`✓ ${imported} días importados · ${months} meses`, 'var(--green)');

    // Sync to Sheets
    if(BACKEND_URL){
      setStatus('⟳ Guardando en Sheets...');
      const r=await apiPost({ action:'saveHist', data: JSON.stringify(HIST) });
      setStatus(r?.ok
        ? `✓ ${imported} días importados y guardados (${months} meses)`
        : `✓ ${imported} días guardados localmente`, r?.ok?'var(--green)':'var(--gold)');
    }

    // Refresh config view to update counter
    renderConfig(document.getElementById('view-config'));

  } catch(err){
    console.error('handleHistXLSUpload:', err);
    setStatus('✗ Error: '+err.message, 'var(--red)');
  }
}


// ═══════════════════════════════════════════════════════════════
// ANÁLISIS FINANCIERO
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
// MIX DE VENTAS v6
// - Orden clasificaciones configurable (CLAS_ORDER)
// - Subclasificacion igual a clasificacion siempre visible
// - PAX: suma de productos comensales/A PAX (no de saloneros)
// - Promedio pax: ventas totales ÷ pax total del período
// - KPI productos no vendidos al fondo
// ═══════════════════════════════════════════════════════════
function renderMixVentas(el) {
  el.innerHTML = moduleBreadcrumb('fin', 'Mix Ventas');

  var allDates = getDates().sort();
  if (!allDates.length) {
    el.innerHTML += '<div style="padding:40px;text-align:center;color:#888">Sin datos. Subi los XLS primero.</div>';
    return;
  }

  // CSS una sola vez
  if (!document.getElementById('mix-style')) {
    var st = document.createElement('style'); st.id = 'mix-style';
    st.textContent = [
      '.mix-hidden{display:none!important}',
      '.mix-row-clas{background:#1c1c1c;cursor:pointer;border-top:2px solid #2a2a2a}',
      '.mix-row-clas:hover{background:#242424}',
      '.mix-row-sub{background:#141414;cursor:pointer}',
      '.mix-row-sub:hover{background:#1a1a1a}',
      '.mix-row-prod{border-bottom:1px solid #161616}',
      '.mix-row-prod:hover{background:rgba(200,169,110,.06)!important}',
      '.mix-tog{display:inline-block;width:12px;font-size:9px;cursor:pointer}',
      '.mix-section-hdr{background:#0a0a14;border-top:3px solid var(--border)}',
      '.mix-mode-btn{padding:7px 18px;border-radius:2px;font-size:9px;letter-spacing:.1em;cursor:pointer;border:1px solid var(--border);transition:all .15s;user-select:none;font-weight:700}',
      '.mix-mode-btn.active{background:var(--ink);color:var(--gold);border-color:var(--gold)}',
      '.mix-mode-btn:not(.active){color:#666}',
      '.mix-period-btn{padding:4px 11px;border-radius:2px;font-size:9px;letter-spacing:.08em;cursor:pointer;border:1px solid var(--border);transition:all .15s;user-select:none}',
      '.mix-period-btn.active{background:var(--ink);color:var(--gold);border-color:var(--gold)}',
      '.mix-period-btn:not(.active){color:#888}',
      '.mix-period-btn.hist.active{background:#1a0a1a;color:#c890e8;border-color:#9a5a9a}',
      '.mix-period-btn.hist:not(.active){color:#777;border-color:#333}',
      '.mix-cmp-col{background:#0a0f0a;border:1px solid #1a2a1a;border-radius:2px;padding:8px 12px}',
    ].join('');
    document.head.appendChild(st);
  }

  // ── Índice de meses disponibles ──────────────────────────────
  var months = {};
  allDates.forEach(function(d) {
    var key = d.slice(0,7);
    if (!months[key]) months[key] = { year: +d.slice(0,4), month: +d.slice(5,7), dates: [] };
    months[key].dates.push(d);
  });
  var monthKeys = Object.keys(months).sort().reverse();
  var yearsArr = [];
  monthKeys.forEach(function(k) { var y = k.slice(0,4); if (yearsArr.indexOf(y) < 0) yearsArr.push(y); });
  yearsArr.sort().reverse();

  // Años disponibles en ANUAL_DATA
  var anualYears = [];
  Object.keys(ANUAL_DATA).forEach(function(k) {
    var y = k.slice(0,4); if (anualYears.indexOf(y) < 0) anualYears.push(y);
  });
  anualYears.sort().reverse();

  // Todos los años disponibles (union DIAS + ANUAL_DATA)
  var allYears = yearsArr.slice();
  anualYears.forEach(function(y) { if (allYears.indexOf(y) < 0) allYears.push(y); });
  allYears.sort().reverse();

  var MN = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var EXCLUIR = ['cortesia','comensales'];

  // ── Estado persistente ───────────────────────────────────────
  if (!renderMixVentas._mode)    renderMixVentas._mode    = 'ver';
  if (!renderMixVentas._period)  renderMixVentas._period  = monthKeys[0] || '';
  if (!renderMixVentas._cmpA)    renderMixVentas._cmpA    = monthKeys[0] || '';
  if (!renderMixVentas._cmpB)    renderMixVentas._cmpB    = monthKeys[1] || monthKeys[0] || '';
  // _cmpPeriods: array de hasta 6 períodos para comparación múltiple
  if (!renderMixVentas._cmpPeriods || !renderMixVentas._cmpPeriods.length) {
    renderMixVentas._cmpPeriods = [monthKeys[0]||'', monthKeys[1]||monthKeys[0]||''].filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;});
  }
  if (!renderMixVentas._canal)   renderMixVentas._canal   = 'todos';
  if (!renderMixVentas._search)  renderMixVentas._search  = '';

  // ── Construir PM desde un período ────────────────────────────
  // period: 'YYYY-MM' | 'todo-YYYY' | 'anual-YYYY' | 'anual-YYYY-MM'
  function buildPM(period) {
    var PM = {};
    var isAnual  = period.indexOf('anual-') === 0;
    var isTodo   = period.indexOf('todo-') === 0;

    if (isAnual) {
      var key = period.slice(6); // 'YYYY' or 'YYYY-MM'
      var items = [];
      Object.keys(ANUAL_DATA).forEach(function(k) {
        // key puede ser 'YYYY' (año completo) o 'YYYY-MM' (mes específico)
        if (key.length === 4 ? k.slice(0,4) === key : k === key) {
          var arr = ANUAL_DATA[k];
          if (Array.isArray(arr)) items = items.concat(arr);
        }
      });
      items.forEach(function(p) {
        var nm = p.producto; if (!nm) return;
        if (!PM[nm]) { var pm = PRODUCT_MAP[nm] || {}; PM[nm] = { nombre:nm, tipo:pm.tipo||p.tipo||'desconocido', clas:pm.clas||p.clas||'SIN CLASIFICAR', subcl:pm.subcl||p.subcl||'', salon:0, delivery:0, unidades:0, monto:0 }; }
        PM[nm].unidades += p.cantidad||0; PM[nm].monto += p.monto||0;
        if (p.canal === 'delivery') PM[nm].delivery += p.monto||0; else PM[nm].salon += p.monto||0;
      });
    } else {
      var selDates = [];
      if (isTodo) {
        var yr = period.slice(5);
        monthKeys.forEach(function(k) { if (k.slice(0,4) === yr) selDates = selDates.concat(months[k].dates); });
        selDates.sort();
      } else if (months[period]) {
        selDates = months[period].dates.slice().sort();
      }
      selDates.forEach(function(d) {
        var day = DIAS[d]; if (!day) return;
        Object.values(day.saloneros||{}).forEach(function(sal) {
          (sal.prods||[]).forEach(function(prod) {
            var nm = (prod[0]||'').toString().trim().toUpperCase();
            var cant = prod[1]||0, monto = prod[2]||0;
            if (!nm) return;
            if (!PM[nm]) { var pm = PRODUCT_MAP[nm]||{}; PM[nm] = { nombre:nm, tipo:pm.tipo||'desconocido', clas:pm.clas||'SIN CLASIFICAR', subcl:pm.subcl||'', salon:0, delivery:0, unidades:0, monto:0 }; }
            var mult = (PRODUCT_MAP[nm]||{}).mult||1;
            PM[nm].unidades += cant*mult; PM[nm].monto += monto;
            if (sal.esCajero) PM[nm].delivery += monto; else PM[nm].salon += monto;
          });
        });
      });
    }
    return PM;
  }

  // Label legible de un período
  function periodLabel(p) {
    if (!p) return '—';
    if (p.indexOf('anual-') === 0) {
      var k = p.slice(6);
      if (k.length === 7) return MN[+k.slice(5,7)] + ' ' + k.slice(0,4) + ' (hist)';
      return k + ' (hist)';
    }
    if (p.indexOf('todo-') === 0) return 'Todo ' + p.slice(5);
    if (months[p]) return MN[months[p].month] + ' ' + months[p].year;
    return p;
  }

  // Totales de un PM (excluye cortesia/comensales)
  function pmTotals(PM, canal) {
    var totG=0, totBeb=0, totCom=0, totMerch=0, totLC=0, totUn=0;
    Object.values(PM).forEach(function(p) {
      var m = getMonto(p, canal);
      if (EXCLUIR.indexOf(p.tipo) < 0) { totG += m; totUn += p.unidades; }
      if (p.tipo === 'bebida') totBeb += m;
      else if (p.tipo === 'comida') totCom += m;
      else if (p.tipo === 'merchandising' || p.tipo === 'nofood') totMerch += m;
      else if (p.tipo === 'local club' || p.tipo === 'invitados') totLC += m;
    });
    return { totG:totG, totBeb:totBeb, totCom:totCom, totMerch:totMerch, totLC:totLC, totUn:totUn };
  }

  function getMonto(p, canal) {
    if (canal === 'salon') return p.salon||0;
    if (canal === 'delivery') return p.delivery||0;
    return p.monto||0;
  }

  // ── UI: selector de modo ──────────────────────────────────────
  var modeRow = document.createElement('div');
  modeRow.style.cssText = 'display:flex;gap:8px;margin-bottom:18px;align-items:center;';
  var mLbl = document.createElement('span');
  mLbl.style.cssText = 'font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#555;margin-right:4px;';
  mLbl.textContent = 'Modo:';
  modeRow.appendChild(mLbl);
  ['ver','comparar'].forEach(function(m) {
    var btn = document.createElement('div');
    btn.className = 'mix-mode-btn' + (renderMixVentas._mode === m ? ' active' : '');
    btn.textContent = m === 'ver' ? '📊 Ver período' : '⇄ Comparar';
    btn.onclick = function() { renderMixVentas._mode = m; renderMixVentas(el); };
    modeRow.appendChild(btn);
  });
  el.appendChild(modeRow);

  // ── MODO VER ──────────────────────────────────────────────────
  if (renderMixVentas._mode === 'ver') {
    renderVerMode(el, months, monthKeys, yearsArr, anualYears, allYears, MN, EXCLUIR, getMonto, pmTotals, buildPM, periodLabel);
  } else {
    renderCmpMode(el, months, monthKeys, yearsArr, anualYears, allYears, MN, EXCLUIR, getMonto, pmTotals, buildPM, periodLabel);
  }
}

// ═══════════════════════════════════════════════════════════════
// MODO VER (un período, tabla completa igual que antes)
// ═══════════════════════════════════════════════════════════════
function renderVerMode(el, months, monthKeys, yearsArr, anualYears, allYears, MN, EXCLUIR, getMonto, pmTotals, buildPM, periodLabel) {
  var canal  = renderMixVentas._canal  || 'todos';
  var search = renderMixVentas._search || '';

  // ── Selector de período ──────────────────────────────────────
  var selWrap = document.createElement('div');
  selWrap.style.cssText = 'background:var(--ink);border-radius:2px;padding:12px 14px;margin-bottom:16px;';

  // Fila años (DIAS)
  if (yearsArr.length) {
    var rowYr = document.createElement('div');
    rowYr.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;';
    var lYr = document.createElement('span'); lYr.style.cssText = 'font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#555;min-width:60px;'; lYr.textContent = 'AÑO:';
    rowYr.appendChild(lYr);
    yearsArr.forEach(function(yr) {
      var key = 'todo-' + yr;
      var b = document.createElement('div');
      b.className = 'mix-period-btn' + (renderMixVentas._period === key ? ' active' : '');
      b.textContent = 'Todo ' + yr;
      b.onclick = function() { renderMixVentas._period = key; renderMixVentas(el); };
      rowYr.appendChild(b);
    });
    selWrap.appendChild(rowYr);
  }

  // Fila meses (DIAS) - agrupados por año
  yearsArr.forEach(function(yr) {
    var rowM = document.createElement('div');
    rowM.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;';
    var lM = document.createElement('span'); lM.style.cssText = 'font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#444;min-width:60px;'; lM.textContent = yr + ':';
    rowM.appendChild(lM);
    monthKeys.filter(function(k) { return k.slice(0,4) === yr; }).forEach(function(k) {
      var b = document.createElement('div');
      b.className = 'mix-period-btn' + (renderMixVentas._period === k ? ' active' : '');
      b.textContent = MN[months[k].month];
      b.onclick = function() { renderMixVentas._period = k; renderMixVentas(el); };
      rowM.appendChild(b);
    });
    selWrap.appendChild(rowM);
  });

  // Fila histórico (ANUAL_DATA)
  if (anualYears.length) {
    var sep = document.createElement('div'); sep.style.cssText = 'height:1px;background:#1a1a1a;margin:6px 0;'; selWrap.appendChild(sep);
    var rowH = document.createElement('div');
    rowH.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;align-items:center;';
    var lH = document.createElement('span'); lH.style.cssText = 'font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#7a5a9a;min-width:60px;'; lH.textContent = 'HIST:';
    rowH.appendChild(lH);
    anualYears.forEach(function(yr) {
      var key = 'anual-' + yr;
      // Verificar si hay meses individuales en ANUAL_DATA para este año
      var hasMeses = Object.keys(ANUAL_DATA).filter(function(k) { return k.length === 7 && k.slice(0,4) === yr; }).length > 1;

      var b = document.createElement('div');
      b.className = 'mix-period-btn hist' + (renderMixVentas._period === key ? ' active' : '');
      b.textContent = yr;
      b.onclick = function() { renderMixVentas._period = key; renderMixVentas(el); };
      rowH.appendChild(b);

      // Meses individuales del histórico si existen
      if (hasMeses) {
        for (var m = 1; m <= 12; m++) {
          var mk = yr + '-' + (m < 10 ? '0' : '') + m;
          if (!ANUAL_DATA[mk]) continue;
          var mkey = 'anual-' + mk;
          var mb = document.createElement('div');
          mb.className = 'mix-period-btn hist' + (renderMixVentas._period === mkey ? ' active' : '');
          mb.textContent = MN[m];
          mb.style.fontSize = '8px';
          mb.onclick = (function(k2) { return function() { renderMixVentas._period = k2; renderMixVentas(el); }; })(mkey);
          rowH.appendChild(mb);
        }
      }
    });
    selWrap.appendChild(rowH);
  }
  el.appendChild(selWrap);

  // ── Construir datos ──────────────────────────────────────────
  var PM = buildPM(renderMixVentas._period);
  var prods = Object.values(PM);
  var periLbl = periodLabel(renderMixVentas._period);

  if (!prods.length) {
    el.innerHTML += '<div style="padding:30px;text-align:center;color:#888">Sin datos para ' + periLbl + '</div>';
    return;
  }

  // KPIs
  var tots = pmTotals(PM, canal);
  renderMixKPIs(el, tots, null, null, periLbl, canal);

  // Controles de tabla
  var cr = buildMixControls(el, null, null);

  // Tabla
  renderMixTable(el, PM, null, tots, null, canal, search, periLbl, null, null, false);

  // Productos no vendidos
  renderNoVendidos(el, PM);

  // Eventos controles
  cr.chanSel.addEventListener('change', function() { renderMixVentas._canal = cr.chanSel.value; renderMixVentas(el); });
  cr.sInp.addEventListener('input',   function() { renderMixVentas._search = cr.sInp.value;  renderMixVentas(el); });
  cr.expBtn.addEventListener('click',  function() {
    var exp = cr.expBtn.dataset.exp === '1'; cr.expBtn.dataset.exp = exp ? '0' : '1';
    cr.expBtn.textContent = exp ? '▼ Expandir todo' : '▲ Colapsar todo';
    var main = el.querySelector('.mix-table-wrap');
    if (main) {
      main.querySelectorAll('[class*="mix-child-"]').forEach(function(r) { if(exp) r.classList.add('mix-hidden'); else r.classList.remove('mix-hidden'); });
      main.querySelectorAll('.mix-tog').forEach(function(t) { t.textContent = exp ? '▶' : '▼'; });
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// MODO COMPARAR — selección múltiple de períodos (hasta 6)
// ═══════════════════════════════════════════════════════════════
function renderCmpMode(el, months, monthKeys, yearsArr, anualYears, allYears, MN, EXCLUIR, getMonto, pmTotals, buildPM, periodLabel) {
  var canal  = renderMixVentas._canal  || 'todos';
  var search = renderMixVentas._search || '';
  var CMP_COLORS = ['var(--gold)','#4a9a6a','#c890e8','#8ab4d4','#d4a84b','#c23b22'];
  var MAX_CMP = 6;

  var selectedPeriods = renderMixVentas._cmpPeriods || [];

  // ── Panel de selección de períodos ───────────────────────────
  var selBox = document.createElement('div');
  selBox.style.cssText = 'background:var(--ink);border-radius:2px;padding:12px 14px;margin-bottom:12px;';

  var selHdr = document.createElement('div');
  selHdr.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;';
  selHdr.innerHTML = '<span style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:#888;">PERÍODOS A COMPARAR <span style="color:#555;font-weight:400">(click para agregar/quitar · máx '+MAX_CMP+')</span></span>';

  // Botón limpiar selección
  var clearBtn = document.createElement('div');
  clearBtn.style.cssText = 'padding:3px 10px;border-radius:2px;font-size:8px;cursor:pointer;border:1px solid #3a2a2a;color:#c23b22;';
  clearBtn.textContent = '× Limpiar';
  clearBtn.onclick = function() { renderMixVentas._cmpPeriods = []; renderMixVentas(el); };
  selHdr.appendChild(clearBtn);
  selBox.appendChild(selHdr);

  // Chips de seleccionados
  if (selectedPeriods.length) {
    var chipsRow = document.createElement('div');
    chipsRow.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #1a1a1a;';
    selectedPeriods.forEach(function(p, i) {
      var chip = document.createElement('div');
      var col = CMP_COLORS[i % CMP_COLORS.length];
      chip.style.cssText = 'display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:2px;font-size:9px;border:1px solid '+col+';color:'+col+';background:'+col+'18;';
      chip.innerHTML = '<span style="font-weight:700;min-width:14px;text-align:center;">'+(i+1)+'</span>' + periodLabel(p) +
        '<span style="cursor:pointer;opacity:.7;margin-left:4px;font-size:11px;" data-rm="'+i+'">&times;</span>';
      chip.querySelector('[data-rm]').onclick = function(e) {
        e.stopPropagation();
        var idx = parseInt(this.getAttribute('data-rm'));
        renderMixVentas._cmpPeriods.splice(idx, 1);
        renderMixVentas(el);
      };
      chipsRow.appendChild(chip);
    });
    selBox.appendChild(chipsRow);
  }

  // Selector de períodos disponibles
  function makePeriodsSelector() {
    // Años completos (DIAS)
    if (yearsArr.length) {
      var rowYr = document.createElement('div'); rowYr.style.cssText = 'display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:6px;';
      var lYr = document.createElement('span'); lYr.style.cssText = 'font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#555;min-width:55px;'; lYr.textContent = 'AÑO:';
      rowYr.appendChild(lYr);
      yearsArr.forEach(function(yr) {
        var key = 'todo-' + yr;
        var isSelected = selectedPeriods.indexOf(key) >= 0;
        var selIdx = selectedPeriods.indexOf(key);
        var col = isSelected ? CMP_COLORS[selIdx % CMP_COLORS.length] : '';
        var b = document.createElement('div');
        b.style.cssText = 'padding:4px 10px;border-radius:2px;font-size:9px;cursor:pointer;border:1px solid '+(isSelected?col:'var(--border)')+';color:'+(isSelected?col:'#888')+';background:'+(isSelected?col+'18':'transparent')+';user-select:none;font-weight:'+(isSelected?'700':'400')+';transition:all .12s;';
        b.textContent = 'Todo ' + yr + (isSelected?' ✓':'');
        b.onclick = function() { toggleCmpPeriod(key); };
        rowYr.appendChild(b);
      });
      selBox.appendChild(rowYr);
    }

    // Meses (DIAS) por año
    yearsArr.forEach(function(yr) {
      var rowM = document.createElement('div'); rowM.style.cssText = 'display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:5px;';
      var lM = document.createElement('span'); lM.style.cssText = 'font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#444;min-width:55px;'; lM.textContent = yr + ':';
      rowM.appendChild(lM);
      monthKeys.filter(function(k){ return k.slice(0,4)===yr; }).forEach(function(k) {
        var isSelected = selectedPeriods.indexOf(k) >= 0;
        var selIdx = selectedPeriods.indexOf(k);
        var col = isSelected ? CMP_COLORS[selIdx % CMP_COLORS.length] : '';
        var b = document.createElement('div');
        b.style.cssText = 'padding:4px 9px;border-radius:2px;font-size:9px;cursor:pointer;border:1px solid '+(isSelected?col:'var(--border)')+';color:'+(isSelected?col:'#888')+';background:'+(isSelected?col+'18':'transparent')+';user-select:none;font-weight:'+(isSelected?'700':'400')+';transition:all .12s;';
        b.textContent = MN[months[k].month] + (isSelected?' ✓':'');
        b.onclick = function() { toggleCmpPeriod(k); };
        rowM.appendChild(b);
      });
      selBox.appendChild(rowM);
    });

    // Histórico (ANUAL_DATA)
    if (anualYears.length) {
      var sep = document.createElement('div'); sep.style.cssText = 'height:1px;background:#1a1a1a;margin:6px 0;'; selBox.appendChild(sep);
      anualYears.forEach(function(yr) {
        var hasMeses = Object.keys(ANUAL_DATA).filter(function(k){ return k.length===7 && k.slice(0,4)===yr; }).length > 1;
        var rowH = document.createElement('div'); rowH.style.cssText = 'display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:4px;';
        var lH = document.createElement('span'); lH.style.cssText = 'font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#7a5a9a;min-width:55px;'; lH.textContent = yr+'(h):';
        rowH.appendChild(lH);
        // Año completo
        var key = 'anual-' + yr;
        var isSelected = selectedPeriods.indexOf(key) >= 0;
        var selIdx = selectedPeriods.indexOf(key);
        var col = isSelected ? CMP_COLORS[selIdx % CMP_COLORS.length] : '';
        var b = document.createElement('div');
        b.style.cssText = 'padding:4px 9px;border-radius:2px;font-size:9px;cursor:pointer;border:1px solid '+(isSelected?col:'#333')+';color:'+(isSelected?col:'#777')+';background:'+(isSelected?col+'18':'transparent')+';user-select:none;font-weight:'+(isSelected?'700':'400')+';transition:all .12s;';
        b.textContent = 'Todo ' + yr + (isSelected?' ✓':'');
        b.onclick = function() { toggleCmpPeriod(key); };
        rowH.appendChild(b);
        // Meses del histórico
        if (hasMeses) {
          for (var m = 1; m <= 12; m++) {
            var mk = yr + '-' + (m < 10 ? '0' : '') + m;
            if (!ANUAL_DATA[mk]) continue;
            var mkey = 'anual-' + mk;
            var isSelM = selectedPeriods.indexOf(mkey) >= 0;
            var selIdxM = selectedPeriods.indexOf(mkey);
            var colM = isSelM ? CMP_COLORS[selIdxM % CMP_COLORS.length] : '';
            var mb = document.createElement('div');
            mb.style.cssText = 'padding:4px 8px;border-radius:2px;font-size:8px;cursor:pointer;border:1px solid '+(isSelM?colM:'#333')+';color:'+(isSelM?colM:'#666')+';background:'+(isSelM?colM+'18':'transparent')+';user-select:none;font-weight:'+(isSelM?'700':'400')+';transition:all .12s;';
            mb.textContent = MN[m] + (isSelM?' ✓':'');
            mb.onclick = (function(k2){ return function(){ toggleCmpPeriod(k2); }; })(mkey);
            rowH.appendChild(mb);
          }
        }
        selBox.appendChild(rowH);
      });
    }
  }

  function toggleCmpPeriod(key) {
    var arr = renderMixVentas._cmpPeriods;
    var idx = arr.indexOf(key);
    if (idx >= 0) {
      arr.splice(idx, 1);
    } else if (arr.length < MAX_CMP) {
      arr.push(key);
    }
    renderMixVentas(el);
  }

  makePeriodsSelector();
  el.appendChild(selBox);

  // ── Necesita al menos 2 períodos ──────────────────────────────
  if (selectedPeriods.length < 2) {
    var hint = document.createElement('div');
    hint.style.cssText = 'padding:24px;text-align:center;color:#555;font-size:11px;';
    hint.innerHTML = 'Seleccioná al menos <strong style="color:#888">2 períodos</strong> para comparar.<br><span style="font-size:9px;color:#444">Podés elegir hasta '+MAX_CMP+' períodos simultáneamente.</span>';
    el.appendChild(hint);
    return;
  }

  // ── Construir PM para cada período ───────────────────────────
  var allPMs = selectedPeriods.map(function(p) { return { period:p, label:periodLabel(p), PM:buildPM(p) }; });

  // Unión de todos los productos
  var masterPM = {};
  allPMs.forEach(function(item) {
    Object.keys(item.PM).forEach(function(nm) {
      if (!masterPM[nm]) {
        var pm2 = PRODUCT_MAP[nm]||{};
        masterPM[nm] = { nombre:nm, tipo:pm2.tipo||item.PM[nm].tipo||'desconocido', clas:pm2.clas||item.PM[nm].clas||'SIN CLASIFICAR', subcl:pm2.subcl||item.PM[nm].subcl||'', salon:0, delivery:0, unidades:0, monto:0 };
      }
    });
  });

  var allTots = allPMs.map(function(item) { return pmTotals(item.PM, canal); });

  // ── KPIs multi-período ────────────────────────────────────────
  var kgWrap = document.createElement('div');
  kgWrap.style.cssText = 'background:var(--ink);border-radius:2px;padding:12px 14px;margin-bottom:12px;overflow-x:auto;';

  var kpiMetrics = [
    { label:'Total ventas', key:'totG' },
    { label:'Bebidas',      key:'totBeb' },
    { label:'Comidas',      key:'totCom' },
    { label:'Local Club',   key:'totLC' },
    { label:'Ticket/item',  key:null, fn:function(t){ return t.totUn?t.totG/t.totUn:0; } },
  ];

  var kpiHtml = '<table style="border-collapse:collapse;font-size:10px;width:100%;min-width:400px;">';
  kpiHtml += '<thead><tr style="border-bottom:1px solid #222;"><th style="text-align:left;padding:5px 8px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#555;font-weight:400;white-space:nowrap;">Métrica</th>';
  allPMs.forEach(function(item, i) {
    var col = CMP_COLORS[i % CMP_COLORS.length];
    kpiHtml += '<th style="text-align:right;padding:5px 8px;font-size:8px;color:'+col+';font-weight:700;white-space:nowrap;">'+item.label+'</th>';
  });
  // Columna vs primero
  if (allPMs.length > 1) kpiHtml += '<th style="text-align:right;padding:5px 8px;font-size:8px;color:#555;font-weight:400;white-space:nowrap;">vs ①</th>';
  kpiHtml += '</tr></thead><tbody>';

  kpiMetrics.forEach(function(m) {
    kpiHtml += '<tr style="border-bottom:1px solid #111;"><td style="padding:6px 8px;color:#aaa;font-weight:600;white-space:nowrap;">'+m.label+'</td>';
    var vals = allTots.map(function(t) { return m.fn ? m.fn(t) : t[m.key]; });
    vals.forEach(function(v, i) {
      var col = CMP_COLORS[i % CMP_COLORS.length];
      kpiHtml += '<td style="padding:6px 8px;text-align:right;color:'+col+';font-weight:700;white-space:nowrap;">'+fi(v)+'</td>';
    });
    // Var% vs primero
    if (allPMs.length > 1) {
      var base = vals[0];
      var varCells = vals.slice(1).map(function(v) {
        if (!base) return '<span style="color:#444">—</span>';
        var pct = ((v - base) / Math.abs(base) * 100);
        var col = pct > 0 ? '#7ec8a0' : pct < 0 ? '#c23b22' : '#888';
        return '<span style="color:'+col+';font-size:9px;font-weight:700">'+(pct>=0?'▲ +':'▼ ')+pct.toFixed(1)+'%</span>';
      }).join(' / ');
      kpiHtml += '<td style="padding:6px 8px;text-align:right;white-space:nowrap;">'+varCells+'</td>';
    }
    kpiHtml += '</tr>';
  });
  kpiHtml += '</tbody></table>';
  kgWrap.innerHTML = kpiHtml;
  el.appendChild(kgWrap);

  // Controles
  var cr = buildMixControls(el, null, null);

  // ── Tabla multi-período ───────────────────────────────────────
  renderMixTableMulti(el, allPMs, allTots, masterPM, canal, search, CMP_COLORS);

  cr.chanSel.addEventListener('change', function() { renderMixVentas._canal = cr.chanSel.value; renderMixVentas(el); });
  cr.sInp.addEventListener('input',   function() { renderMixVentas._search = cr.sInp.value;  renderMixVentas(el); });
  cr.expBtn.addEventListener('click',  function() {
    var exp = cr.expBtn.dataset.exp === '1'; cr.expBtn.dataset.exp = exp ? '0' : '1';
    cr.expBtn.textContent = exp ? '▼ Expandir todo' : '▲ Colapsar todo';
    var main = el.querySelector('.mix-table-wrap');
    if (main) {
      main.querySelectorAll('[class*="mix-child-"]').forEach(function(r) { if(exp) r.classList.add('mix-hidden'); else r.classList.remove('mix-hidden'); });
      main.querySelectorAll('.mix-tog').forEach(function(t) { t.textContent = exp ? '▶' : '▼'; });
    }
  });
}

// ── Tabla multi-período (N columnas) ─────────────────────────────
function renderMixTableMulti(el, allPMs, allTots, masterPM, canal, search, CMP_COLORS) {
  var EXCLUIR = ['cortesia','comensales'];
  var CLAS_ORDER_COM = ['TAPAS ASIATICAS','POKES BOWLS CEVICHES','SUSHI ROLLS','NIGIRIS','SASHIMIS','COMBOS','HOSOMAKIS','ESPECIALES','POSTRES','KIDS MENU','GREENSEASON','EVENTOS TERRAZA','MENU AÑO NUEVO','PROMOCIONES'];
  var tiposBase = ['bebida','comida','comensales','local club','invitados','cortesia','personal'];

  function getMonto(p, c) { return c==='salon'?p.salon||0:c==='delivery'?p.delivery||0:p.monto||0; }
  function sortClas(arr, order) {
    if (!order) return arr.slice().sort();
    var ordered=[], rest=[];
    order.forEach(function(o){ if(arr.indexOf(o)>=0) ordered.push(o); });
    arr.forEach(function(a){ if(order.indexOf(a)<0) rest.push(a); });
    return ordered.concat(rest.sort());
  }

  var N = allPMs.length;

  // Agrupar el PM maestro
  function groupPM(PM) {
    var CM = {};
    Object.values(PM).forEach(function(p) {
      var c = p.clas||'SIN CLASIFICAR', s = p.subcl||c;
      if (!CM[c]) CM[c] = { subcls:{} };
      if (!CM[c].subcls[s]) CM[c].subcls[s] = { prods:[] };
      CM[c].subcls[s].prods.push(p);
    });
    return CM;
  }
  var CMMaster = groupPM(masterPM);
  var clasAll = Object.keys(CMMaster);

  var tw = document.createElement('div'); tw.className = 'mix-table-wrap'; tw.style.cssText = 'overflow-x:auto;margin-bottom:20px;'; el.appendChild(tw);

  function varVsFirst(vals, canal) {
    var base = vals[0];
    if (!base || N < 2) return '';
    return vals.slice(1).map(function(v, i) {
      if (!base) return '—';
      var pct = ((v - base) / Math.abs(base) * 100);
      var col = pct > 0 ? '#7ec8a0' : pct < 0 ? '#c23b22' : '#888';
      return '<span style="color:'+col+';font-size:9px;font-weight:700">'+(pct>=0?'▲ +':'▼ ')+pct.toFixed(1)+'%</span>';
    }).join('<span style="color:#333"> / </span>');
  }

  function buildTable() {
    tw.innerHTML = '';
    var tbl = document.createElement('table');
    tbl.style.cssText = 'width:100%;border-collapse:collapse;font-size:10px;';

    // Header
    var thead = tbl.createTHead();
    var trH = thead.insertRow(); trH.style.cssText = 'background:var(--ink);color:#aaa;';
    var th0 = document.createElement('th'); th0.style.cssText = 'padding:8px 10px;text-align:left;font-size:8px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;white-space:nowrap;min-width:200px;'; th0.textContent = 'Clasificacion / Producto'; trH.appendChild(th0);
    allPMs.forEach(function(item, i) {
      var col = CMP_COLORS[i % CMP_COLORS.length];
      // Monto
      var th1 = document.createElement('th'); th1.style.cssText = 'padding:8px 8px;text-align:right;font-size:8px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:'+col+';white-space:nowrap;min-width:90px;'; th1.textContent = '('+(i+1)+') '+item.label; trH.appendChild(th1);
      // % Total
      var th2 = document.createElement('th'); th2.style.cssText = 'padding:8px 6px;text-align:right;font-size:7px;letter-spacing:.08em;text-transform:uppercase;font-weight:400;color:#555;white-space:nowrap;'; th2.textContent = '%Tot'; trH.appendChild(th2);
      // % Sección
      var th3 = document.createElement('th'); th3.style.cssText = 'padding:8px 6px;text-align:right;font-size:7px;letter-spacing:.08em;text-transform:uppercase;font-weight:400;color:#555;white-space:nowrap;'; th3.textContent = '%Sec'; trH.appendChild(th3);
    });
    if (N > 1) {
      var thV = document.createElement('th'); thV.style.cssText = 'padding:8px 8px;text-align:right;font-size:7px;letter-spacing:.1em;text-transform:uppercase;font-weight:400;color:#555;white-space:nowrap;'; thV.textContent = 'vs ①'; trH.appendChild(thV);
    }

    var tbody = tbl.createTBody();

    function renderSection(secLabel, secColor, filterFn, clasOrder) {
      var secClas = clasAll.filter(function(c) {
        return CMMaster[c].subcls && Object.values(CMMaster[c].subcls).some(function(sd) {
          return sd.prods.some(function(p) {
            if (!filterFn(p)) return false;
            if (search && p.nombre.toLowerCase().indexOf(search.toLowerCase()) < 0) return false;
            return allPMs.some(function(item) {
              var pp = item.PM[p.nombre];
              if (!pp) return false;
              var m = getMonto(pp, canal);
              return m > 0;
            });
          });
        });
      });
      if (!secClas.length) return;
      var orderedClas = sortClas(secClas, clasOrder);

      // Totales de sección por período
      var secTots = allPMs.map(function(item) {
        var t = 0;
        orderedClas.forEach(function(c) {
          Object.values(CMMaster[c].subcls).forEach(function(sd) {
            sd.prods.forEach(function(p) {
              if (!filterFn(p)) return;
              var pp = item.PM[p.nombre];
              if (pp) t += getMonto(pp, canal);
            });
          });
        });
        return t;
      });

      var trSec = tbody.insertRow(); trSec.className = 'mix-section-hdr';
      var secCell = trSec.insertCell();
      secCell.colSpan = 1 + N*3 + (N>1?1:0);
      secCell.style.cssText = 'padding:7px 10px;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:'+secColor+';font-weight:700;';
      var secInfo = secTots.map(function(t, i) {
        var col = CMP_COLORS[i % CMP_COLORS.length];
        var pctT = allTots[i].totG ? (t/allTots[i].totG*100) : 0;
        return '<span style="color:'+col+'">₡'+Math.round(t).toLocaleString('es-CR')+' ('+pctT.toFixed(1)+'%)</span>';
      }).join('<span style="color:#333"> · </span>');
      secCell.innerHTML = secLabel + ' <span style="font-weight:400;font-size:9px;margin-left:8px;">'+secInfo+'</span>';

      orderedClas.forEach(function(clas) {
        var cd = CMMaster[clas];
        var subKeys = Object.keys(cd.subcls).sort();
        if (subKeys.indexOf(clas) >= 0) { subKeys.splice(subKeys.indexOf(clas),1); subKeys.unshift(clas); }

        var subFil = [];
        subKeys.forEach(function(subcl) {
          var sd = cd.subcls[subcl];
          var pf = sd.prods.filter(function(p) {
            if (!filterFn(p)) return false;
            if (search && p.nombre.toLowerCase().indexOf(search.toLowerCase()) < 0) return false;
            return allPMs.some(function(item) {
              var pp = item.PM[p.nombre];
              return pp && getMonto(pp, canal) > 0;
            });
          });
          if (pf.length) subFil.push({subcl:subcl, prods:pf});
        });
        if (!subFil.length) return;

        // Totales de clasificación por período
        var clasTots = allPMs.map(function(item) {
          var t = 0;
          subFil.forEach(function(sf) { sf.prods.forEach(function(p) { var pp=item.PM[p.nombre]; if(pp&&filterFn(p)) t+=getMonto(pp,canal); }); });
          return t;
        });

        var cId = 'c_' + clas.replace(/[^a-zA-Z0-9]/g,'_');
        var trC = tbody.insertRow(); trC.className = 'mix-row-clas'; trC.dataset.cid = cId;

        var c0 = trC.insertCell(); c0.style.cssText = 'padding:9px 10px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:'+secColor+';word-break:break-word;';
        c0.innerHTML = '<span class="mix-tog" data-cid="'+cId+'">▶</span> ' + clas;
        clasTots.forEach(function(t, i) {
          var col = CMP_COLORS[i % CMP_COLORS.length];
          var pctT = allTots[i].totG ? (t/allTots[i].totG*100) : 0;
          var c1=trC.insertCell(); c1.style.cssText='padding:9px 8px;text-align:right;color:'+col+';font-weight:700;font-size:10px;white-space:nowrap;'; c1.textContent = t?'₡'+Math.round(t).toLocaleString('es-CR'):'—';
          var c2=trC.insertCell(); c2.style.cssText='padding:9px 6px;text-align:right;color:'+secColor+';font-size:9px;'; c2.textContent = pctT.toFixed(1)+'%';
          var c3=trC.insertCell(); c3.style.cssText='padding:9px 6px;text-align:right;color:#333;font-size:9px;'; c3.textContent='—';
        });
        if (N > 1) { var cv=trC.insertCell(); cv.style.cssText='padding:9px 8px;text-align:right;'; cv.innerHTML=varVsFirst(clasTots); }
        trC.onclick = function() { togC(cId); };

        subFil.forEach(function(sf) {
          var subcl = sf.subcl;
          var sId = cId + '_s_' + subcl.replace(/[^a-zA-Z0-9]/g,'_');
          var subTots = allPMs.map(function(item) {
            var t=0; sf.prods.forEach(function(p){ var pp=item.PM[p.nombre]; if(pp&&filterFn(p)) t+=getMonto(pp,canal); }); return t;
          });

          var trS = tbody.insertRow(); trS.className = 'mix-row-sub mix-child-' + cId + ' mix-hidden'; trS.dataset.sid = sId;
          var s0 = trS.insertCell(); s0.style.cssText = 'padding:8px 10px 8px 26px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#bbb;word-break:break-word;';
          s0.innerHTML = '<span class="mix-tog" data-sid="'+sId+'">▶</span> ' + subcl;
          subTots.forEach(function(t, i) {
            var col = CMP_COLORS[i % CMP_COLORS.length];
            var pctT = allTots[i].totG ? (t/allTots[i].totG*100) : 0;
            var pctC = clasTots[i] ? (t/clasTots[i]*100) : 0;
            var s1=trS.insertCell(); s1.style.cssText='padding:8px 8px;text-align:right;color:'+col+';font-size:10px;white-space:nowrap;'; s1.textContent=t?'₡'+Math.round(t).toLocaleString('es-CR'):'—';
            var s2=trS.insertCell(); s2.style.cssText='padding:8px 6px;text-align:right;color:#888;font-size:9px;'; s2.textContent=pctT.toFixed(1)+'%';
            var clColorS=pctC>40?'#7ec8a0':pctC>15?'#c8a96e':'#888';
            var s3=trS.insertCell(); s3.style.cssText='padding:8px 6px;text-align:right;font-size:9px;'; s3.innerHTML='<span style="color:'+clColorS+';font-weight:600;">'+pctC.toFixed(1)+'%</span>';
          });
          if (N > 1) { var sv=trS.insertCell(); sv.style.cssText='padding:8px 8px;text-align:right;'; sv.innerHTML=varVsFirst(subTots); }
          trS.onclick = function(e) { e.stopPropagation(); togS2(sId); };

          sf.prods.slice().sort(function(a,b){return a.nombre<b.nombre?-1:a.nombre>b.nombre?1:0;}).forEach(function(p, pi) {
            var prodTots = allPMs.map(function(item) { var pp=item.PM[p.nombre]; return pp?getMonto(pp,canal):0; });
            var tipColor = p.tipo==='bebida'?'#7ec8a0':p.tipo==='comida'?'var(--gold)':p.tipo==='merchandising'||p.tipo==='nofood'?'#c890e8':p.tipo==='local club'||p.tipo==='invitados'?'#d4a84b':p.tipo==='comensales'?'#444':p.tipo==='cortesia'?'#555':'#777';
            var bgP = pi%2===0?'#0d0d0d':'#111';
            var trP = tbody.insertRow(); trP.className = 'mix-row-prod mix-child-' + sId + ' mix-hidden';
            trP.style.background = bgP;
            trP.onmouseenter=function(){this.style.background='rgba(200,169,110,.06)';};
            trP.onmouseleave=function(){this.style.background=bgP;};
            var p0 = trP.insertCell(); p0.style.cssText = 'padding:6px 10px 6px 40px;color:var(--paper);font-size:10px;word-break:break-word;';
            p0.innerHTML = esc(p.nombre) + ' <span style="font-size:7px;letter-spacing:.06em;text-transform:uppercase;color:'+tipColor+';padding:1px 4px;border:1px solid '+tipColor+'44;border-radius:2px;margin-left:4px;">'+esc(p.tipo)+'</span>';
            prodTots.forEach(function(pm, i) {
              var col = CMP_COLORS[i % CMP_COLORS.length];
              var pctT = allTots[i].totG ? (pm/allTots[i].totG*100) : 0;
              var pctC = subTots[i] ? (pm/subTots[i]*100) : 0;
              var clColorP = pctC>30?'#7ec8a0':pctC>10?'#c8a96e':'#888';
              var pt1=trP.insertCell(); pt1.style.cssText='padding:6px 8px;text-align:right;color:'+col+';font-size:10px;white-space:nowrap;'; pt1.textContent=pm?'₡'+Math.round(pm).toLocaleString('es-CR'):'—';
              var pt2=trP.insertCell(); pt2.style.cssText='padding:6px 6px;text-align:right;font-size:9px;'; pt2.innerHTML='<span style="color:#666;">'+pctT.toFixed(2)+'%</span>';
              var pt3=trP.insertCell(); pt3.style.cssText='padding:6px 6px;text-align:right;font-size:9px;'; pt3.innerHTML='<span style="color:'+clColorP+';font-weight:600;">'+pctC.toFixed(1)+'%</span>';
            });
            if (N > 1) { var pv=trP.insertCell(); pv.style.cssText='padding:6px 8px;text-align:right;'; pv.innerHTML=varVsFirst(prodTots); }
          });
        });
      });
    }

    renderSection('BEBIDAS',              '#7ec8a0',    function(p){return p.tipo==='bebida';},    null);
    renderSection('COMIDAS',              'var(--gold)', function(p){return p.tipo==='comida';},    CLAS_ORDER_COM);
    renderSection('MERCHANDISING / OTROS','#c890e8',    function(p){return tiposBase.indexOf(p.tipo)<0;}, null);
    renderSection('PERSONAL',             '#888',       function(p){return p.tipo==='personal';},  null);
    renderSection('LOCAL CLUB',           '#d4a84b',    function(p){return p.tipo==='local club'||p.tipo==='invitados'||(p.clas||'').toLowerCase().indexOf('local club')>=0;}, null);
    renderSection('CORTESÍAS',            '#555',       function(p){return p.tipo==='cortesia';},  null);
    renderSection('COMENSALES',           '#444',       function(p){return p.tipo==='comensales';}, null);

    // Footer totales
    var tf = tbl.createTFoot();
    var trF = tf.insertRow(); trF.style.cssText = 'background:var(--ink);border-top:2px solid var(--border);';
    var f0 = trF.insertCell(); f0.style.cssText = 'padding:10px 10px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold);white-space:nowrap;'; f0.textContent = 'TOTAL';
    allTots.forEach(function(t, i) {
      var col = CMP_COLORS[i % CMP_COLORS.length];
      var f1=trF.insertCell(); f1.style.cssText='padding:10px 8px;text-align:right;color:'+col+';font-weight:700;white-space:nowrap;'; f1.textContent='₡'+Math.round(t.totG).toLocaleString('es-CR');
      var f2=trF.insertCell(); f2.style.cssText='padding:10px 6px;text-align:right;color:'+col+';font-weight:700;'; f2.textContent='100%';
      trF.insertCell();
    });
    if (N > 1) { var fv=trF.insertCell(); fv.style.cssText='padding:10px 8px;text-align:right;'; fv.innerHTML=varVsFirst(allTots.map(function(t){return t.totG;})); }

    tw.appendChild(tbl);

    function togC(id){ var ch=tbody.querySelectorAll('.mix-child-'+id); var av=false; ch.forEach(function(r){if(!r.classList.contains('mix-hidden'))av=true;}); ch.forEach(function(r){if(av)r.classList.add('mix-hidden');else r.classList.remove('mix-hidden');}); tbody.querySelectorAll('[data-cid="'+id+'"]').forEach(function(t){if(t.classList.contains('mix-tog'))t.textContent=av?'▶':'▼';}); }
    function togS2(id){ var ch=tbody.querySelectorAll('.mix-child-'+id); var av=false; ch.forEach(function(r){if(!r.classList.contains('mix-hidden'))av=true;}); ch.forEach(function(r){if(av)r.classList.add('mix-hidden');else r.classList.remove('mix-hidden');}); tbody.querySelectorAll('[data-sid="'+id+'"]').forEach(function(t){if(t.classList.contains('mix-tog'))t.textContent=av?'▶':'▼';}); }
    tbody.querySelectorAll('.mix-row-clas').forEach(function(row){ var id=row.dataset.cid; if(id) row.onclick=function(){togC(id);}; });
    tbody.querySelectorAll('.mix-row-sub').forEach(function(row){ var id=row.dataset.sid; if(id) row.onclick=function(e){e.stopPropagation();togS2(id);}; });
  }

  buildTable();
}

// ═══════════════════════════════════════════════════════════════
// KPI CARDS (modo ver: totsB=null / modo cmp: ambos)
// ═══════════════════════════════════════════════════════════════
function renderMixKPIs(el, totsA, totsB, lblA, lblB, canal) {
  var kg = document.createElement('div');
  var isCmp = totsB !== null;

  if (!isCmp) {
    // Modo ver: una sola fila de KPIs
    kg.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px;';
    var totG = totsA.totG;
    [
      { label:'Total Mix',     val:fi(totsA.totG),                                                              color:'var(--gold)' },
      { label:'Bebidas',       val:fi(totsA.totBeb) + (totG ? ' · ' + (totsA.totBeb/totG*100).toFixed(1) + '%' : ''), color:'#7ec8a0' },
      { label:'Comidas',       val:fi(totsA.totCom) + (totG ? ' · ' + (totsA.totCom/totG*100).toFixed(1) + '%' : ''), color:'var(--gold)' },
      { label:'Local Club',    val:fi(totsA.totLC)  + (totG ? ' · ' + (totsA.totLC/totG*100).toFixed(1)  + '%' : ''), color:'#d4a84b' },
      { label:'Merchandising', val:fi(totsA.totMerch) + (totG ? ' · ' + (totsA.totMerch/totG*100).toFixed(1) + '%' : ''), color:'#c890e8' },
      { label:'Unidades',      val:Math.round(totsA.totUn).toLocaleString('es-CR'), color:'#aaa' },
      { label:'Ticket / item', val:fi(totsA.totUn ? totsA.totG/totsA.totUn : 0), color:'var(--gold)' },
    ].forEach(function(k) {
      var c = document.createElement('div'); c.style.cssText = 'background:var(--ink);padding:10px 12px;border-radius:2px;';
      c.innerHTML = '<div style="font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#666;margin-bottom:5px">' + k.label + '</div>' +
        '<div style="font-family:Syne,sans-serif;font-size:clamp(10px,1.1vw,13px);font-weight:800;color:' + k.color + '">' + k.val + '</div>';
      kg.appendChild(c);
    });
  } else {
    // Modo comparar: tabla KPI con A|B|Var%
    kg.style.cssText = 'background:var(--ink);border-radius:2px;padding:14px 16px;margin-bottom:16px;';
    function varStr(a, b) {
      if (!a || !b) return '<span style="color:#444">—</span>';
      var pct = ((b - a) / a * 100);
      var c = pct > 0 ? '#7ec8a0' : pct < 0 ? '#c23b22' : '#888';
      return '<span style="color:' + c + ';font-weight:700">' + (pct >= 0 ? '▲ +' : '▼ ') + pct.toFixed(1) + '%</span>';
    }
    var rows = [
      { label:'Total ventas', a:totsA.totG,     b:totsB.totG,     color:'var(--gold)' },
      { label:'Bebidas',      a:totsA.totBeb,   b:totsB.totBeb,   color:'#7ec8a0' },
      { label:'Comidas',      a:totsA.totCom,   b:totsB.totCom,   color:'var(--gold)' },
      { label:'Local Club',   a:totsA.totLC,    b:totsB.totLC,    color:'#d4a84b' },
      { label:'Merch',        a:totsA.totMerch, b:totsB.totMerch, color:'#c890e8' },
      { label:'Ticket/item',  a:totsA.totUn?totsA.totG/totsA.totUn:0, b:totsB.totUn?totsB.totG/totsB.totUn:0, color:'#aaa' },
    ];
    var tblHtml = '<div style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:#4a9a6a;margin-bottom:10px">⇄ KPIs COMPARATIVOS</div>' +
      '<table style="width:100%;border-collapse:collapse;font-size:11px;">' +
      '<thead><tr style="border-bottom:1px solid #222;">' +
      '<th style="text-align:left;padding:5px 8px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#555;font-weight:400">Métrica</th>' +
      '<th style="text-align:right;padding:5px 8px;font-size:8px;color:var(--gold);font-weight:700">' + lblA + '</th>' +
      '<th style="text-align:right;padding:5px 8px;font-size:8px;color:#4a9a6a;font-weight:700">' + lblB + '</th>' +
      '<th style="text-align:right;padding:5px 8px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#555;font-weight:400">Var %</th>' +
      '<th style="text-align:right;padding:5px 8px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#555;font-weight:400">% Total A</th>' +
      '<th style="text-align:right;padding:5px 8px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:#555;font-weight:400">% Total B</th>' +
      '</tr></thead><tbody>';
    rows.forEach(function(r) {
      var pctA = totsA.totG ? (r.a / totsA.totG * 100) : 0;
      var pctB = totsB.totG ? (r.b / totsB.totG * 100) : 0;
      tblHtml += '<tr style="border-bottom:1px solid #111;">' +
        '<td style="padding:6px 8px;color:#aaa;font-weight:600">' + r.label + '</td>' +
        '<td style="padding:6px 8px;text-align:right;color:var(--gold);font-weight:700">' + fi(r.a) + '</td>' +
        '<td style="padding:6px 8px;text-align:right;color:#4a9a6a;font-weight:700">' + fi(r.b) + '</td>' +
        '<td style="padding:6px 8px;text-align:right">' + varStr(r.a, r.b) + '</td>' +
        '<td style="padding:6px 8px;text-align:right;color:#666">' + (pctA > 0 ? pctA.toFixed(1) + '%' : '—') + '</td>' +
        '<td style="padding:6px 8px;text-align:right;color:#666">' + (pctB > 0 ? pctB.toFixed(1) + '%' : '—') + '</td>' +
        '</tr>';
    });
    tblHtml += '</tbody></table>';
    kg.innerHTML = tblHtml;
  }
  el.appendChild(kg);
}

// CONTROLES (canal, búsqueda, expandir)

function buildMixControls(el, lblA, lblB) {

  [{v:'todos',l:'Salón + Delivery'},{v:'salon',l:'Solo Salón'},{v:'delivery',l:'Solo Delivery'}].forEach(function(o) {
    var opt = document.createElement('option'); opt.value = o.v; opt.textContent = o.l; chanSel.appendChild(opt);
  });
  chanSel.value = renderMixVentas._canal || 'todos';

  var sInp = document.createElement('input'); sInp.type = 'text'; sInp.placeholder = 'Buscar producto...';
  sInp.style.cssText = 'background:var(--ink);color:var(--paper);border:1px solid var(--border);padding:5px 10px;font-size:9px;border-radius:2px;width:160px;';
  sInp.value = renderMixVentas._search || '';

  var expBtn = document.createElement('div');
  expBtn.style.cssText = 'padding:5px 12px;border:1px solid var(--border);border-radius:2px;font-size:9px;cursor:pointer;color:#888;user-select:none;margin-left:auto;';
  expBtn.textContent = '▼ Expandir todo'; expBtn.dataset.exp = '0';

  exportBtn.className = 'btn-sm';

  cr.appendChild(chanSel); cr.appendChild(sInp); cr.appendChild(expBtn); cr.appendChild(exportBtn);
  el.appendChild(cr);
  return { chanSel:chanSel, sInp:sInp, expBtn:expBtn };
}

// ═══════════════════════════════════════════════════════════════
// TABLA PRINCIPAL (única o doble)
// ═══════════════════════════════════════════════════════════════
function renderMixTable(el, PMA, PMB, totsA, totsB, canal, search, lblA, lblB, clasOrderOverride, isCmp) {
  var CLAS_ORDER_COM = ['TAPAS ASIATICAS','POKES BOWLS CEVICHES','SUSHI ROLLS','NIGIRIS','SASHIMIS','COMBOS','HOSOMAKIS','ESPECIALES','POSTRES','KIDS MENU','GREENSEASON','EVENTOS TERRAZA','MENU AÑO NUEVO','PROMOCIONES'];
  var EXCLUIR = ['cortesia','comensales'];

  function getMonto(p, c) { return c==='salon'?p.salon||0:c==='delivery'?p.delivery||0:p.monto||0; }
  function sortClas(arr, order) {
    if (!order) return arr.slice().sort();
    var ordered = [], rest = [];
    order.forEach(function(o) { if(arr.indexOf(o)>=0) ordered.push(o); });
    arr.forEach(function(a) { if(order.indexOf(a)<0) rest.push(a); });
    return ordered.concat(rest.sort());
  }

  // Agrupar PMA (y PMB si existe)
  function groupPM(PM) {
    var CM = {};
    Object.values(PM).forEach(function(p) {
      var c = p.clas||'SIN CLASIFICAR', s = p.subcl||c;
      if (!CM[c]) CM[c] = { monto:0, unidades:0, salon:0, delivery:0, subcls:{} };
      if (!CM[c].subcls[s]) CM[c].subcls[s] = { monto:0, unidades:0, salon:0, delivery:0, prods:[] };
      CM[c].monto+=p.monto; CM[c].unidades+=p.unidades; CM[c].salon+=p.salon; CM[c].delivery+=p.delivery;
      CM[c].subcls[s].monto+=p.monto; CM[c].subcls[s].unidades+=p.unidades;
      CM[c].subcls[s].salon+=p.salon; CM[c].subcls[s].delivery+=p.delivery;
      CM[c].subcls[s].prods.push(p);
    });
    return CM;
  }

  var CMA = groupPM(PMA);
  var CMB = PMB ? groupPM(PMB) : null;
  var clasAll = Object.keys(CMA);

  // Color scale
  var allPcts = Object.values(PMA).filter(function(p){return p.monto>0;}).map(function(p){return totsA.totG?(p.monto/totsA.totG*100):0;});
  var maxPct = Math.max.apply(null, allPcts)||1, minPct = Math.min.apply(null, allPcts)||0;
  function pctColor(pct) {
    if(!pct) return '#555';
    var ratio = Math.max(0, Math.min(1, (pct-minPct)/(maxPct-minPct||1)));
    var r,g,b;
    if(ratio<0.5){var t=ratio*2;r=Math.round(194+(200-194)*t);g=Math.round(59+(169-59)*t);b=Math.round(34+(110-34)*t);}
    else{var t=(ratio-0.5)*2;r=Math.round(200+(46-200)*t);g=Math.round(169+(169-169)*t);b=Math.round(110+(50-110)*t);}
    return 'rgb('+r+','+g+','+b+')';
  }

  var tw = document.createElement('div'); tw.className = 'mix-table-wrap'; tw.style.cssText = 'overflow-x:auto;margin-bottom:20px;'; el.appendChild(tw);

  // Función var%
  function varStr(a, b) {
    if (!a && !b) return '<span style="color:#333">—</span>';
    if (!a) return '<span style="color:#7ec8a0">▲ nuevo</span>';
    if (!b) return '<span style="color:#c23b22">▼ -100%</span>';
    var pct = ((b - a) / Math.abs(a) * 100);
    var c = pct > 0 ? '#7ec8a0' : pct < 0 ? '#c23b22' : '#888';
    return '<span style="color:' + c + ';font-weight:700">' + (pct >= 0 ? '▲ +' : '▼ ') + pct.toFixed(1) + '%</span>';
  }

  function buildTable() {
    tw.innerHTML = '';
    var tbl = document.createElement('table');
    tbl.style.cssText = 'width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;';

    // Cabeceras
    var thead = tbl.createTHead();
    var trH = thead.insertRow(); trH.style.cssText = 'background:var(--ink);color:#aaa;';

    if (!isCmp) {
      // Modo ver: columnas normales
      var hdrs = [
        ['Clasificacion / Producto','left','28%'],['Uds','right','7%'],['Monto','right',''],
        ['% Total','right','8%'],['% Secc','right','8%'],['Salón','right',''],['Delivery','right',''],['Tipo','center','7%']
      ];
      hdrs.forEach(function(h) {
        var th = document.createElement('th');
        th.style.cssText = 'padding:9px 10px;text-align:'+h[1]+';font-size:8px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;white-space:nowrap;' + (h[2]?'width:'+h[2]+';':'');
        th.textContent = h[0]; trH.appendChild(th);
      });
    } else {
      // Modo comparar: columnas dobles A|B|Var%
      var hdrs2 = [
        { label:'Clasificacion / Producto', align:'left',   w:'24%', span:1 },
        { label:lblA,                       align:'right',  w:'',    span:1, color:'var(--gold)' },
        { label:'% Tot A',                  align:'right',  w:'7%',  span:1 },
        { label:'% Sec A',                  align:'right',  w:'7%',  span:1 },
        { label:lblB,                       align:'right',  w:'',    span:1, color:'#4a9a6a' },
        { label:'% Tot B',                  align:'right',  w:'7%',  span:1 },
        { label:'% Sec B',                  align:'right',  w:'7%',  span:1 },
        { label:'Var %',                    align:'right',  w:'8%',  span:1 },
        { label:'Tipo',                     align:'center', w:'7%',  span:1 },
      ];
      hdrs2.forEach(function(h) {
        var th = document.createElement('th');
        th.style.cssText = 'padding:9px 8px;text-align:'+h.align+';font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;white-space:nowrap;' + (h.w?'width:'+h.w+';':'') + (h.color?'color:'+h.color+';':'');
        th.textContent = h.label; trH.appendChild(th);
      });
    }

    var tbody = tbl.createTBody();
    var gT = 0, gU = 0, gTB = 0;

    function renderSection(secLabel, secColor, filterFn, clasOrder) {
      var secClas = clasAll.filter(function(c) {
        return Object.values(CMA[c].subcls).some(function(sd) {
          return sd.prods.some(function(p) {
            if (!filterFn(p)) return false;
            if (search && p.nombre.toLowerCase().indexOf(search.toLowerCase()) < 0) return false;
            if (canal==='salon' && getMonto(p,'salon')===0) return false;
            if (canal==='delivery' && getMonto(p,'delivery')===0) return false;
            return getMonto(p, canal) > 0;
          });
        });
      });
      if (!secClas.length) return;
      var orderedClas = sortClas(secClas, clasOrder);

      var secTotalA = 0, secTotalB = 0;
      orderedClas.forEach(function(c) {
        Object.values(CMA[c].subcls).forEach(function(sd) {
          sd.prods.forEach(function(p) { if(filterFn(p)) secTotalA += getMonto(p, canal); });
        });
        if (CMB && CMB[c]) {
          Object.values(CMB[c].subcls).forEach(function(sd) {
            sd.prods.forEach(function(p) { if(filterFn(p)) secTotalB += getMonto(p, canal); });
          });
        }
      });

      // Header sección
      var trSec = tbody.insertRow(); trSec.className = 'mix-section-hdr';
      var secCell = trSec.insertCell(); secCell.colSpan = isCmp ? 9 : 8;
      secCell.style.cssText = 'padding:7px 10px;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:'+secColor+';font-weight:700;';
      var secInfo = '₡' + Math.round(secTotalA).toLocaleString('es-CR') + ' · ' + (totsA.totG ? (secTotalA/totsA.totG*100).toFixed(1)+'%' : '—');
      if (isCmp && secTotalB > 0) {
        var secVar = secTotalA ? ((secTotalB-secTotalA)/secTotalA*100) : null;
        var secVarStr = secVar !== null ? ' · ' + (secVar>=0?'▲ +':'▼ ') + Math.abs(secVar).toFixed(1)+'%' : '';
        secInfo += '  /  ' + lblB + ': ₡' + Math.round(secTotalB).toLocaleString('es-CR') + secVarStr;
      }
      secCell.innerHTML = secLabel + ' <span style="color:#444;font-weight:400;margin-left:8px;">' + secInfo + '</span>';

      orderedClas.forEach(function(clas) {
        var cd = CMA[clas];
        var cdB = (CMB && CMB[clas]) ? CMB[clas] : null;

        var subKeys = Object.keys(cd.subcls).sort();
        if (subKeys.indexOf(clas) >= 0) { subKeys.splice(subKeys.indexOf(clas),1); subKeys.unshift(clas); }

        var subFil = [];
        subKeys.forEach(function(subcl) {
          var sd = cd.subcls[subcl];
          var pf = sd.prods.filter(function(p) {
            if (!filterFn(p)) return false;
            if (search && p.nombre.toLowerCase().indexOf(search.toLowerCase()) < 0) return false;
            if (canal==='salon' && getMonto(p,'salon')===0) return false;
            if (canal==='delivery' && getMonto(p,'delivery')===0) return false;
            return getMonto(p, canal) > 0;
          });
          if (pf.length) subFil.push({ subcl:subcl, prods:pf });
        });
        if (!subFil.length) return;

        var cM=0, cU=0, cSal=0, cDel=0;
        subFil.forEach(function(s) { s.prods.forEach(function(p) { var m=getMonto(p,canal); cM+=m; cU+=p.unidades; cSal+=p.salon; cDel+=p.delivery; }); });

        // Monto de clasificación en período B
        var cMB = 0;
        if (cdB) { Object.values(cdB.subcls).forEach(function(sd) { sd.prods.forEach(function(p) { if(filterFn(p)) cMB += getMonto(p, canal); }); }); }

        gT += cM; gU += cU;
        if (isCmp) gTB += cMB;

        var cId = 'c_' + clas.replace(/[^a-zA-Z0-9]/g,'_');
        var pC = totsA.totG ? (cM/totsA.totG*100) : 0;
        var pCB = totsB && totsB.totG ? (cMB/totsB.totG*100) : 0;

        var trC = tbody.insertRow(); trC.className = 'mix-row-clas'; trC.dataset.cid = cId;

        if (!isCmp) {
          trC.innerHTML =
            '<td style="padding:10px 10px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:'+secColor+';word-break:break-word;">' +
              '<span class="mix-tog" data-cid="'+cId+'">▶</span> ' + clas + '</td>' +
            '<td style="padding:10px 10px;text-align:right;color:#aaa;font-size:10px;">'+Math.round(cU).toLocaleString('es-CR')+'</td>' +
            '<td style="padding:10px 10px;text-align:right;color:'+secColor+';font-weight:700;">₡'+Math.round(cM).toLocaleString('es-CR')+'</td>' +
            '<td style="padding:10px 10px;text-align:right;color:'+secColor+';font-weight:700;">'+pC.toFixed(2)+'%</td>' +
            '<td style="padding:10px 10px;text-align:right;color:#333;">—</td>' +
            '<td style="padding:10px 10px;text-align:right;color:#7aaa7a;font-size:10px;">'+(cSal>0?'₡'+Math.round(cSal).toLocaleString('es-CR'):'—')+'</td>' +
            '<td style="padding:10px 10px;text-align:right;color:#8ab4d4;font-size:10px;">'+(cDel>0?'₡'+Math.round(cDel).toLocaleString('es-CR'):'—')+'</td>' +
            '<td style="padding:10px 10px;"></td>';
        } else {
          trC.innerHTML =
            '<td style="padding:10px 8px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:'+secColor+';word-break:break-word;">' +
              '<span class="mix-tog" data-cid="'+cId+'">▶</span> ' + clas + '</td>' +

// PRODUCTOS NO VENDIDOS
