function renderXLS(el){
  const dates = getDates();
  const isConfigured = !!BACKEND_URL;

  el.innerHTML = '';

  // ── Backend panel ──
  const backendPanel = document.createElement('div');
  backendPanel.style.cssText = `background:var(--ink);border-radius:2px;padding:18px 22px;margin-bottom:20px;border-left:3px solid ${isConfigured?'var(--green)':'var(--gold)'}`;
  backendPanel.innerHTML = `
    <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:10px">☁ Google Sheets Backend</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input id="backend-url-inp" type="url" placeholder="Pega la URL del Apps Script de Google..."
        value="${BACKEND_URL}"
        style="flex:1;min-width:200px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:8px 12px;color:#f0ece4;font-family:'DM Mono',monospace;font-size:10px;outline:none">
      <button onclick="saveBackendUrl()" class="btn-sm">Guardar URL</button>
      <button onclick="syncFromCloud()" class="btn-sm">⟳ Sincronizar</button>
    </div>
    <div style="margin-top:8px;font-size:9px;color:${isConfigured?'#4a7':'#666'}">
      ${isConfigured ? '✓ Backend configurado · Datos sincronizados en todos los dispositivos' : '⚠ Sin backend · Solo este dispositivo'}
    </div>
  `;
  el.appendChild(backendPanel);

  // ── Storage bar ──
  const storageBar = document.createElement('div');
  storageBar.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 16px;background:var(--panel);border:1px solid var(--border);border-radius:2px;font-size:10px;';
  storageBar.innerHTML = `
    <span style="color:var(--muted)">💾 ${getStorageUsage()} KB · ${Object.keys(DIAS).length} reporte(s)</span>
    <button class="btn-sm" style="margin-left:auto" onclick="exportBackup()">⬇ Backup JSON</button>
    <button class="btn-sm" onclick="document.getElementById('import-inp').click()">⬆ Importar</button>
    <input type="file" id="import-inp" accept=".json" style="display:none" onchange="importBackup(this)">
  `;
  el.appendChild(storageBar);

  // ── Two column layout: Upload + Calendar ──
  const twoCol = document.createElement('div');
  twoCol.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;';
  el.appendChild(twoCol);

  // Left: upload zone
  const uploadCol = document.createElement('div');
  uploadCol.innerHTML = `
    <div class="upload-zone" id="drop-zone"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="handleDrop(event)"
      onclick="document.getElementById('xls-file-inp').click()">
      <div class="upload-icon">📂</div>
      <div class="upload-title">Arrastrá el XLS aquí<br>o hacé clic para seleccionar</div>
      <div class="upload-sub">Archivos .xls · .xlsx · podés seleccionar varios a la vez</div>
      <input type="file" id="xls-file-inp" accept=".xls,.xlsx" style="display:none" multiple
        onchange="handleFilesSelect(this.files)">
    </div>
  `;
  twoCol.appendChild(uploadCol);

  // Right: calendar
  const calCol = document.createElement('div');
  twoCol.appendChild(calCol);

  // Build calendar
  const today = new Date();
  let calYear  = today.getFullYear();
  let calMonth = today.getMonth(); // 0-indexed

  function buildCalendar(){
    calCol.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'cal-wrap';

    const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                    'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const DOWS = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'cal-header';
    hdr.innerHTML = `
      <button class="cal-nav" id="cal-prev">‹</button>
      <div class="cal-month">${MONTHS[calMonth]} ${calYear}</div>
      <button class="cal-nav" id="cal-next">›</button>
    `;
    wrap.appendChild(hdr);

    // Day of week headers (Mon-Sun)
    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    DOWS.forEach(d => {
      const dh = document.createElement('div');
      dh.className = 'cal-dow';
      dh.textContent = d;
      grid.appendChild(dh);
    });

    // First day of month (adjust to Mon=0)
    const firstDay = new Date(calYear, calMonth, 1);
    let startDow = firstDay.getDay(); // 0=Sun
    startDow = startDow === 0 ? 6 : startDow - 1; // Mon=0
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    const todayStr = new Date().toISOString().slice(0,10);

    // Empty cells before first day
    for(let i=0;i<startDow;i++){
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      grid.appendChild(empty);
    }

    // Day cells
    for(let d=1; d<=daysInMonth; d++){
      const mm = String(calMonth+1).padStart(2,'0');
      const dd = String(d).padStart(2,'0');
      const dateStr = `${calYear}-${mm}-${dd}`;
      const hasData = !!DIAS[dateStr];
      const isToday = dateStr === todayStr;
      const isFuture = dateStr > todayStr;

      const cell = document.createElement('div');
      cell.className = 'cal-day' +
        (hasData ? ' has-data' : isFuture ? ' empty' : ' no-data') +
        (isToday ? ' today' : '');
      cell.textContent = d;
      cell.title = hasData
        ? `✓ ${fmtDate(dateStr)} · ${Object.keys(DIAS[dateStr].saloneros||{}).length} saloneros`
        : isFuture ? '' : `Sin datos — ${fmtDate(dateStr)}`;

      if(hasData){
        // Dot indicator
        const dot = document.createElement('div');
        dot.className = 'cal-dot';
        dot.style.background = 'var(--green)';
        cell.appendChild(dot);
        // Click to scroll to that entry in the list
        cell.onclick = () => {
          const row = document.getElementById('row-'+dateStr);
          if(row){ row.scrollIntoView({behavior:'smooth',block:'center'}); row.style.background='#1a2e1a'; setTimeout(()=>row.style.background='',1000); }
        };
      }
      grid.appendChild(cell);
    }

    wrap.appendChild(grid);

    // Legend
    const legend = document.createElement('div');
    legend.style.cssText = 'display:flex;gap:14px;margin-top:12px;font-size:9px;color:#555;';
    legend.innerHTML = `
      <span><span style="display:inline-block;width:8px;height:8px;background:#1a2e1a;border:1px solid #2a4a2a;border-radius:1px;margin-right:4px;vertical-align:middle"></span>Cargado</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:#111;border:1px solid #1a1a1a;border-radius:1px;margin-right:4px;vertical-align:middle"></span>Sin datos</span>
    `;
    wrap.appendChild(legend);

    calCol.appendChild(wrap);

    document.getElementById('cal-prev').onclick = (e) => { e.stopPropagation(); calMonth--; if(calMonth<0){calMonth=11;calYear--;} buildCalendar(); };
    document.getElementById('cal-next').onclick = (e) => { e.stopPropagation(); calMonth++; if(calMonth>11){calMonth=0;calYear++;} buildCalendar(); };
  }

  buildCalendar();

  // Responsive: stack on mobile
  if(window.innerWidth < 600){
    twoCol.style.gridTemplateColumns = '1fr';
  }

  // ── Collapsible file list ──
  const listWrap = document.createElement('div');
  listWrap.style.cssText = 'border:1px solid var(--border);border-radius:2px;margin-top:4px;';

  const listHeader = document.createElement('div');
  listHeader.className = 'upload-list-header';
  const lastDate = dates[dates.length-1];
  const lastDia  = lastDate ? DIAS[lastDate] : null;
  listHeader.innerHTML = `
    <div>
      <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:4px">Reportes cargados · ${dates.length} archivo(s)</div>
      ${lastDia ? `<div style="display:flex;align-items:center;gap:10px;">
        <div class="upload-dot"></div>
        <span style="font-size:11px;font-weight:600;color:#f0ece4">${lastDia.fileName||'reporte'}</span>
        <span style="font-size:10px;color:var(--gold)">${fmtDate(lastDate)}</span>
        <span style="font-size:9px;color:#555">${Object.keys(lastDia.saloneros||{}).length} saloneros</span>
      </div>` : '<div style="font-size:10px;color:#555">No hay reportes cargados aún</div>'}
    </div>
    <div class="upload-list-toggle" id="list-toggle">▼</div>
  `;
  listWrap.appendChild(listHeader);

  const listBody = document.createElement('div');
  listBody.className = 'upload-list-body';
  listBody.id = 'upload-list-body';

  if(dates.length){
    const listInner = document.createElement('div');
    listInner.className = 'upload-list';
    // Show most recent first
    [...dates].reverse().forEach(d => {
      const dia = DIAS[d];
      const row = document.createElement('div');
      row.className = 'upload-row';
      row.id = 'row-'+d;
      row.innerHTML = `
        <div class="upload-dot"></div>
        <div class="upload-fname">${dia.fileName||'reporte'}</div>
        <div class="upload-date">${fmtDate(d)}</div>
        <div style="font-size:9px;color:var(--muted)">${Object.keys(dia.saloneros||{}).length} saloneros</div>
        <button class="upload-del" onclick="deleteDay('${d}')" title="Eliminar">×</button>
      `;
      listInner.appendChild(row);
    });
    listBody.appendChild(listInner);
  }
  listWrap.appendChild(listBody);
  el.appendChild(listWrap);

  // Toggle collapsible
  let listOpen = false;
  listHeader.onclick = () => {
    listOpen = !listOpen;
    listBody.classList.toggle('open', listOpen);
    document.getElementById('list-toggle').classList.toggle('open', listOpen);
  };
  // Auto-open if few files
  if(dates.length > 0 && dates.length <= 5){
    listOpen = true;
    listBody.classList.add('open');
    document.getElementById('list-toggle').classList.add('open');
  }
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag');
  const files = e.dataTransfer.files;
  if(files.length) handleFilesSelect(files);
}

// ── Multi-file upload queue ──
let UPLOAD_QUEUE = [];   // [{file, fecha|null}, ...]
let UPLOAD_INDEX = 0;

function extractDateFromFilename(name){
  // Try patterns: "salon 13 03 2026", "salon_13_03_2026", "13-03-2026", "2026-03-13", "13032026"
  const s = name.replace(/[_\-]/g,' ');
  // YYYY MM DD
  let m = s.match(/(\d{4})\s+(\d{2})\s+(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  // DD MM YYYY  
  m = s.match(/(\d{1,2})\s+(\d{1,2})\s+(\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  // DDMMYYYY
  m = name.match(/(\d{2})(\d{2})(\d{4})/);
  if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  return null;
}

function handleFilesSelect(files){
  if(!files || !files.length) return;
  UPLOAD_QUEUE = [];
  for(let i=0; i<files.length; i++){
    const file = files[i];
    const fecha = extractDateFromFilename(file.name);
    UPLOAD_QUEUE.push({ file, fecha });
  }
  UPLOAD_INDEX = 0;
  processNextInQueue();
}

function handleFileSelect(file){
  if(!file) return;
  handleFilesSelect([file]);
}

function processNextInQueue(){
  if(UPLOAD_INDEX >= UPLOAD_QUEUE.length){
    // All done
    renderView('xls');
    rebuildAllSals();
    buildLogin();
    const total = UPLOAD_QUEUE.length;
    if(total > 1) showSyncStatus(`✓ ${total} archivos procesados`, false, 5000);
    UPLOAD_QUEUE = [];
    return;
  }

  const item = UPLOAD_QUEUE[UPLOAD_INDEX];
  const remaining = UPLOAD_QUEUE.length - UPLOAD_INDEX;

  if(item.fecha){
    // Date detected from filename — upload directly
    const remainingStr = remaining > 1 ? ` (${UPLOAD_QUEUE.length - UPLOAD_INDEX - 1} más en cola)` : '';
    showSyncStatus(`⟳ Procesando ${item.file.name}...`);
    parseXLS(item.file, item.fecha, ()=>{
      UPLOAD_INDEX++;
      processNextInQueue();
    });
  } else {
    // Need to ask for date
    PENDING_FILE = item.file;
    const modal = document.getElementById('modal-fecha');
    const remainingStr = remaining > 1 ? ` (${remaining} de ${UPLOAD_QUEUE.length})` : '';
    document.getElementById('modal-fname-label').textContent = item.file.name + remainingStr;
    document.getElementById('modal-fecha-input').value = today();
    document.getElementById('modal-overwrite-warn').style.display = 'none';
    document.getElementById('modal-fecha-input').oninput = function(){
      document.getElementById('modal-overwrite-warn').style.display = DIAS[this.value] ? 'block' : 'none';
    };
    modal.classList.add('open');
  }
}

function confirmUpload(){
  const fecha = document.getElementById('modal-fecha-input').value;
  if(!fecha){ alert('Selecciona una fecha'); return; }
  closeModal('modal-fecha');
  if(!PENDING_FILE) return;
  const file = PENDING_FILE;
  PENDING_FILE = null;
  // Update queue item with confirmed date
  if(UPLOAD_QUEUE[UPLOAD_INDEX]) UPLOAD_QUEUE[UPLOAD_INDEX].fecha = fecha;
  parseXLS(file, fecha, ()=>{
    UPLOAD_INDEX++;
    processNextInQueue();
  });
}

function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function deleteDay(fecha){
  if(!confirm(`¿Eliminar el reporte del ${fmtDate(fecha)}?`)) return;
  delete DIAS[fecha];
  saveDias();
  renderView('xls');
}

// ── XLS Parser (BIFF8 / OLE2) ──
function parseXLS(file, fecha, onDone){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const result = parseBIFF8(e.target.result);
      if(!result || !Object.keys(result).length){
        alert('No se pudieron extraer datos del archivo. Verifica que sea el formato correcto (XLS de Satori).');
        return;
      }
      DIAS[fecha] = { fileName: file.name, uploadedAt: today(), saloneros: result };
      saveDias();
      rebuildAllSals();
      buildLogin();
      // Push to cloud
      saveDiaOne(fecha).then(ok => {
        showSyncStatus(ok ? '✓ Guardado en la nube' : '⚠ Solo local (sin internet)', !ok, 4000);
      });
      // Update competitions
      updateCompsFromDay(fecha, result);
      // Only refresh view if no callback (single file) or last in queue
      if(!onDone) {
        renderView('xls');
        rebuildAllSals();
        buildLogin();
        alert(`✓ Datos del ${fmtDate(fecha)} cargados.\n${Object.keys(result).length} entradas procesadas.`);
      }
      if(onDone) onDone();
    }catch(err){
      console.error(err);
      alert('Error al procesar el archivo: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseBIFF8(buffer){
  const data = new Uint8Array(buffer);
  function u16(o){ return data[o]|(data[o+1]<<8); }
  function u32(o){ return data[o]|(data[o+1]<<8)|(data[o+2]<<16)|(data[o+3]<<24); }

  // OLE2 / CFB
  const secSize = 1 << u16(0x1E);
  const fatCount = u32(0x2C);

  // Build FAT
  const fat = [];
  for(let i=0; i<fatCount; i++){
    const sec = u32(0x4C + i*4);
    const off = (sec+1)*secSize;
    for(let j=0; j<secSize/4; j++) fat.push(u32(off + j*4));
  }

  function readChain(start){
    const chunks = [];
    let sec = start;
    let guard = 0;
    while(sec < 0xFFFFFFFE && guard++ < 4096){
      const off = (sec+1)*secSize;
      chunks.push(data.slice(off, off+secSize));
      sec = fat[sec];
    }
    const total = chunks.reduce((s,c)=>s+c.length,0);
    const out = new Uint8Array(total);
    let pos=0; chunks.forEach(c=>{out.set(c,pos);pos+=c.length;});
    return out;
  }

  // Directory
  const dirSec = u32(0x30);
  const dir = readChain(dirSec);
  function du16(o){ return dir[o]|(dir[o+1]<<8); }
  function du32(o){ return dir[o]|(dir[o+1]<<8)|(dir[o+2]<<16)|(dir[o+3]<<24); }

  let wbStart=-1, wbSize=0;
  for(let i=0; i*128 < dir.length; i++){
    const o=i*128;
    const nlen=du16(o+0x40);
    let name='';
    if(nlen>2){ for(let j=0;j<(nlen-2)/2;j++) name+=String.fromCharCode(dir[o+j*2]|(dir[o+j*2+1]<<8)); }
    const t=dir[o+0x42];
    const start=du32(o+0x74), size=du32(o+0x78);
    if((name==='Workbook'||name==='Book')&&t===2){ wbStart=start; wbSize=size; break; }
  }
  if(wbStart<0) throw new Error('No se encontró la hoja de cálculo en el archivo');

  const wb = readChain(wbStart).slice(0, wbSize);
  function wu16(o){ return wb[o]|(wb[o+1]<<8); }
  function wu32(o){ return wb[o]|(wb[o+1]<<8)|(wb[o+2]<<16)|(wb[o+3]<<24); }

  // SST
  const sst=[];
  let pos=0;
  while(pos < wb.length-4){
    const rec=wu16(pos), rlen=wu16(pos+2);
    if(rec===0x00FC){
      const unique=wu32(pos+8);
      let p=pos+12;
      for(let s=0; s<unique; s++){
        const slen=wu16(p); const flags=wb[p+2]; p+=3;
        let str='';
        if(flags&1){ for(let k=0;k<slen;k++){str+=String.fromCharCode(wb[p]|(wb[p+1]<<8));p+=2;} }
        else{ for(let k=0;k<slen;k++){str+=String.fromCharCode(wb[p]);p++;} }
        sst.push(str);
      }
      break;
    }
    pos+=4+rlen;
  }

  // Cells
  const rows={};
  pos=0;
  while(pos < wb.length-4){
    const rec=wu16(pos), rlen=wu16(pos+2);
    if(rec===0x00FD){ // LABELSST
      const r=wu16(pos+4), c=wu16(pos+6), si=wu32(pos+10);
      if(!rows[r]) rows[r]={};
      rows[r][c] = si<sst.length?sst[si]:'';
    } else if(rec===0x0203){ // NUMBER
      const r=wu16(pos+4), c=wu16(pos+6);
      const view=new DataView(wb.buffer, wb.byteOffset+pos+10, 8);
      const v=view.getFloat64(0,true);
      if(!rows[r]) rows[r]={};
      rows[r][c]=Math.round(v*100)/100;
    } else if(rec===0x027E){ // RK
      const r=wu16(pos+4), c=wu16(pos+6);
      const rk=wu32(pos+10);
      let v;
      if(rk&2){ v=(rk>>2); } else {
        const tmp=new Uint8Array(8);
        const rkv=(rk&0xFFFFFFFC); tmp[4]=rkv&0xFF; tmp[5]=(rkv>>8)&0xFF; tmp[6]=(rkv>>16)&0xFF; tmp[7]=(rkv>>24)&0xFF;
        v=new DataView(tmp.buffer).getFloat64(0,true);
      }
      if(rk&1) v/=100;
      if(!rows[r]) rows[r]={};
      rows[r][c]=Math.round(v*100)/100;
    } else if(rec===0x00BD){ // MULRK
      const r=wu16(pos+4), firstC=wu16(pos+6);
      const count=(rlen-2)/6;
      for(let k=0;k<count;k++){
        const rk=wu32(pos+10+k*6);
        let v;
        if(rk&2){ v=(rk>>2); } else {
          const tmp=new Uint8Array(8);
          const rkv=(rk&0xFFFFFFFC); tmp[4]=rkv&0xFF; tmp[5]=(rkv>>8)&0xFF; tmp[6]=(rkv>>16)&0xFF; tmp[7]=(rkv>>24)&0xFF;
          v=new DataView(tmp.buffer).getFloat64(0,true);
        }
        if(rk&1) v/=100;
        if(!rows[r]) rows[r]={};
        rows[r][firstC+k]=Math.round(v*100)/100;
      }
    }
    pos+=4+rlen;
  }

  // Find headers row (row 0)
  const hdr=rows[0]||{};
  const COL={};
  Object.entries(hdr).forEach(([c,v])=>{ if(typeof v==='string') COL[v]=parseInt(c); });

  // Group by salonero (trim names to avoid 'Jota ' != 'Jota')
  const sal_rows={};
  Object.entries(rows).forEach(([ri,row])=>{
    if(parseInt(ri)===0) return;
    const rawSal=row[COL['Salonero']||0];
    if(!rawSal||typeof rawSal!=='string') return;
    const sal=rawSal.trim();
    if(!sal) return;
    if(!sal_rows[sal]) sal_rows[sal]={rows:[]};
    sal_rows[sal].rows.push(row);
  });

  // Extract per-salonero metrics
  const result={};
  Object.entries(sal_rows).forEach(([sal, {rows: srows}])=>{
    // Get summary columns from first row that has them
    let pax=0, total=0, com=0, beb=0, iCom=0, iBeb=0;
    const prodMap={};

    // PAX item + sum IVA and Servicio for net total calculation
    let sumIVA=0, sumServ=0;
    srows.forEach(row=>{
      const prod=(row[COL['Producto']||1]||'').toString().trim().toUpperCase();
      if(prod==='PAX'){
        const q=row[COL['Cantidad']||2];
        if(q && typeof q==='number' && q>0) pax=Math.max(pax, Math.round(q));
      }
      const qty=row[COL['Cantidad']||2]||0;
      const monto=row[COL['MontoTotal']||3]||0;
      const iva=row[COL['IVA']||4]||0;
      const serv=row[COL['Servicio']||5]||0;
      if(typeof iva==='number') sumIVA+=iva;
      if(typeof serv==='number') sumServ+=serv;
      if(typeof monto==='number' && monto>0 && prod!=='PAX'){
        prodMap[prod]=(prodMap[prod]||{q:0,m:0});
        prodMap[prod].q+=typeof qty==='number'?Math.round(qty):0;
        prodMap[prod].m+=monto;
      }
    });

    // Summary columns — total neto = col O minus IVA and Servicio
    // beb/com use cols L/M (include taxes) — ratio still valid since same rate for all mesa products
    srows.forEach(row=>{
      if(row[COL['VentasTotalesMesero']||14]>0) total=row[COL['VentasTotalesMesero']||14];
      if(row[COL['VentasComidasMesero']||12]>0) com=row[COL['VentasComidasMesero']||12];
      if(row[COL['VentasBebidasMesero']||11]>0) beb=row[COL['VentasBebidasMesero']||11];
      if(row[COL['ComidasMesero']||8]>0) iCom=Math.round(row[COL['ComidasMesero']||8]);
      if(row[COL['BebidasMesero']||9]>0) iBeb=Math.round(row[COL['BebidasMesero']||9]);
    });
    // Subtract taxes from total to get net
    if(total>0 && (sumIVA+sumServ)>0) total=Math.round((total-sumIVA-sumServ)*100)/100;

    // Cajeros: no tienen PAX, capturar su data separada
    const salLower = sal.toLowerCase().replace('ñ','n');
    const esCajero = CAJEROS_IDS.includes(salLower);
    if(esCajero){
      // Split into salon (serv>0) vs delivery (serv=0) using sumServ
      // For cajeros, total comes from summing col D (MontoTotal) since col O is empty
      let cajTotal=0, cajSalon=0, cajDelivery=0, cajOrdenes=0;
      srows.forEach(row=>{
        const prod=(row[COL['Producto']||1]||'').toString().trim().toUpperCase();
        if(prod==='PAX') return;
        const monto=row[COL['MontoTotal']||3]||0;
        const serv=row[COL['Servicio']||5]||0;
        if(typeof monto==='number' && monto>0){
          cajTotal+=monto;
          cajOrdenes++;
          if(typeof serv==='number' && serv>0) cajSalon+=monto;
          else cajDelivery+=monto;
        }
      });
      if(cajTotal>0){
        result[sal]={
          esCajero:true,
          total: Math.round(cajTotal*100)/100,
          salon: Math.round(cajSalon*100)/100,
          delivery: Math.round(cajDelivery*100)/100,
          ordenes: cajOrdenes,
          ticketProm: cajOrdenes ? Math.round(cajTotal/cajOrdenes*100)/100 : 0,
          prods: Object.entries(prodMap).sort((a,b)=>b[1].m-a[1].m).slice(0,5).map(([n,{q,m}])=>[n,q,Math.round(m)])
        };
      }
      return;
    }
    if(!pax || !total) return; // skip saloneros sin datos

    const prods=Object.entries(prodMap)
      .sort((a,b)=>b[1].m-a[1].m)
      .slice(0,5)
      .map(([name,{q,m}])=>[name,q,Math.round(m)]);

    result[sal]={
      pax, total, com, beb, iCom, iBeb,
      promPax: pax?total/pax:0,
      promPlato: iCom?com/iCom:0,
      promBebida: iBeb?beb/iBeb:0,
      ratioCB: beb?com/beb:0,
      ratioU: iBeb?iCom/iBeb:0,
      bebPax: pax?iBeb/pax:0,
      prods
    };
  });

  return result;
}

function renderCajeros(el){
  el.innerHTML = '';
  const allDates = getDates();

  if(!allDates.length){
    el.innerHTML = '<div style="padding:40px;text-align:center;color:#555">No hay datos cargados.</div>';
    return;
  }

  // Find cajero names
  const cajeroNames = [];
  Object.values(DIAS).forEach(dia => {
    Object.keys(dia.saloneros||{}).forEach(name => {
      if(isCajero(name) && !cajeroNames.includes(name)) cajeroNames.push(name);
    });
  });

  if(!cajeroNames.length){
    el.innerHTML = '<div style="padding:40px;text-align:center;color:#555">No hay datos de cajeros.</div>';
    return;
  }

  // ── Determine default range: last month of data ──
  const lastDate = allDates[allDates.length-1];
  const lastDateObj = new Date(lastDate + 'T12:00:00');
  const defaultFrom = new Date(lastDateObj.getFullYear(), lastDateObj.getMonth(), 1).toISOString().slice(0,10);
  const defaultTo   = new Date(lastDateObj.getFullYear(), lastDateObj.getMonth()+1, 0).toISOString().slice(0,10);

  // ── Filter bar ──
  const filterBar = document.createElement('div');
  filterBar.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:24px;padding:14px 18px;background:var(--ink);border-radius:2px;';
  filterBar.innerHTML = `
    <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a5040;font-weight:600">Rango</span>
    <input type="date" id="caj-from" value="${defaultFrom}" style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:5px 8px;color:#f0ece4;font-size:11px;">
    <span style="color:#555">→</span>
    <input type="date" id="caj-to" value="${defaultTo}" style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:5px 8px;color:#f0ece4;font-size:11px;">
    <button class="btn-sm" onclick="applyCajeroFilter()">Aplicar</button>
    <button class="btn-sm" onclick="setCajeroPreset('week')">Semana</button>
    <button class="btn-sm" onclick="setCajeroPreset('fortnight')">Quincena</button>
    <button class="btn-sm" onclick="setCajeroPreset('month')">Mes</button>
    <button class="btn-sm" onclick="setCajeroPreset('all')">Todo</button>
  `;
  el.appendChild(filterBar);
  // JS listeners for date inputs — more reliable than onchange attribute
  setTimeout(() => {
    const cf = document.getElementById('caj-from');
    const ct = document.getElementById('caj-to');
    function watchDateInput(inp, fn){
      if(!inp) return;
      let last = inp.value;
      ['change','input','blur'].forEach(e => inp.addEventListener(e, ()=>{ if(inp.value!==last){last=inp.value;fn();} }));
      inp.addEventListener('focus', ()=>{
        const p=setInterval(()=>{ if(document.activeElement!==inp){clearInterval(p);return;} if(inp.value!==last){last=inp.value;fn();} },300);
        setTimeout(()=>clearInterval(p),30000);
      });
    }
    watchDateInput(cf, applyCajeroFilter);
    watchDateInput(ct, applyCajeroFilter);
  }, 50);

  // Container for dynamic content
  const content = document.createElement('div');
  content.id = 'cajero-content';
  el.appendChild(content);

  // Expose filter functions globally
  window.applyCajeroFilter = function(){
    const from = document.getElementById('caj-from')?.value || defaultFrom;
    const to   = document.getElementById('caj-to')?.value   || defaultTo;
    buildCajeroContent(from, to);
  };
  window.setCajeroPreset = function(preset){
    const last = new Date(lastDate + 'T12:00:00');
    let from, to = lastDate;
    if(preset==='week'){
      from = new Date(last); from.setDate(from.getDate()-6);
      from = from.toISOString().slice(0,10);
    } else if(preset==='fortnight'){
      from = new Date(last); from.setDate(from.getDate()-13);
      from = from.toISOString().slice(0,10);

      from = new Date(last.getFullYear(), last.getMonth(), 1).toISOString().slice(0,10);
      to   = new Date(last.getFullYear(), last.getMonth()+1, 0).toISOString().slice(0,10);
    } else {
      from = allDates[0]; to = lastDate;

    document.getElementById('caj-to').value   = to;

      const ordenes=hoy?.ordenes||0, ticket=hoy?.ticketProm||0;

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:${hoy?.prods?.length?'14px':'0'};">
          <div style="background:#111;border-radius:2px;padding:8px 10px;">
            <div style="font-size:7px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:3px">🍱 Delivery</div>
            <div style="font-size:13px;font-weight:700;color:#f0ece4">${needsReupload?'—':fi(delivery)}</div>
            <div style="font-size:9px;color:#555">${(!needsReupload&&total)?((delivery/total)*100).toFixed(0)+'%':'-'}</div>
          </div>
          <div style="background:#111;border-radius:2px;padding:8px 10px;">
            <div style="font-size:7px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:3px">🍽 Salón</div>
            <div style="font-size:13px;font-weight:700;color:#f0ece4">${needsReupload?'—':fi(salon)}</div>
            <div style="font-size:9px;color:#555">${(!needsReupload&&total)?((salon/total)*100).toFixed(0)+'%':'-'}</div>
          </div>
          <div style="background:#111;border-radius:2px;padding:8px 10px;">
            <div style="font-size:7px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:3px">📋 Ticket</div>
            <div style="font-size:13px;font-weight:700;color:#f0ece4">${needsReupload?'—':fi(ticket)}</div>
            <div style="font-size:9px;color:#555">${needsReupload?'—':ordenes+' órd'}</div>
          </div>
        </div>
        ${hoy?.prods?.length?`<div style="font-size:7px;letter-spacing:.2em;text-transform:uppercase;color:#555;margin-bottom:6px">Top productos</div>
        ${hoy.prods.map(([n,q,m])=>`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1a1a1a;">
          <div style="font-size:10px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${n}</div>
          <div style="font-size:10px;color:#f0ece4;font-weight:700;margin-left:8px">${fi(m)}</div>
        </div>`).join('')}`:''}
      `;
      cardsWrap.appendChild(card);
    });

    if(!dates.length){
      cont.innerHTML += '<div style="padding:20px;text-align:center;color:#555;font-size:11px">Sin datos en ese rango</div>';
      return;
    }

    // ── SECCIÓN 2: Totales del período (semana/quincena/mes) ──
    const s2title = document.createElement('div');
    s2title.innerHTML = `<div class="sl" style="margin-bottom:14px">Totales del período · ${fmtDate(fromStr)} → ${fmtDate(toStr)}</div>`;
    cont.appendChild(s2title);

    const periodoWrap = document.createElement('div');
    periodoWrap.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px;';
    cont.appendChild(periodoWrap);

    // Aggregate totals for the range
    let totTotal=0, totDelivery=0, totSalon=0, totOrdenes=0;
    dates.forEach(d => {
      cajeroNames.forEach(name => {
        const s = DIAS[d]?.saloneros?.[name];
        if(!s) return;
        totTotal    += s.total||0;
        totDelivery += s.delivery||0;
        totSalon    += s.salon||0;
        totOrdenes  += s.ordenes||0;
      });
    });
    const ticketProm = totOrdenes ? totTotal/totOrdenes : 0;
    const delPct = totTotal ? (totDelivery/totTotal*100).toFixed(1) : 0;
    const salPct = totTotal ? (totSalon/totTotal*100).toFixed(1) : 0;

    [
      {label:'Total ventas', val:fi(totTotal), sub:dates.length+' días', color:'var(--red)'},
      {label:'🍱 Delivery', val:fi(totDelivery), sub:delPct+'% del total', color:'#f0ece4'},
      {label:'🍽 Salón', val:fi(totSalon), sub:salPct+'% del total', color:'#f0ece4'},
      {label:'📋 Ticket promedio', val:fi(ticketProm), sub:totOrdenes+' órdenes totales', color:'#f0ece4'},
    ].forEach(({label,val,sub,color}) => {
      const kpi = document.createElement('div');
      kpi.style.cssText = 'background:var(--ink);border-radius:2px;padding:16px 18px;border-left:3px solid var(--gold);';
      kpi.innerHTML = `
        <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:6px">${label}</div>
        <div style="font-size:20px;font-weight:800;font-family:'Syne',sans-serif;color:${color}">${val}</div>
        <div style="font-size:9px;color:#555;margin-top:4px">${sub}</div>
      `;
      periodoWrap.appendChild(kpi);
    });

    // ── SECCIÓN 3: Ventas por día de semana ──
    const DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const DAYS_S = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const dowOrder = [1,2,3,4,5,6,0];

    const byDow = {}; // dow → {total, delivery, salon, count}
    dates.forEach(d => {
      const dow = new Date(d+'T12:00:00').getDay();
      if(!byDow[dow]) byDow[dow] = {total:0, delivery:0, salon:0, count:0};
      cajeroNames.forEach(name => {
        const s = DIAS[d]?.saloneros?.[name];
        if(!s) return;
        byDow[dow].total    += s.total||0;
        byDow[dow].delivery += s.delivery||0;
        byDow[dow].salon    += s.salon||0;
        byDow[dow].count++;
      });
    });

    const s3title = document.createElement('div');
    s3title.innerHTML = '<div class="sl" style="margin-bottom:14px">Promedio por día de semana</div>';
    cont.appendChild(s3title);

    const dowWrap = document.createElement('div');
    dowWrap.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:28px;';
    cont.appendChild(dowWrap);

    const activeDows = dowOrder.filter(d => byDow[d]);
    const maxAvg = Math.max(...activeDows.map(d => byDow[d] ? byDow[d].total/byDow[d].count : 0)) || 1;

    dowOrder.forEach(dow => {
      const data = byDow[dow];
      const card = document.createElement('div');
      card.style.cssText = 'background:var(--ink);border-radius:2px;padding:14px 16px;';
      if(!data){
        card.innerHTML = `<div style="font-size:12px;font-weight:700;color:#333;margin-bottom:4px">${DAYS_S[dow]}</div><div style="font-size:9px;color:#2a2a2a">Sin datos</div>`;
      } else {
        const avg = data.total/data.count;
        const pct = (avg/maxAvg*100).toFixed(0);
        const isBest = avg === maxAvg;
        card.style.borderLeft = `3px solid ${isBest?'var(--green)':'var(--gold)'}`;
        const avgDel = data.count ? data.delivery/data.count : 0;
        const avgSal = data.count ? data.salon/data.count : 0;
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div style="font-size:12px;font-weight:800;font-family:'Syne',sans-serif;color:#f0ece4">${DAYS_S[dow]}</div>
            ${isBest?'<div style="font-size:7px;color:var(--green);letter-spacing:.1em">✦ MEJOR</div>':''}
          </div>
          <div style="font-size:14px;font-weight:700;color:${isBest?'var(--green)':'#f0ece4'};margin-bottom:6px">${fi(avg)}</div>
          <div style="height:3px;background:#1a1a1a;border-radius:1px;margin-bottom:8px;">
            <div style="height:100%;width:${pct}%;background:${isBest?'var(--green)':'var(--gold)'};border-radius:1px"></div>
          </div>
          <div style="font-size:9px;color:#555;">🍱 ${fi(avgDel)} · 🍽 ${fi(avgSal)}</div>
          <div style="font-size:9px;color:#444;margin-top:2px">${data.count} ${data.count===1?'día':'días'}</div>
        `;
      }
      dowWrap.appendChild(card);
    });

    // ── SECCIÓN 4: Histórico diario ──
    const s4title = document.createElement('div');
    s4title.innerHTML = '<div class="sl" style="margin-bottom:14px">Detalle por día</div>';
    cont.appendChild(s4title);

    const tblWrap = document.createElement('div');
    tblWrap.className = 'rt-wrap';
    const tbl = document.createElement('table');
    tbl.className = 'rt';
    const headCols = ['Fecha', ...cajeroNames.map(n=>n.toLowerCase().includes('manana')||n.toLowerCase().includes('mañana')?'🌅 Mañana':'🌆 Tarde'), 'Total día'];
    tbl.innerHTML = `<thead><tr>${headCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>`;
    const tbody = document.createElement('tbody');
    [...dates].reverse().forEach(date => {
      const tr = document.createElement('tr');
      let totalDia = 0;
      const cells = cajeroNames.map(name => {
        const s = DIAS[date]?.saloneros?.[name];
        if(!s) return '<td style="color:#333">—</td>';
        totalDia += s.total||0;
        if(!s.esCajero) return `<td><div style="font-weight:700;font-size:12px">${fi(s.total)}</div><div style="font-size:9px;color:#666">resubir para desglose</div></td>`;
        const delPct = s.total?((s.delivery/s.total)*100).toFixed(0):0;
        const salPct = s.total?((s.salon/s.total)*100).toFixed(0):0;
        return `<td><div style="font-weight:700;font-size:12px">${fi(s.total)}</div><div style="font-size:9px;color:#555;margin-top:2px">🍱${delPct}% · 🍽${salPct}%</div></td>`;
      });
      tr.innerHTML = `<td style="font-weight:700">${fmtDate(date)}</td>${cells.join('')}<td style="font-weight:700;color:var(--gold)">${fi(totalDia)}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    tblWrap.appendChild(tbl);
    cont.appendChild(tblWrap);

    // ── SECCIÓN 5: Gráfico evolución ──
    if(dates.length > 1){
      const s5title = document.createElement('div');
      s5title.innerHTML = '<div class="sl" style="margin:24px 0 14px">Evolución ventas totales</div>';
      cont.appendChild(s5title);
      const chartWrap = document.createElement('div');
      chartWrap.style.cssText = 'display:flex;align-items:flex-end;gap:4px;height:80px;overflow-x:auto;';
      const totals = dates.map(d => cajeroNames.reduce((s,n)=>s+(DIAS[d]?.saloneros?.[n]?.total||0),0));
      const maxT = Math.max(...totals)||1;
      dates.forEach((d,i)=>{
        const col = document.createElement('div');
        col.style.cssText = 'min-width:32px;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;';
        const pct = (totals[i]/maxT*100).toFixed(0);
        col.innerHTML = `
          <div style="font-size:7px;color:#555;white-space:nowrap">${fi(totals[i])}</div>
          <div style="width:100%;height:${Math.max(pct,4)}px;background:var(--gold);border-radius:1px 1px 0 0"></div>
          <div style="font-size:7px;color:#666;white-space:nowrap">${fmtDate(d).split(' ').slice(0,2).join(' ')}</div>
        `;
        chartWrap.appendChild(col);
      });
      cont.appendChild(chartWrap);
    }
  }
}

// POR DÍA DE SEMANA
// ═══════════════════════════════════════════════════════════════
function renderSemana(el){
  el.innerHTML = '';
  const DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const DAYS_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  // Group all stored days by day-of-week
  const byDow = {}; // { 0: [{date, saloneros}, ...], 1: [...], ... }
  Object.entries(DIAS).forEach(([date, dia]) => {
    const dow = new Date(date + 'T12:00:00').getDay();
    if(!byDow[dow]) byDow[dow] = [];
    byDow[dow].push({ date, ...dia });
  });

  if(!Object.keys(byDow).length){
    el.innerHTML = '<div style="padding:40px;text-align:center;color:#555">No hay datos suficientes aún.<br>Subí más archivos XLS para ver tendencias por día.</div>';
    return;
  }

  // Header
  const header = document.createElement('div');
  header.className = 'sl-header';
  header.innerHTML = `<div class="sl">Por Día de Semana · ${Object.keys(DIAS).length} días registrados</div>`;
  el.appendChild(header);

  // For each day-of-week that has data, build a summary card
  const dowOrder = [1,2,3,4,5,6,0]; // Mon→Sun
  const cardsWrap = document.createElement('div');
  cardsWrap.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:32px;';
  el.appendChild(cardsWrap);

  dowOrder.forEach(dow => {
    const days = byDow[dow];
    if(!days) return;

    // Aggregate across all occurrences of this weekday
    let totalVentas=0, totalPax=0, totalCom=0, totalBeb=0, totaliBeb=0, totalDays=days.length;
    days.forEach(dia => {
      Object.values(dia.saloneros||{}).forEach(s => {
        totalVentas += s.total||0;
        totalPax    += s.pax||0;
        totalCom    += s.com||0;
        totalBeb    += s.beb||0;
        totaliBeb   += s.iBeb||0;
      });
    });

    const promPax   = totalPax ? totalVentas/totalPax : 0;
    const bebPax    = totalPax ? totaliBeb/totalPax : 0;
    const ratioCB   = totalBeb ? totalCom/totalBeb : 0;
    const promDia   = totalDays ? totalVentas/totalDays : 0;

    const card = document.createElement('div');
    card.style.cssText = 'background:var(--ink);border-radius:2px;padding:20px 22px;position:relative;overflow:hidden;';
    // Gold left border
    card.innerHTML = `<div style="position:absolute;top:0;left:0;width:3px;height:100%;background:var(--gold)"></div>
    <div style="font-size:18px;font-weight:800;font-family:'Syne',sans-serif;color:#f0ece4;margin-bottom:2px">${DAYS[dow]}</div>
    <div style="font-size:9px;letter-spacing:.2em;color:#555;margin-bottom:16px">${totalDays} ${totalDays===1?'día':'días'} registrado${totalDays===1?'':'s'}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;">
      <div>
        <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:3px">Venta promedio/día</div>
        <div style="font-size:16px;font-weight:700;font-family:'Syne',sans-serif;color:var(--red)">${fi(promDia)}</div>
      </div>
      <div>
        <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:3px">PAX promedio/día</div>
        <div style="font-size:16px;font-weight:700;font-family:'Syne',sans-serif;color:#f0ece4">${totalDays?Math.round(totalPax/totalDays):0}</div>
      </div>
      <div>
        <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:3px">Prom/PAX</div>
        <div style="font-size:16px;font-weight:700;font-family:'Syne',sans-serif;color:#f0ece4">${fi(promPax)}</div>
      </div>
      <div>
        <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:3px">Beb/PAX</div>
        <div style="font-size:15px;font-weight:700">${fmtBebPax(bebPax)}</div>
      </div>
      <div>
        <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:3px">Ratio C/B</div>
        <div style="font-size:13px;font-weight:700">${fmtBothRatios(ratioCB,0)}</div>
      </div>
    </div>`;
    cardsWrap.appendChild(card);
  });

  // ── Ranking por salonero × día de semana ──
  const secTitle = document.createElement('div');
  secTitle.innerHTML = '<div class="sl" style="margin-bottom:16px">Rendimiento por salonero × día</div>';
  el.appendChild(secTitle);

  // Build table: rows = saloneros, cols = days of week
  const allSalsInData = new Set();
  Object.values(DIAS).forEach(dia => Object.keys(dia.saloneros||{}).forEach(n => allSalsInData.add(n)));
  const salsArr = [...allSalsInData].filter(n => !isCajero(n)).sort();

  if(!salsArr.length) return;

  // For each salonero × dow, aggregate promPax
  const matrix = {}; // { salName: { dow: {promPax, dias} } }
  salsArr.forEach(sal => {
    matrix[sal] = {};
    dowOrder.forEach(dow => {
      const days = byDow[dow] || [];
      let vt=0, pax=0, cnt=0;
      days.forEach(dia => {
        const s = dia.saloneros?.[sal];
        if(s && s.pax>0){ vt+=s.total; pax+=s.pax; cnt++; }
      });
      if(cnt>0) matrix[sal][dow] = { promPax: vt/pax, dias: cnt, total: vt, pax };
    });
  });

  const activeDows = dowOrder.filter(d => byDow[d]);

  const tbl = document.createElement('table');
  tbl.className = 'rt';
  tbl.innerHTML = `<thead><tr>
    <th>Salonero</th>
    ${activeDows.map(d=>`<th style="text-align:center">${DAYS_SHORT[d]}<br><small style="font-weight:400;opacity:.5">${(byDow[d]||[]).length}×</small></th>`).join('')}
  </tr></thead>`;

  const tbody = document.createElement('tbody');
  salsArr.forEach(sal => {
    const tr = document.createElement('tr');
    const cells = activeDows.map(dow => {
      const cell = matrix[sal][dow];
      if(!cell) return `<td style="text-align:center;color:#333">—</td>`;
      return `<td style="text-align:center">
        <div style="font-size:11px;font-weight:700;color:#f0ece4">${fi(cell.promPax)}</div>
        <div style="font-size:8px;color:#555">${cell.pax} PAX</div>
      </td>`;
    }).join('');
    tr.innerHTML = `<td><div class="td-name">${sal}</div></td>${cells}`;
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  el.appendChild(tbl);

  // ── Mini bar chart: ventas promedio por día ──
  const chartTitle = document.createElement('div');
  chartTitle.innerHTML = '<div class="sl" style="margin:28px 0 16px">Venta promedio por día (todos los saloneros)</div>';
  el.appendChild(chartTitle);

  const chartWrap = document.createElement('div');
  chartWrap.style.cssText = 'display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 4px;';

  const maxPromDia = Math.max(...dowOrder.map(d => {
    if(!byDow[d]) return 0;
    let vt=0, cnt=byDow[d].length;
    byDow[d].forEach(dia => Object.values(dia.saloneros||{}).forEach(s=>vt+=s.total||0));
    return cnt ? vt/cnt : 0;
  }));

  dowOrder.forEach(dow => {
    const days = byDow[dow];
    const col = document.createElement('div');
    col.style.cssText = 'flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;';
    if(!days){
      col.innerHTML = `<div style="flex:1"></div><div style="font-size:8px;color:#333">${DAYS_SHORT[dow]}</div>`;
    } else {
      let vt=0;
      days.forEach(dia => Object.values(dia.saloneros||{}).forEach(s=>vt+=s.total||0));
      const avg = vt / days.length;
      const pct = maxPromDia ? (avg/maxPromDia*100) : 0;
      col.innerHTML = `
        <div style="font-size:8px;color:#888;white-space:nowrap">${fi(avg)}</div>
        <div style="width:100%;height:${Math.max(pct,4).toFixed(0)}px;background:var(--gold);border-radius:1px 1px 0 0;min-height:4px"></div>
        <div style="font-size:9px;color:#aaa;font-weight:600">${DAYS_SHORT[dow]}</div>
      `;
    }
    chartWrap.appendChild(col);
  });
  el.appendChild(chartWrap);
}

function compTab(id, btn){
  document.querySelectorAll('.comp-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.comp-view').forEach(v=>v.classList.remove('active'));
  document.getElementById('cv-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='activas') renderActivas();
  if(id==='nueva') initCompForm();
}

function initCompForm(){
  prodCount=0;
  // Reset edit state

function saveComp(){
  const nombre=document.getElementById('cf-nombre').value.trim();
  const tipo=document.getElementById('cf-tipo').value;
  const inicio=document.getElementById('cf-inicio').value;
  const fin=document.getElementById('cf-fin').value;
  const premio=document.getElementById('cf-premio').value.trim();
  const errEl=document.getElementById('cf-err');

  if(!nombre){errEl.textContent='El nombre es obligatorio.';errEl.style.display='block';return;}
  if(!inicio||!fin){errEl.textContent='Las fechas son obligatorias.';errEl.style.display='block';return;}
  if(fin<inicio){errEl.textContent='La fecha fin debe ser mayor al inicio.';errEl.style.display='block';return;}

  const prods=[];
  for(let i=1;i<=5;i++){
    const inp=document.getElementById('cpinp-'+i);
    const pts=parseInt(document.getElementById('cppts-'+i)?.value)||1;
    if(inp&&inp.value.trim()) prods.push({name:inp.value.trim().toUpperCase(), pts});
  }
  if(!prods.length){errEl.textContent='Agrega al menos un producto.';errEl.style.display='block';return;}

  const parts=[...document.querySelectorAll('#cf-parts input:checked')].map(c=>c.value);
  if(!parts.length){errEl.textContent='Selecciona al menos un salonero.';errEl.style.display='block';return;}

  const editId=document.getElementById('cf-edit-id')?.value;
  const comp={id:editId?parseInt(editId):Date.now(),nombre,tipo,inicio,fin,premio,prods,parts};
  if(editId){
    const idx=COMPS.findIndex(c=>c.id===parseInt(editId));
    if(idx>=0) COMPS[idx]=comp; else COMPS.push(comp);
  } else {
    COMPS.push(comp);
  }
  saveComps();
  errEl.style.display='none';
  // Backfill from existing days
  getDates().forEach(fecha=>{
    if(fecha>=inicio&&fecha<=fin){
      updateCompFromDay(comp, fecha, DIAS[fecha]?.saloneros||{});
    }
  });
  saveComps();
  compTab('activas',document.querySelector('.comp-tab'));
}

function renderActivas(){
  const el=document.getElementById('cv-activas');
  if(!el) return;
  if(!COMPS.length){
    el.innerHTML=emptyState('🏆','Sin competencias activas','Crea una en "+ Nueva"');
    return;
  }
  const today_s=today();
  el.innerHTML='';
  // Sort: En curso primero (más reciente inicio), Próximas (más próximas primero), Finalizadas (más reciente primero)
  const sorted=[...COMPS].sort((a,b)=>{
    const st=c=>today_s>c.fin?2:today_s<c.inicio?1:0;
    const diff=st(a)-st(b);
    if(diff!==0) return diff;
    // Secondary sort by date — within each group, most recent first
    if(st(a)===2) return b.fin.localeCompare(a.fin);   // finalizadas: más reciente primero
    if(st(a)===1) return a.inicio.localeCompare(b.inicio); // próximas: más pronto primero
    return b.inicio.localeCompare(a.inicio); // en curso: más reciente primero
  });
  sorted.forEach(comp=>{
    const card=document.createElement('div');
    card.className='comp-card';
    const totalDias=Math.max(1,daysBetween(comp.inicio,comp.fin));
    const pasados=Math.min(Math.max(daysBetween(comp.inicio,today_s),0),totalDias);
    const pct_prog=(pasados/totalDias*100).toFixed(0);
    const estado=today_s>comp.fin?'Finalizada':today_s<comp.inicio?'Próxima':'En curso';

    const ranking=buildCompRanking(comp);

    card.innerHTML=`
      <div class="comp-head">
        <div>
          <div class="comp-name">${comp.nombre}</div>
          <div style="font-size:9px;color:#555;margin-top:3px">${estado} · ${fmtDate(comp.inicio)} → ${fmtDate(comp.fin)}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="comp-badge badge-${comp.tipo}">${comp.tipo}</span>
          ${comp.premio?`<span style="font-size:10px;color:var(--gold)">🏅 ${comp.premio}</span>`:''}
        </div>
      </div>
      <div class="comp-body">
        <div class="comp-prod-tags">${comp.prods.map(p=>typeof p==='string'?`<span class="prod-tag">📦 ${p} · 1pt</span>`:`<span class="prod-tag">📦 ${p.name} · ${p.pts}pt${p.pts>1?'s':''}</span>`).join('')}</div>
        <div style="font-size:9px;color:var(--muted)">Progreso · día ${pasados} de ${totalDias}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct_prog}%"></div></div>
        <div style="font-size:9px;color:var(--muted);margin-bottom:14px">${pct_prog}% completado</div>
        ${renderCompRankingTable(comp, ranking)}
        <div class="comp-actions">
          <button class="btn-sm" onclick="editComp(${comp.id})">✏️ Editar</button>
          <button class="btn-sm del" onclick="deleteComp(${comp.id})">Eliminar</button>
        </div>
      </div>
    `;
    el.appendChild(card);
  });
}

function buildCompRanking(comp){
  const data={};
  comp.parts.forEach(sal=>{ data[sal]={_total:0,_units:{}}; comp.prods.forEach(p=>{const k=typeof p==='string'?p:p.name; data[sal][k]=0;}); });
  getDates().forEach(fecha=>{
    if(fecha<comp.inicio||fecha>comp.fin) return;
    const sals=DIAS[fecha]?.saloneros||{};
    comp.parts.forEach(sal=>{
      const salData=sals[sal];
      if(!salData) return;
      comp.prods.forEach(p=>{
        const prodName = typeof p==='string' ? p : p.name;
        const prodPts  = typeof p==='string' ? 1 : (p.pts||1);
        const prodRow=(salData.prods||[]).find(([name])=>name===prodName);
        const qty=prodRow?prodRow[1]:0;
        const key = typeof p==='string' ? p : p.name;
        data[sal][key]=(data[sal][key]||0)+qty;
        data[sal]._total+=(qty*prodPts); // weighted by points
        if(!data[sal]._units) data[sal]._units={};
        data[sal]._units[key]=(data[sal]._units[key]||0)+qty;
      });
    });
  });
  return Object.entries(data)
    .map(([sal,d])=>({sal, total:d._total, prods:d, units:d._units||{}}))
    .sort((a,b)=>b.total-a.total);
}

function renderCompRankingTable(comp, ranking){
  const hasData=ranking.some(r=>r.total>0);
  if(!hasData) return `<div class="comp-no-data">Sin ventas registradas aún</div>`;
  const maxU=ranking[0]?.total||1;
  return `
    <table class="rank-table">
      <thead><tr>
        <th>#</th><th>Salonero</th>
        ${comp.prods.map(p=>{const n=typeof p==='string'?p:p.name; const pts=typeof p==='string'?1:p.pts; return `<th>${n.length>12?n.slice(0,11)+'…':n}<br><small style="font-weight:400;opacity:.6">${pts}pt${pts>1?'s':''}</small></th>`}).join('')}
        <th>Total pts</th>
      </tr></thead>
      <tbody>
      ${ranking.map((r,i)=>{
        const pos=i+1;
        const pcls=pos===1?'p1':pos===2?'p2':pos===3?'p3':'';
        return `<tr>
          <td><div class="rank-pos ${pcls}">${pos}</div></td>
          <td><strong>${r.sal}</strong>
            <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:${r.total?((r.total/maxU)*100).toFixed(0):0}%"></div></div>
          </td>
          ${comp.prods.map(p=>{const k=typeof p==='string'?p:p.name; const pts=typeof p==='string'?1:(p.pts||1); const uds=r.units?.[k]||0; return `<td style="text-align:center">${uds||'—'}${uds?`<br><span style="font-size:8px;color:#888">${uds*pts}pts</span>`:''}</td>`}).join('')}
          <td style="font-weight:800;font-size:14px;color:var(--red)">${r.total||'—'}<br><span style="font-size:9px;font-weight:400;color:#888">${Object.values(r.units||{}).reduce((a,b)=>a+b,0)} uds</span></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;
}

function deleteComp(id){
  if(!confirm('¿Eliminar esta competencia?')) return;
  COMPS=COMPS.filter(c=>c.id!==id);
  saveComps();
  renderActivas();
}

function editComp(id){
  const comp=COMPS.find(c=>c.id===id);
  if(!comp) return;
  // Switch to nueva tab
  compTab('nueva', document.querySelectorAll('.comp-tab')[1]);
  // Fill form with existing data
  document.getElementById('cf-edit-id').value = id;
  document.getElementById('cf-form-title').textContent = 'Editar competencia';
  document.getElementById('cf-save-btn').textContent = 'Guardar cambios';
  document.getElementById('cf-nombre').value = comp.nombre||'';
  document.getElementById('cf-tipo').value = comp.tipo||'semanal';
  document.getElementById('cf-inicio').value = comp.inicio||'';
  document.getElementById('cf-fin').value = comp.fin||'';
  document.getElementById('cf-premio').value = comp.premio||'';

  // Re-init prods with existing values
  prodCount=0;
  document.getElementById('cf-prods').innerHTML='';
  const prodsArr = comp.prods||[];
  prodsArr.forEach(p=>{
    const name = typeof p==='string' ? p : p.name;
    const pts  = typeof p==='string' ? 1  : (p.pts||1);
    addCompProd(name, pts);
  });
  if(prodCount===0) addCompProd();

  // Set participants
  document.querySelectorAll('#cf-parts input').forEach(inp=>{
    const checked = comp.parts.includes(inp.value);
    inp.checked = checked;
    inp.closest('.check-item')?.classList.toggle('on', checked);
  });
}

            <div class="comp-prod-tags">${comp.prods.map(p=>{const k=typeof p==='string'?p:p.name; const pts=typeof p==='string'?1:p.pts; const uds=myData?.prods[k]||0; return `<span class="prod-tag">${k}: <strong>${uds} uds</strong> · ${uds*pts}pts</span>`}).join('')}</div>
            <div style="font-size:9px;color:var(--muted);margin-top:8px">Progreso competencia · ${pasados}/${totalDias} días</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${(pasados/totalDias*100).toFixed(0)}%"></div></div>
          </div>
        </div>
        ${renderCompRankingTable(comp, ranking)}
      </div>
    `;
    el.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════════════
// MI SEMANA (vista personal salonero)
// ═══════════════════════════════════════════════════════════════
function renderMiSemana(el){
  el.innerHTML = '';
  const name = CURRENT_USER;
  const DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const DAYS_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const dowOrder = [1,2,3,4,5,6,0];

  // Group this salonero's data by day-of-week
  const byDow = {};
  Object.entries(DIAS).forEach(([date, dia]) => {
    const s = dia.saloneros?.[name];
    if(!s || !s.pax) return;
    const dow = new Date(date + 'T12:00:00').getDay();
    if(!byDow[dow]) byDow[dow] = [];
    byDow[dow].push({ date, ...s });
  });

  const activeDows = dowOrder.filter(d => byDow[d]);

  if(!activeDows.length){
    el.innerHTML = '<div style="padding:40px;text-align:center;color:#555">No hay suficientes días registrados aún.<br>Los patrones por día aparecen con el tiempo.</div>';
    return;
  }

  // Header
  el.innerHTML = `<div class="sl-header"><div class="sl">Mi semana · ${name}</div></div>`;

  // ── Cards por día ──
  const cardsWrap = document.createElement('div');
  cardsWrap.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:28px;';
  el.appendChild(cardsWrap);

  // Find best promPax day for highlighting
  const bestPromPax = Math.max(...activeDows.map(d => {
    const days = byDow[d];
    let vt=0, pax=0;
    days.forEach(s => { vt+=s.total; pax+=s.pax; });
    return pax ? vt/pax : 0;
  }));

  activeDows.forEach(dow => {
    const days = byDow[dow];
    let vt=0, pax=0, beb=0, com=0, iBeb=0, iCom=0;
    days.forEach(s => { vt+=s.total; pax+=s.pax; beb+=s.beb||0; com+=s.com||0; iBeb+=s.iBeb||0; iCom+=s.iCom||0; });
    const promPax  = pax ? vt/pax : 0;
    const bebPax   = pax ? iBeb/pax : 0;
    const ratioCB  = beb ? com/beb : 0;
    const ratioU   = iBeb ? iCom/iBeb : 0;
    const isBest   = Math.abs(promPax - bestPromPax) < 1;
    const borderColor = isBest ? 'var(--green)' : 'var(--gold)';

    const card = document.createElement('div');
    card.style.cssText = `background:var(--ink);border-radius:2px;padding:18px 20px;position:relative;overflow:hidden;`;
    card.innerHTML = `
      <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:${borderColor}"></div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">
        <div style="font-size:17px;font-weight:800;font-family:'Syne',sans-serif;color:#f0ece4">${DAYS[dow]}</div>
        ${isBest ? '<div style="font-size:8px;color:var(--green);letter-spacing:.1em">✦ MEJOR DÍA</div>' : ''}
      </div>
      <div style="font-size:9px;letter-spacing:.2em;color:#555;margin-bottom:14px">${days.length} ${days.length===1?'vez':'veces'}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;">
        <div>
          <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:2px">Prom/PAX</div>
          <div style="font-size:15px;font-weight:700;font-family:'Syne',sans-serif;color:#f0ece4">${fi(promPax)}</div>
        </div>
        <div>
          <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:2px">PAX promedio</div>
          <div style="font-size:15px;font-weight:700;font-family:'Syne',sans-serif;color:#f0ece4">${Math.round(pax/days.length)}</div>
        </div>
        <div>
          <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:2px">Beb/PAX</div>
          <div style="font-size:14px;font-weight:700">${fmtBebPax(bebPax)}</div>
        </div>
        <div>
          <div style="font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#555;margin-bottom:2px">Ratio C/B</div>
          <div style="font-size:12px">${fmtBothRatios(ratioCB, ratioU)}</div>
        </div>
      </div>`;
    cardsWrap.appendChild(card);
  });

  // ── Mini bar chart: Prom/PAX por día ──
  const chartTitle = document.createElement('div');
  chartTitle.innerHTML = '<div class="sl" style="margin-bottom:14px">Mi Prom/PAX por día</div>';
  el.appendChild(chartTitle);

  const chartWrap = document.createElement('div');
  chartWrap.style.cssText = 'display:flex;align-items:flex-end;gap:8px;height:100px;padding:0 4px;margin-bottom:28px;';

  dowOrder.forEach(dow => {
    const days = byDow[dow];
    const col = document.createElement('div');
    col.style.cssText = 'flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;';
    if(!days){
      col.innerHTML = `<div style="flex:1"></div><div style="font-size:9px;color:#333">${DAYS_SHORT[dow]}</div>`;
    } else {
      let vt=0, pax=0;
      days.forEach(s => { vt+=s.total; pax+=s.pax; });
      const avg = pax ? vt/pax : 0;
      const pct = bestPromPax ? (avg/bestPromPax*100) : 0;
      const isB = Math.abs(avg-bestPromPax)<1;
      col.innerHTML = `
        <div style="font-size:8px;color:#888;white-space:nowrap">${fi(avg)}</div>
        <div style="width:100%;height:${Math.max(pct,4).toFixed(0)}px;background:${isB?'var(--green)':'var(--gold)'};border-radius:1px 1px 0 0"></div>
        <div style="font-size:9px;color:#aaa;font-weight:600">${DAYS_SHORT[dow]}</div>
      `;
    }
    chartWrap.appendChild(col);
  });
  el.appendChild(chartWrap);

  // ── Comparativa: este salonero vs general por día ──
  const compTitle = document.createElement('div');
  compTitle.innerHTML = '<div class="sl" style="margin-bottom:14px">Vs promedio del restaurante</div>';
  el.appendChild(compTitle);

  const compTbl = document.createElement('table');
  compTbl.className = 'rt';
  compTbl.innerHTML = `<thead><tr>
    <th>Día</th><th>Mi Prom/PAX</th><th>Resto del restaurante</th><th>Diferencia</th><th>Días trabajados</th>
  </tr></thead>`;
  const compBody = document.createElement('tbody');

  activeDows.forEach(dow => {
    const myDays = byDow[dow];
    let myVt=0, myPax=0;
    myDays.forEach(s=>{ myVt+=s.total; myPax+=s.pax; });
    const myProm = myPax ? myVt/myPax : 0;

    // General for same days (all saloneros except this one)
    let genVt=0, genPax=0;
    (byDow[dow]||[]).forEach(dayEntry => {
      // byDow[dow] has this salonero's records, need to get gen from DIAS
    });
    // Get general from DIAS for those dates
    const datesForDow = Object.keys(DIAS).filter(date => new Date(date+'T12:00:00').getDay()===dow);
    datesForDow.forEach(date => {
      Object.values(DIAS[date]?.saloneros||{}).forEach(s => {
        genVt += s.total||0; genPax += s.pax||0;
      });
    });
    const genProm = genPax ? genVt/genPax : 0;
    const diff = myProm - genProm;
    const above = diff >= 0;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-weight:700">${DAYS[dow]}</td>
      <td style="font-weight:700">${fi(myProm)}</td>
      <td>${fi(genProm)}</td>
      <td><span class="badge badge-${above?'up':'down'}">${above?'▲':'▼'} ${fi(Math.abs(diff))}</span></td>
      <td style="color:#555">${myDays.length}</td>
    `;
    compBody.appendChild(tr);
  });
  compTbl.appendChild(compBody);
  el.appendChild(compTbl);
}


// ═══════════════════════════════════════════════════════════════
// EVALUACIÓN DE SALONEROS + METAS
// ═══════════════════════════════════════════════════════════════
function renderEvaluacion(el){
  el.innerHTML = '';
  const allDates = getDates();
  if(!allDates.length){
    el.innerHTML = '<div style="padding:40px;text-align:center;color:#555">No hay datos cargados.</div>';
    return;
  }

  // Default range: last full month
  const lastDate = allDates[allDates.length-1];
  const lastObj  = new Date(lastDate+'T12:00:00');
  const defFrom  = new Date(lastObj.getFullYear(), lastObj.getMonth(), 1).toISOString().slice(0,10);
  const defTo    = new Date(lastObj.getFullYear(), lastObj.getMonth()+1, 0).toISOString().slice(0,10);
  const monthKey = lastDate.slice(0,7); // YYYY-MM

  // ── SECCIÓN 1: Metas ──
  const metaRestaurante = METAS.restaurante?.[monthKey] || 0;
  const metaSaloneros   = METAS.saloneros || {};

  const metaSection = document.createElement('div');
  metaSection.style.cssText = 'background:var(--ink);border-radius:2px;padding:20px 24px;margin-bottom:24px;border-left:3px solid var(--gold);';
  metaSection.innerHTML = `
    <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:16px">🎯 Metas del período</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;">
      <div>
        <div style="font-size:9px;color:#888;margin-bottom:6px">Meta mensual restaurante · ${monthKey}</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="meta-rest-inp" type="number" placeholder="Meta en ₡ (ej: 15000000)"
            value="${metaRestaurante||''}"
            style="flex:1;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:7px 10px;color:#f0ece4;font-family:'DM Mono',monospace;font-size:11px;outline:none;">
          <button class="btn-sm" onclick="saveMetaRestaurante('${monthKey}')">Guardar</button>
        </div>
      </div>
    </div>
    <div style="margin-top:14px;">
      <div style="font-size:9px;color:#888;margin-bottom:8px">Metas individuales Prom/PAX por salonero</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;" id="metas-sal-grid">
        ${ALL_SALS.map(name => `
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-size:10px;color:#aaa;min-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span>
            <input type="number" id="meta-sal-${name.replace(/\s/g,'_')}" placeholder="₡ meta/PAX"
              value="${metaSaloneros[name]||''}"
              style="flex:1;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:5px 8px;color:#f0ece4;font-family:'DM Mono',monospace;font-size:10px;outline:none;">
          </div>`).join('')}
      </div>
      <button class="btn-sm" style="margin-top:10px" onclick="saveMetasSaloneros()">Guardar metas individuales</button>
    </div>
  `;
  el.appendChild(metaSection);

  // ── Progress bar meta restaurante ──
  if(metaRestaurante > 0){
    const datesInMonth = allDates.filter(d => d.startsWith(monthKey));
    let ventasMes = 0;
    datesInMonth.forEach(d => {
      const gen = aggGeneral([d]);
      ventasMes += gen.totalRest || gen.total;
    });
    const pctMeta = Math.min((ventasMes/metaRestaurante)*100, 100);
    // Dias del mes y proyección
    const daysInMonth = new Date(lastObj.getFullYear(), lastObj.getMonth()+1, 0).getDate();
    const daysPassed  = datesInMonth.length;
    const projected   = daysPassed ? (ventasMes/daysPassed)*daysInMonth : 0;
    const pctProj     = Math.min((projected/metaRestaurante)*100, 100);
    const onTrack     = projected >= metaRestaurante;

    const progSection = document.createElement('div');
    progSection.style.cssText = 'background:var(--ink);border-radius:2px;padding:20px 24px;margin-bottom:24px;';
    progSection.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
        <div>
          <div style="font-size:14px;font-weight:800;font-family:'Syne',sans-serif;color:#f0ece4">Progreso meta mensual</div>
          <div style="font-size:9px;color:#555;margin-top:2px">${monthKey} · ${daysPassed} de ${daysInMonth} días con datos</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:800;font-family:'Syne',sans-serif;color:var(--red)">${fi(ventasMes)}</div>
          <div style="font-size:9px;color:#555">de ${fi(metaRestaurante)} meta</div>
        </div>
      </div>
      <div style="height:8px;background:#1a1a1a;border-radius:4px;margin-bottom:8px;overflow:hidden;">
        <div style="height:100%;width:${pctMeta.toFixed(1)}%;background:${pctMeta>=100?'var(--green)':pctMeta>=70?'var(--gold)':'var(--red)'};border-radius:4px;transition:width .5s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;">
        <span style="color:#888">${pctMeta.toFixed(1)}% completado</span>
        <span style="color:${onTrack?'var(--green)':'var(--red)'}">
          ${onTrack?'✓ En camino':'⚠ Por debajo'} · Proyección: ${fi(projected)} (${pctProj.toFixed(0)}%)
        </span>
      </div>
      <div style="margin-top:12px;font-size:10px;color:#666;">
        Meta diaria implícita: <strong style="color:#f0ece4">${fi(metaRestaurante/daysInMonth)}</strong> ·
        Promedio actual/día: <strong style="color:${(ventasMes/Math.max(daysPassed,1)) >= (metaRestaurante/daysInMonth)?'var(--green)':'var(--red)'}">${fi(ventasMes/Math.max(daysPassed,1))}</strong>
      </div>
    `;
    el.appendChild(progSection);
  }

  // ── SECCIÓN 2: Filtro de rango ──
  const filterBar = document.createElement('div');
  filterBar.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px;';
  filterBar.innerHTML = `
    <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a5040;font-weight:600">Período de evaluación</span>
    <input type="date" id="eval-from" value="${defFrom}" style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:5px 8px;color:#f0ece4;font-size:11px;">
    <span style="color:#555">→</span>
    <input type="date" id="eval-to" value="${defTo}" style="background:#0a0a0a;border:1px solid #2a2a2a;border-radius:2px;padding:5px 8px;color:#f0ece4;font-size:11px;">
    <button class="btn-sm" onclick="applyEvalFilter()">Aplicar</button>
    <button class="btn-sm" onclick="setEvalPreset('month')">Este mes</button>
    <button class="btn-sm" onclick="setEvalPreset('week')">Última semana</button>
    <button class="btn-sm" onclick="setEvalPreset('all')">Todo</button>
  `;
  el.appendChild(filterBar);

  const evalContent = document.createElement('div');
  evalContent.id = 'eval-content';
  el.appendChild(evalContent);
  // JS listeners for eval date inputs
  setTimeout(() => {
    const ef = document.getElementById('eval-from');
    const et = document.getElementById('eval-to');
    function watchEvalInput(inp, fn){
      if(!inp) return;
      let last = inp.value;
      ['change','input','blur'].forEach(e => inp.addEventListener(e, ()=>{ if(inp.value!==last){last=inp.value;fn();} }));
      inp.addEventListener('focus', ()=>{
        const p=setInterval(()=>{ if(document.activeElement!==inp){clearInterval(p);return;} if(inp.value!==last){last=inp.value;fn();} },300);
        setTimeout(()=>clearInterval(p),30000);
      });
    }
    watchEvalInput(ef, applyEvalFilter);
    watchEvalInput(et, applyEvalFilter);
  }, 50);

  window.saveMetaRestaurante = function(mk){
    const val = parseFloat(document.getElementById('meta-rest-inp')?.value) || 0;
    if(!METAS.restaurante) METAS.restaurante = {};
    METAS.restaurante[mk] = val;
    saveMetas();
    renderEvaluacion(el);
  };
  window.saveMetasSaloneros = function(){
    if(!METAS.saloneros) METAS.saloneros = {};
    ALL_SALS.forEach(name => {
      const inp = document.getElementById('meta-sal-'+name.replace(/\s/g,'_'));
      if(inp) METAS.saloneros[name] = parseFloat(inp.value)||0;
    });
    saveMetas();
    renderEvaluacion(el);
  };
  window.applyEvalFilter = function(){
    const from = document.getElementById('eval-from')?.value || defFrom;
    const to   = document.getElementById('eval-to')?.value   || defTo;
    buildEvalContent(from, to);
  };
  window.setEvalPreset = function(preset){
    const last = new Date(lastDate+'T12:00:00');
    let from, to = lastDate;
    if(preset==='month'){
      from = defFrom; to = defTo;
    } else if(preset==='week'){
      const d = new Date(last); d.setDate(d.getDate()-6);
      from = d.toISOString().slice(0,10);
    } else {
      from = allDates[0]; to = lastDate;
    }
    document.getElementById('eval-from').value = from;
    document.getElementById('eval-to').value   = to;
    buildEvalContent(from, to);
  };

  buildEvalContent(defFrom, defTo);

  function buildEvalContent(fromStr, toStr){
    const cont = document.getElementById('eval-content');
    if(!cont) return;
    cont.innerHTML = '';
    const dates = allDates.filter(d => d >= fromStr && d <= toStr);
    if(!dates.length){
      cont.innerHTML = '<div style="padding:20px;text-align:center;color:#555">Sin datos en ese rango.</div>';
      return;
    }

    // ── Calcular métricas por salonero ──
    const evalData = ALL_SALS.map(name => {
      const diasConDatos = dates.filter(d => DIAS[d]?.saloneros?.[name]?.pax > 0);
      if(!diasConDatos.length) return null;

      // Acumulados
      let totVentas=0, totPax=0, totBeb=0, totiBeb=0;
      diasConDatos.forEach(d => {
        const s = DIAS[d].saloneros[name];
        totVentas += s.total||0; totPax += s.pax||0;
        totBeb += s.beb||0; totiBeb += s.iBeb||0;
      });
      const promPaxAcum = totPax ? totVentas/totPax : 0;
      const bebPaxAcum  = totPax ? totiBeb/totPax : 0;

      // Promedio general del restaurante en esos mismos días
      let genVt=0, genPax=0;
      diasConDatos.forEach(d => {
        Object.values(DIAS[d]?.saloneros||{}).forEach(s => {
          if(!s.esCajero){ genVt+=s.total||0; genPax+=s.pax||0; }
        });
      });
      const genProm = genPax ? genVt/genPax : 0;

      // Consistencia: % días sobre el promedio general de ese día
      let diasSobre=0;
      diasConDatos.forEach(d => {
        const s = DIAS[d].saloneros[name];
        const sProm = s.pax ? s.total/s.pax : 0;
        let dayGenVt=0, dayGenPax=0;
        Object.values(DIAS[d]?.saloneros||{}).forEach(x => {
          if(!x.esCajero){ dayGenVt+=x.total||0; dayGenPax+=x.pax||0; }
        });
        const dayGen = dayGenPax ? dayGenVt/dayGenPax : 0;
        if(sProm >= dayGen) diasSobre++;
      });
      const consistencia = diasConDatos.length ? (diasSobre/diasConDatos.length*100) : 0;

      // Tendencia: comparar primera mitad vs segunda mitad del período
      const mid = Math.floor(diasConDatos.length/2);
      let firstVt=0,firstPax=0,lastVt=0,lastPax=0;
      diasConDatos.slice(0,mid).forEach(d=>{const s=DIAS[d].saloneros[name];firstVt+=s.total||0;firstPax+=s.pax||0;});
      diasConDatos.slice(mid).forEach(d=>{const s=DIAS[d].saloneros[name];lastVt+=s.total||0;lastPax+=s.pax||0;});
      const firstProm = firstPax?firstVt/firstPax:0;
      const lastProm  = lastPax?lastVt/lastPax:0;
      const tendencia = firstProm ? ((lastProm-firstProm)/firstProm*100) : 0;

      // Meta individual
      const metaInd = METAS.saloneros?.[name] || 0;
      const vsMetaInd = metaInd ? ((promPaxAcum-metaInd)/metaInd*100) : null;

      return {
        name, diasConDatos: diasConDatos.length, promPaxAcum, bebPaxAcum,
        genProm, consistencia, tendencia, metaInd, vsMetaInd,
        vsGeneral: genProm ? ((promPaxAcum-genProm)/genProm*100) : 0
      };
    }).filter(Boolean).sort((a,b) => b.promPaxAcum - a.promPaxAcum);

    if(!evalData.length){
      cont.innerHTML = '<div style="padding:20px;text-align:center;color:#555">Sin datos de saloneros en ese rango.</div>';
      return;
    }

    // ── Tabla de evaluación ──
    const tblTitle = document.createElement('div');
    tblTitle.innerHTML = `<div class="sl" style="margin-bottom:14px">Evaluación · ${fmtDate(fromStr)} → ${fmtDate(toStr)}</div>`;
    cont.appendChild(tblTitle);

    const tblWrap = document.createElement('div');
    tblWrap.className = 'rt-wrap';
    const tbl = document.createElement('table');
    tbl.className = 'rt';
    tbl.innerHTML = `<thead><tr>
      <th>#</th><th>Salonero</th><th>Días</th>
      <th>Prom/PAX</th><th>vs General</th><th>vs Meta</th>
      <th>Beb/PAX</th><th>Consistencia</th><th>Tendencia</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');

    evalData.forEach((d,i) => {
      const tr = document.createElement('tr');
      const pos = i+1;

      // vs General
      const vsGenCls = d.vsGeneral>=0?'var(--green)':'var(--red)';
      const vsGenStr = `<span style="color:${vsGenCls};font-size:10px">${d.vsGeneral>=0?'▲':'▼'} ${Math.abs(d.vsGeneral).toFixed(1)}%</span>`;

      // vs Meta individual
      let vsMetaStr = '<span style="color:#555;font-size:10px">—</span>';
      if(d.vsMetaInd !== null){
        const cls = d.vsMetaInd>=0?'var(--green)':'var(--red)';
        vsMetaStr = `<div style="font-size:10px;color:${cls}">${d.vsMetaInd>=0?'▲':'▼'} ${Math.abs(d.vsMetaInd).toFixed(1)}%</div>
          <div style="font-size:9px;color:#555">meta ${fi(d.metaInd)}</div>`;
      } else if(d.metaInd===0){
        vsMetaStr = '<span style="font-size:9px;color:#444">sin meta</span>';
      }

      // Consistencia semáforo
      const consCls = d.consistencia>=70?'var(--green)':d.consistencia>=40?'#c8a030':'var(--red)';
      const consStr = `<div style="color:${consCls};font-weight:700">${d.consistencia.toFixed(0)}%</div>
        <div style="font-size:8px;color:#555">${Math.round(d.consistencia/100*d.diasConDatos)} de ${d.diasConDatos} días</div>`;

      // Tendencia flecha
      const tendCls = d.tendencia>2?'var(--green)':d.tendencia<-2?'var(--red)':'#888';
      const tendIcon = d.tendencia>2?'↗':d.tendencia<-2?'↘':'→';
      const tendStr = d.diasConDatos>=4
        ? `<span style="color:${tendCls};font-size:16px">${tendIcon}</span><span style="font-size:9px;color:${tendCls}"> ${d.tendencia>0?'+':''}${d.tendencia.toFixed(1)}%</span>`
        : '<span style="font-size:9px;color:#444">pocos datos</span>';

      tr.innerHTML = `
        <td><div class="rank-pos ${pos<4?'p'+pos:''}">${pos}</div></td>
        <td><div class="td-name">${d.name}</div></td>
        <td style="color:#888;font-size:11px">${d.diasConDatos}</td>
        <td style="font-weight:700">${fi(d.promPaxAcum)}</td>
        <td>${vsGenStr}<div style="font-size:8px;color:#555">gen: ${fi(d.genProm)}</div></td>
        <td>${vsMetaStr}</td>
        <td>${fmtBebPax(d.bebPaxAcum)}</td>
        <td>${consStr}</td>
        <td>${tendStr}</td>
      `;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    tblWrap.appendChild(tbl);
    cont.appendChild(tblWrap);

    // ── Tarjetas individuales con metas ──
    if(evalData.some(d => d.metaInd > 0)){
      const mTitle = document.createElement('div');
      mTitle.innerHTML = '<div class="sl" style="margin:24px 0 14px">Progreso metas individuales</div>';
      cont.appendChild(mTitle);

      const mGrid = document.createElement('div');
      mGrid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;';
      cont.appendChild(mGrid);

      evalData.filter(d=>d.metaInd>0).forEach(d => {
        const pct = Math.min((d.promPaxAcum/d.metaInd)*100,100);
        const color = pct>=100?'var(--green)':pct>=80?'var(--gold)':'var(--red)';
        const card = document.createElement('div');
        card.style.cssText = 'background:var(--ink);border-radius:2px;padding:16px 18px;';
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
            <div style="font-weight:700;color:#f0ece4">${d.name}</div>
            <div style="font-size:12px;font-weight:700;color:${color}">${pct.toFixed(0)}%</div>
          </div>
          <div style="height:5px;background:#1a1a1a;border-radius:3px;margin-bottom:8px;overflow:hidden;">
            <div style="height:100%;width:${pct.toFixed(1)}%;background:${color};border-radius:3px;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:9px;color:#555;">
            <span>Actual: <strong style="color:#f0ece4">${fi(d.promPaxAcum)}</strong></span>
            <span>Meta: <strong style="color:#f0ece4">${fi(d.metaInd)}</strong></span>
          </div>
        `;
        mGrid.appendChild(card);
      });
    }
  }
}
