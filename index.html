<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satori · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0d0d; --paper:#f5f0e8; --red:#c23b22; --gold:#c8a96e;
  --muted:#8a8070; --panel:#ede8de; --border:#d4cfc4;
  --green:#4a7c59; --blue:#2a4a6b; --purple:#7a5c8a;
  --gold-dim:#c8a96e30;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'DM Mono',monospace;min-height:100vh;}

/* ── SCREENS ── */
.screen{display:none !important;}
.screen.active{display:block !important;}
#screen-login.active{display:flex !important;}

/* ── LOGIN ── */
#screen-login{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 20px;
  background:var(--ink);
}
.login-logo{font-family:'Shippori Mincho',serif;font-size:41px;font-weight:700;
  color:var(--gold);letter-spacing:.18em;margin-bottom:6px;}
.login-sub{font-size:9px;letter-spacing:.45em;color:#555;margin-bottom:56px;text-transform:uppercase;}
.login-box{background:#111;border:1px solid #2a2a2a;padding:36px;border-radius:3px;width:100%;max-width:440px;}
.login-label{font-size:8px;letter-spacing:.35em;text-transform:uppercase;color:#666;margin-bottom:12px;}
.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.login-btn{
  background:#1a1a1a;border:1px solid #2a2a2a;padding:16px;
  font-family:'DM Mono',monospace;font-size:11px;color:#aaa;
  cursor:pointer;border-radius:2px;transition:all .15s;text-align:left;letter-spacing:.05em;
}
.login-btn:hover{border-color:var(--gold);color:var(--gold);}
.login-btn.manager{background:#1a1208;border-color:#c8a96e40;color:var(--gold);}
.login-btn.owner{background:#0a0a18;border-color:#3a3a6e;color:#8888cc;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;}
.pin-btn{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:2px;color:#f0ece4;
  font-size:17px;font-family:Syne,sans-serif;font-weight:700;padding:14px;cursor:pointer;
  transition:all .15s;}
.pin-btn:hover{background:#2a2a2a;border-color:#c8a96e;}
.pin-btn:active{background:#c8a96e22;border-color:var(--gold);}
.pin-display{display:flex;gap:10px;justify-content:center;margin-bottom:16px;}
.pin-dot{width:12px;height:12px;border-radius:50%;border:2px solid #444;transition:all .2s;}
.pin-dot.filled{background:var(--gold);border-color:var(--gold);}
.pin-dot.error{background:var(--red);border-color:var(--red);}
.pin-error{color:var(--red);font-size:9px;text-align:center;margin-top:8px;min-height:16px;}
.login-btn.manager:hover{background:#1e1608;border-color:var(--gold);}
.login-divider{
  font-size:7px;letter-spacing:.4em;color:#333;text-align:center;
  padding:14px 0;text-transform:uppercase;
}

/* ── LOGIN SEARCH ── */
.login-search-wrap{position:relative;margin-bottom:4px;}
.login-search-input{
  width:100%;padding:13px 16px;background:#1a1a1a;border:1px solid #333;
  border-radius:2px;font-family:'DM Mono',monospace;font-size:13px;
  color:#f0ece4;outline:none;letter-spacing:.03em;transition:border .15s;
}
.login-search-input::placeholder{color:#444;}
.login-search-input:focus{border-color:var(--gold);}
.login-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:300;
  background:#111;border:1px solid #2a2a2a;border-radius:2px;
  max-height:360px;overflow-y:auto;box-shadow:0 8px 32px #0008;
  scrollbar-width:thin;scrollbar-color:#333 #111;
}
.login-dropdown-section{
  font-size:7px;letter-spacing:.3em;text-transform:uppercase;
  color:#333;padding:10px 14px 5px;font-weight:700;
}
.login-dropdown-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;cursor:pointer;transition:background .1s;
  border-bottom:1px solid #1a1a1a;
}
.login-dropdown-item:last-child{border-bottom:none;}
.login-dropdown-item:hover{background:#1e1e1e;}
.login-dropdown-item.privileged:hover{background:#1a1208;}
.login-item-avatar{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;
  font-family:'Syne',sans-serif;
}
.login-item-avatar.emp{background:#1a1a1a;color:#666;border:1px solid #2a2a2a;}
.login-item-avatar.mgr{background:#1a1208;color:var(--gold);border:1px solid #c8a96e40;}
.login-item-avatar.own{background:#0a0a18;color:#8888cc;border:1px solid #3a3a6e;}
.login-item-avatar.cnt{background:#0a1a18;color:#5a9a8a;border:1px solid #2a5a4a;}
.login-item-name{font-size:11px;font-weight:600;color:#f0ece4;letter-spacing:.03em;}
.login-item-sub{font-size:8px;color:#444;letter-spacing:.05em;text-transform:uppercase;margin-top:1px;}
.login-item-lock{margin-left:auto;font-size:11px;color:#333;}

/* ── APP SHELL ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;height:56px;border-bottom:1px solid var(--border);
  background:var(--ink);position:sticky;top:0;z-index:200;
}
.logo{font-family:'Shippori Mincho',serif;font-size:19px;font-weight:700;
  letter-spacing:.15em;color:var(--gold);display:flex;align-items:center;gap:10px;}
.logo-mode{
  font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.3em;
  text-transform:uppercase;color:#555;padding:3px 9px;border:1px solid #2a2a2a;border-radius:1px;
}
.logo-mode.sal{color:var(--gold);border-color:var(--gold-dim);}
.logo-mode.own{color:#8888cc;border-color:#3a3a6e;}
.logo-mode.cnt{color:#5a9a8a;border-color:#2a5a4a40;}
.header-right{display:flex;align-items:center;gap:14px;}
.header-user{font-size:10px;color:var(--gold);}
.btn-exit{
  background:none;border:1px solid #333;padding:6px 14px;
  font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.2em;
  text-transform:uppercase;color:#666;cursor:pointer;border-radius:1px;transition:all .15s;
}
.btn-exit:hover{border-color:var(--red);color:var(--red);}

/* ── NAV — SINGLE BAR ────────────────────────────────────────────────────── */
.nav-primary{
  display:flex;align-items:stretch;
  padding:0 24px;background:var(--ink);
  border-bottom:2px solid #1a1a1a;
  overflow-x:auto;gap:0;scrollbar-width:none;min-height:46px;
}
.nav-primary::-webkit-scrollbar{display:none;}

/* Group label — visual separator, not clickable */
.nav-group-label{
  display:flex;align-items:center;
  padding:0 10px 0 14px;
  font-size:6px;letter-spacing:.35em;text-transform:uppercase;
  font-weight:700;white-space:nowrap;cursor:default;flex-shrink:0;
}
.nav-group-label.mod-ops  {color:#6a5530;}
.nav-group-label.mod-fin  {color:#7a6520;}
.nav-group-label.mod-team {color:#3a6a40;}
.nav-group-label.mod-admin{color:#4a4a7a;}

/* Thin vertical separator between groups */
.nav-group-sep{
  width:1px;background:#1e1e1e;
  margin:10px 6px;align-self:stretch;flex-shrink:0;
}

/* Tab items — on dark background */
.ntab{
  padding:0 14px;cursor:pointer;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;border-bottom:2px solid transparent;
  color:#666;transition:color .15s,border-color .15s;
  white-space:nowrap;font-weight:600;flex-shrink:0;
  display:flex;align-items:center;
}
.ntab:hover{color:#aaa;}

/* Ops tabs */
.ntab.mod-ops:hover{color:#c8a050;}
.ntab.mod-ops.active{color:#c8a050;border-bottom-color:#c8a050;font-weight:700;}

/* Fin tabs — gold */
.ntab.mod-fin:hover{color:var(--gold);}
.ntab.mod-fin.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:700;}

/* Team tabs — green */
.ntab.mod-team:hover{color:#6a9a6a;}
.ntab.mod-team.active{color:#6a9a6a;border-bottom-color:#6a9a6a;font-weight:700;}

/* Admin tab */
.ntab.mod-admin:hover{color:#8a8aaa;}
.ntab.mod-admin.active{color:#8a8aaa;border-bottom-color:#8a8aaa;font-weight:700;}

/* Secondary nav — hidden, no longer used */
.nav{display:none !important;}

/* ── MAIN ── */
.main{padding:32px 40px;max-width:1440px;margin:0 auto;}
.view{display:none;}
.view.active{display:block;animation:fadeUp .25s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── SECTION LABEL ── */
.sl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:#4a4030;margin-bottom:20px;display:flex;align-items:center;gap:12px;font-weight:700;}
.sl::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── DATE RANGE BAR ── */
.range-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:28px;padding:14px 18px;
  background:var(--panel);border:1px solid var(--border);border-radius:2px;
}
.range-bar label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6a6050;font-weight:500;}
.range-input{
  border:1px solid var(--border);padding:7px 11px;
  font-family:'DM Mono',monospace;font-size:10px;background:#fff;
  border-radius:1px;outline:none;color:var(--ink);
}
.range-input:focus{border-color:var(--gold);}
.range-preset{
  background:none;border:1px solid var(--border);padding:7px 14px;
  font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.15em;
  text-transform:uppercase;cursor:pointer;border-radius:1px;color:var(--muted);transition:all .15s;
}
.range-preset:hover,.range-preset.active{border-color:var(--gold);color:var(--gold);}
.range-sep{color:var(--border);font-size:17px;}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:36px;}
.kpi{background:var(--ink);padding:18px 16px;border-radius:2px;position:relative;overflow:hidden;min-width:0;}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--gold);}
.kpi.red::before{background:var(--red);}
.kpi.green::before{background:var(--green);}
.kpi.blue::before{background:var(--blue);}
.kpi-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#999;margin-bottom:8px;font-weight:600;}
.kpi-val{font-family:Syne,sans-serif;font-size:25px;font-weight:800;color:#f0ece4;line-height:1;white-space:nowrap;display:inline-block;transform-origin:left center;}
.kpi-delta{font-size:10px;margin-top:6px;}
.kpi-delta.up{color:var(--green);}
.kpi-delta.down{color:var(--red);}
.kpi-delta.flat{color:#555;}
.kpi-sub{font-size:10px;color:#888;margin-top:4px;}

/* ── CRYPTO CHART ── */
.chart-wrap{
  background:var(--ink);border:1px solid var(--border);border-radius:2px;
  padding:24px;margin-bottom:32px;position:relative;
}
.chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.chart-title{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:700;color:var(--text);}
.chart-meta{text-align:right;}
.chart-current{font-family:Syne,sans-serif;font-size:27px;font-weight:800;color:var(--gold);}
.chart-pct{font-size:11px;padding:3px 10px;border-radius:2px;font-weight:700;margin-top:4px;display:inline-block;}
.chart-pct.up{background:rgba(74,140,74,.15);color:var(--green);}
.chart-pct.down{background:rgba(194,59,34,.15);color:var(--red);}
.chart-pct.flat{background:rgba(255,255,255,.06);color:var(--muted);}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:9px;cursor:pointer;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:50%;}
#chart-canvas{width:100%;height:220px;display:block;}

/* ── TABLES ── */
.rt{width:100%;border-collapse:collapse;font-size:12px;}
.rt thead tr{background:var(--ink);color:#f0ece4;}
.rt thead th{padding:11px 16px;text-align:left;font-size:8px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:#aaa;}
.rt thead th.sortable{cursor:pointer;user-select:none;}
.rt thead th.sortable:hover{color:var(--gold);}
.rt thead th.sort-active{color:var(--gold);}
.sort-arrow{margin-left:4px;opacity:.5;font-size:8px;}
.rt thead th.sort-active .sort-arrow{opacity:1;color:var(--gold);}
.rt tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
.rt tbody tr:hover{background:var(--panel);}
.rt td{padding:12px 16px;vertical-align:middle;font-size:12px;}
.rt td.num{font-family:Syne,sans-serif;font-weight:800;}
.rank-pos{font-family:Syne,sans-serif;font-size:21px;font-weight:800;color:var(--border);}
.rank-pos.p1{color:#c8a96e;}.rank-pos.p2{color:#999;}.rank-pos.p3{color:#cd7f32;}
.bar-mini{height:5px;background:var(--red);border-radius:1px;margin-top:4px;}
.td-name{font-family:'Shippori Mincho',serif;font-size:14px;font-weight:700;}
.td-sub{font-size:8px;color:var(--muted);margin-top:2px;}
.badge{font-size:7px;letter-spacing:.2em;text-transform:uppercase;
  padding:3px 8px;border-radius:1px;font-weight:700;}
.badge-up{background:#e8f3ec;color:var(--green);}
.badge-down{background:#fdf0ee;color:var(--red);}

/* ── CARDS GRID ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;}
.card{background:#fff;border:1px solid var(--border);border-radius:2px;overflow:hidden;}
.card-head{background:var(--ink);padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;}
.card-name{font-family:'Shippori Mincho',serif;font-size:18px;color:#f0ece4;font-weight:600;}
.card-total{font-family:Syne,sans-serif;font-size:19px;font-weight:800;color:var(--gold);text-align:right;}
.card-body{padding:16px 20px;}
.stat{display:flex;justify-content:space-between;align-items:baseline;
  padding:6px 0;border-bottom:1px solid var(--border);font-size:10px;}
.stat:last-child{border-bottom:none;}
.stat-l{color:#7a7060;font-size:10px;}
.stat-r{font-weight:700;font-size:10px;}

/* ── UPLOAD ZONE ── */
.upload-zone{
  border:2px dashed var(--border);border-radius:3px;padding:48px;
  text-align:center;cursor:pointer;transition:all .2s;background:#fff;
  margin-bottom:28px;
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--gold);background:#fffbf3;}
.upload-icon{font-size:35px;margin-bottom:14px;}
.upload-title{font-family:'Shippori Mincho',serif;font-size:17px;margin-bottom:8px;}
.upload-sub{font-size:9px;color:var(--muted);letter-spacing:.1em;}
.upload-list{background:#fff;border:1px solid var(--border);border-radius:2px;overflow:hidden;}
.upload-row{
  display:flex;align-items:center;gap:14px;padding:13px 18px;
  border-bottom:1px solid var(--border);font-size:10px;
}
.upload-row:last-child{border-bottom:none;}
.upload-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
.upload-fname{flex:1;font-weight:600;font-size:11px;}
.upload-date{color:#7a7060;font-size:10px;}
.upload-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:15px;
  padding:2px 6px;transition:color .15s;}
.upload-del:hover{color:var(--red);}

/* ── COMPETENCIAS ── */
.comp-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;}
.comp-tab{
  padding:10px 20px;cursor:pointer;font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px;
  color:var(--muted);transition:all .2s;
}
.comp-tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:700;}
.comp-view{display:none;}
.comp-view.active{display:block;}
.comp-card{background:#fff;border:1px solid var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden;}
.comp-head{background:var(--ink);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.comp-name{font-family:'Shippori Mincho',serif;font-size:18px;color:var(--gold);font-weight:700;}
.comp-body{padding:20px 22px;}
.comp-badge{font-size:7px;letter-spacing:.25em;text-transform:uppercase;
  padding:3px 9px;border-radius:1px;font-weight:700;}
.badge-semanal{background:#c8a96e20;color:var(--gold);border:1px solid #c8a96e60;}
.badge-mensual{background:#4a7c5920;color:#4a7c59;border:1px solid #4a7c5960;}
.badge-especial{background:#c23b2220;color:#c23b22;border:1px solid #c23b2260;}
.progress-bar{height:6px;background:var(--panel);border-radius:2px;overflow:hidden;margin:10px 0 4px;}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .5s;}
.comp-prod-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
.prod-tag{background:var(--panel);border:1px solid var(--border);padding:4px 11px;
  font-size:9px;border-radius:1px;letter-spacing:.06em;}
.rank-table{width:100%;border-collapse:collapse;font-size:10px;}
.rank-table th{font-size:7px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);
  padding:6px 10px;text-align:left;border-bottom:2px solid var(--border);}
.rank-table td{padding:10px 10px;border-bottom:1px solid var(--border);}
.rank-table tr:last-child td{border-bottom:none;}
.rank-bar-wrap{height:4px;background:var(--border);border-radius:1px;overflow:hidden;margin-top:4px;width:100%;}
.rank-bar-fill{height:100%;background:var(--red);border-radius:1px;}
.comp-no-data{padding:28px;text-align:center;color:var(--muted);font-size:9px;letter-spacing:.2em;}
.comp-actions{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
.btn-sm{background:none;border:1px solid var(--border);padding:6px 14px;
  font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.15em;text-transform:uppercase;
  cursor:pointer;border-radius:1px;color:var(--muted);transition:all .15s;}
.btn-sm:hover{border-color:var(--ink);color:var(--ink);}
.btn-sm.del:hover{border-color:var(--red);color:var(--red);}

/* ── FORM ── */
.form-card{background:#fff;border:1px solid var(--border);padding:28px;border-radius:2px;max-width:820px;}
.form-title{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:700;
  margin-bottom:22px;padding-bottom:12px;border-bottom:2px solid var(--ink);}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.form-group{flex:1;min-width:150px;display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:7px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.form-input{border:1px solid var(--border);padding:8px 11px;
  font-family:'DM Mono',monospace;font-size:10px;background:var(--paper);
  outline:none;border-radius:1px;transition:border .15s;color:var(--ink);}
.form-input:focus{border-color:var(--gold);}
.form-sec{font-size:8px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);
  margin:18px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.prod-row-form{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.prod-idx{width:20px;height:20px;background:var(--ink);color:var(--gold);
  font-family:Syne,sans-serif;font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;border-radius:1px;flex-shrink:0;}
.prod-inp{flex:1;border:1px solid var(--border);padding:7px 10px;
  font-family:'DM Mono',monospace;font-size:10px;background:var(--paper);
  border-radius:1px;outline:none;color:var(--ink);}
.prod-inp:focus{border-color:var(--gold);}
.sug-box{position:absolute;top:100%;left:0;right:0;background:#fff;
  border:1px solid var(--border);border-top:none;z-index:50;
  font-size:10px;max-height:150px;overflow-y:auto;display:none;}
.sug-item{padding:7px 11px;cursor:pointer;border-bottom:1px solid var(--border);}
.sug-item:hover{background:var(--panel);}
.btn-del-row{background:none;border:1px solid var(--border);width:26px;height:26px;
  cursor:pointer;color:var(--muted);font-size:12px;border-radius:1px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;}
.btn-del-row:hover{border-color:var(--red);color:var(--red);}

<script>
// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let MODE = null; // 'manager' | 'salonero'
let CURRENT_USER = null;
let PENDING_FILE = null;

// Saloneros conocidos - se construye dinámicamente desde datos guardados
let ALL_SALS = [];
const CAJEROS_IDS = ['cajero turno mañana','cajero turno manana','cajero turno tarde'];
function isCajero(name){ return CAJEROS_IDS.includes((name||'').toLowerCase().replace('ñ','n')); }
function rebuildAllSals(){
  const seen = new Set();
  Object.values(DIAS).forEach(dia=>{
    Object.keys(dia.saloneros||{}).forEach(name=>{ if(!isCajero(name)) seen.add(name); });
  });
  ALL_SALS = [...seen].sort();
}
const PROD_SUGS = [];

// ══════════════════════════════════════════════════════
// FASE 2 · PERSISTENCIA HÍBRIDA (Google Sheets + localStorage como cache/offline)
// Versión 1.0 · Satori Dashboard
// ══════════════════════════════════════════════════════
const DB_VERSION = 3; // v3: clean start — no demo data, full cajero support
const DB_KEYS = { dias:'satori_dias_v1', comps:'satori_comps_v1', ver:'satori_db_ver', url:'satori_backend_url', metas:'satori_metas_v1' };

function load(key, def){
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  } catch(e) {
    console.warn('localStorage corrupto en', key, '— reseteando');
    localStorage.removeItem(key);
    return def;
  }
}

function save(key, val){
  try {
    localStorage.setItem(key, JSON.stringify(val));
    return true;
  } catch(e) {
    // QuotaExceededError — localStorage lleno
    if(e.name === 'QuotaExceededError'){
      showStorageWarning();
    }
    console.error('Error guardando localStorage:', key, e);
    return false;
  }
}

// ── FASE 2 · Google Sheets backend ──────────────────────────
let BACKEND_URL = localStorage.getItem('satori_backend_url') || 'https://script.google.com/macros/s/AKfycbz_MPh6TFtM6ToY_2CbbdHvtyKCwGg5uFPzYpw-9vcTtmtXX5BDIpnqE3KJgKtZwFBkeg/exec';
let BACKEND_ONLINE = false;

function saveBackendUrl(){
  const inp = document.getElementById('backend-url-inp');
  if(!inp) return;
  setBackendUrl(inp.value);
  syncFromCloud();
}
function setBackendUrl(url){
  BACKEND_URL = (url||'').trim();
  localStorage.setItem('satori_backend_url', BACKEND_URL);
}

async function apiCall(params){
  if(!BACKEND_URL) return null;
  try{
    const qs = new URLSearchParams({ key:'satori2026', ...params }).toString();
    const res = await fetch(BACKEND_URL + '?' + qs);
    const data = await res.json();
    return data.ok ? data : null;
  }catch(e){
    console.warn('Backend unreachable:', e.message);
    return null;
  }
}

async function syncFromCloud(){
  if(!BACKEND_URL){ showSyncStatus('Sin backend configurado', true); return false; }
  showSyncStatus('⟳ Sincronizando...');
  const r = await apiCall({ action:'getDias' });
  if(!r){ showSyncStatus('⚠ Sin conexión — offline', true); return false; }
  const cloudDias = r.dias || {};
  // Cloud wins over local — solo sobreescribir si Sheets devolvió datos
  if(Object.keys(cloudDias).length > 0){
    Object.keys(cloudDias).forEach(k => {
      const isoMatch = String(k).match(/(\d{4})-(\d{2})-(\d{2})/);
      const cleanKey = isoMatch ? `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}` : k;
      DIAS[cleanKey] = cloudDias[k];
      if(cleanKey !== k) delete DIAS[k];
    });
    save(DB_KEYS.dias, DIAS);
  } else {
    console.warn('syncFromCloud: Sheets devolvió días vacíos — manteniendo caché local');
  }
  const rc = await apiCall({ action:'getComps' });
  if(rc){ COMPS = rc.comps || []; save(DB_KEYS.comps, COMPS); }
  const rm = await apiCall({ action:'getMetas' });
  if(rm && rm.metas){
    METAS = rm.metas;
    save(DB_KEYS.metas, METAS);
    // Also update localStorage PIN for offline use
    if(METAS.managerPin) localStorage.setItem('satori_manager_pin', METAS.managerPin);
  }
  // Sync historical data
  const rHist = await apiCall({ action:'getHist' });
  if(rHist && rHist.hist && Object.keys(rHist.hist).length > 0){
    HIST = rHist.hist;
    // anual se carga por separado abajo
    saveHist();
  }
  // Cargar ventas anuales de saloneros
  const rAnual = await apiCall({ action:'getAnual' });
  if(rAnual && rAnual.anual) loadAnualFromCloud(rAnual.anual);
  await loadProductos();
  BACKEND_ONLINE = true;
  rebuildAllSals();
  renderView(document.querySelector('.ntab.active')?.dataset?.id || 'resumen');
  showSyncStatus('✓ Sincronizado', false, 3000);
  updateSyncTimestamp();
  return true;
}

async function apiPost(params){
  if(!BACKEND_URL) return null;
  try{
    // Apps Script doPost reads from e.postData.contents
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // text/plain avoids CORS preflight
      body: JSON.stringify({ key:'satori2026', ...params })
    });
    const data = await res.json();
    return data.ok ? data : null;
  }catch(e){
    console.warn('Backend POST unreachable:', e.message);
    return null;
  }
}

async function saveDiaOne(fecha){
  if(!BACKEND_URL){
    // Sin backend configurado → solo local
    save(DB_KEYS.dias, DIAS);
    updateStorageBadge();
    return true;
  }
  // Sheets primero — fuente de verdad
  const r = await apiPost({ action:'saveDia', fecha, data: JSON.stringify(DIAS[fecha]) });
  if(r?.ok || r !== null){
    // Sheets confirmó → guardar local
    save(DB_KEYS.dias, DIAS);
    updateStorageBadge();
    return true;
  } else {
    // Sheets falló → NO guardar local, mostrar error
    console.warn('saveDiaOne: Sheets rechazó la escritura para', fecha);
    return false;
  }
}


function updateSyncTimestamp(){var now=new Date();var badge=document.getElementById('sync-badge');if(badge){badge.textContent='✓ Sincronizado '+now.toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'});badge.style.color='var(--green)';badge.style.opacity='0.7';}localStorage.setItem('satori_last_sync',now.toISOString());}
function loadSyncTimestamp(){var ts=localStorage.getItem('satori_last_sync');var badge=document.getElementById('sync-badge');if(!badge)return;if(ts){var d=new Date(ts);var diffMin=Math.round((Date.now()-d.getTime())/60000);var label;if(diffMin<1)label='hace un momento';else if(diffMin<60)label='hace '+diffMin+' min';else if(diffMin<1440)label='hace '+Math.round(diffMin/60)+'h';else label=d.toLocaleDateString('es-CR',{day:'2-digit',month:'2-digit'});badge.textContent='✓ '+label;badge.style.color=diffMin>120?'#888':'var(--green)';badge.style.opacity='0.6';}else{badge.textContent='Sin sincronizar';badge.style.color='#555';badge.style.opacity='0.5';}}
function showSyncStatus(msg, warn=false, autohide=0){
  const badge = document.getElementById('sync-badge');
  if(!badge) return;
  badge.textContent = msg;
  badge.style.color = warn ? 'var(--red)' : 'var(--green)';
  badge.style.opacity = '1';
  if(autohide) setTimeout(()=>{ badge.style.opacity='0.3'; }, autohide);
}

function showStorageWarning(){
  const existing = document.getElementById('storage-warn');
  if(existing) return;
  const div = document.createElement('div');
  div.id = 'storage-warn';
  div.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#c23b22;color:#fff;' +
    'padding:14px 18px;border-radius:2px;font-size:11px;z-index:9999;max-width:320px;' +
    'font-family:DM Mono,monospace;letter-spacing:.05em;';
  div.innerHTML = '⚠ Almacenamiento local casi lleno. Considera exportar datos antiguos antes de continuar.' +
    '<button onclick="this.parentElement.remove()" style="margin-left:12px;background:none;border:1px solid rgba(255,255,255,.4);' +
    'color:#fff;padding:3px 8px;cursor:pointer;font-size:10px;border-radius:1px;">×</button>';
  document.body.appendChild(div);
  setTimeout(()=>{ if(div.parentElement) div.remove(); }, 8000);
}

function getStorageUsage(){
  let total = 0;
  try {
    for(let k in localStorage){
      if(localStorage.hasOwnProperty(k)) total += localStorage[k].length + k.length;
    }
  } catch(e){}
  return (total * 2 / 1024).toFixed(1); // bytes → KB approx
}

// ── Migrate from old keys if upgrading ──
function migrateDB(){
  // v2 migration: convert stored totals from gross to net (÷1.23)
  const storedVer = parseInt(localStorage.getItem('satori_db_ver') || '1');
  if(storedVer < 2){
    try {
      const dias = load(DB_KEYS.dias, {});
      let changed = false;
      Object.values(dias).forEach(dia => {
        Object.values(dia.saloneros || {}).forEach(sal => {
          // Only migrate if total looks gross (beb+com ≈ total within 1%)
          if(sal.total > 0 && sal.beb > 0 && sal.com > 0){
            const sumBC = sal.beb + sal.com;
            const ratio = sumBC / sal.total;
            if(ratio > 0.98 && ratio < 1.02){ // beb+com ≈ total → gross values
              sal.total = Math.round(sal.total / 1.23 * 100) / 100;
              sal.promPax   = sal.pax  ? sal.total / sal.pax  : 0;
              changed = true;
            }
          }
        });
      });
      if(changed){ save(DB_KEYS.dias, dias); console.log('Satori v2 migration: totals converted to net'); }
      localStorage.setItem('satori_db_ver', 2);
    } catch(e){ console.error('v2 migration error', e); }
  }
  const ver = load(DB_KEYS.ver, 0);
  if(ver < DB_VERSION){
    if(ver < 3){
      // v3: wipe local cache completely — cloud (Google Sheets) is source of truth
      localStorage.removeItem(DB_KEYS.dias);
      localStorage.removeItem(DB_KEYS.comps);
      localStorage.removeItem('satori_dias');
      localStorage.removeItem('satori_comps');
      console.log('Satori v3: cache local limpiado — sincronizando desde la nube');
    } else {
      // v0→v1: rename old keys
      const oldDias = load('satori_dias', null);
      const oldComps = load('satori_comps', null);
      if(oldDias) { save(DB_KEYS.dias, oldDias); localStorage.removeItem('satori_dias'); }
      if(oldComps) { save(DB_KEYS.comps, oldComps); localStorage.removeItem('satori_comps'); }
    }
    save(DB_KEYS.ver, DB_VERSION);
  }
  // Always sanitize: round all PAX, iCom, iBeb to integers (fix float parsing bug)
  sanitizeStoredData();
}

function sanitizeStoredData(){
  const dias = load(DB_KEYS.dias, {});
  let changed = false;
  Object.values(dias).forEach(dia => {
    Object.values(dia.saloneros || {}).forEach(sal => {
      const roundFields = ['pax','iCom','iBeb'];
      roundFields.forEach(f => {
        if(sal[f] !== undefined && sal[f] !== Math.round(sal[f])){
          sal[f] = Math.round(sal[f]);
          changed = true;
        }
      });
      // Recalculate derived fields if pax changed
      if(changed && sal.pax){
        sal.promPax  = sal.total / sal.pax;
        sal.promPlato  = sal.iCom ? sal.com / sal.iCom : 0;
        sal.promBebida = sal.iBeb ? sal.beb / sal.iBeb : 0;
        sal.ratioCB    = sal.beb  ? sal.com / sal.beb  : 0;
        sal.ratioU     = sal.iBeb ? sal.iCom / sal.iBeb : 0;
        sal.bebPax     = sal.pax  ? sal.iBeb / sal.pax  : 0;
      }
    });
  });
  if(changed){
    save(DB_KEYS.dias, dias);
    console.log('Satori: PAX sanitized — rounded float values to integers in stored data');
  }
}

// Returns the effective meta for a salonero + metric
// Priority: salMetas[name][metric] → global[metric] → 0
function getMeta(salName, metric) {
  const override = METAS.salMetas?.[salName]?.[metric];
  if(override && override > 0) return override;
  const g = METAS.global?.[metric];
  if(g && g > 0) return g;

// Returns CSS color based on actual vs meta (higher-is-better metrics)
// dir: 'hi' = higher is better, 'lo' = lower is better
function metaColor(actual, meta, dir='hi') {
  if(!meta || meta <= 0) return '';  // no meta set — no color
  const ratio = actual / meta;
  if(dir === 'hi') return ratio >= 1 ? 'var(--green)' : ratio >= 0.85 ? 'var(--gold)' : 'var(--red)';
  else             return ratio <= 1 ? 'var(--green)' : ratio <= 1.15 ? 'var(--gold)' : 'var(--red)';
}

// Returns indicator dot HTML: ● colored or empty string if no meta
function metaDot(actual, meta, dir='hi') {
  const c = metaColor(actual, meta, dir);
  if(!c) return '';
  return `<span style="color:${c};font-size:9px;margin-left:3px">●</span>`;
}

// Returns colored value span with meta indicator
function metaVal(val, formattedVal, meta, dir='hi') {
  const c = metaColor(val, meta, dir);
  if(!c) return formattedVal;
  return `<span style="color:${c}">${formattedVal}</span>`;
}

function filterLogin(val) {
  const dd   = document.getElementById('login-dropdown');

  const privMatch = PRIVILEGED_ROLES.filter(r =>

  );
  // Filtrar empleados
  const empMatch = EMPLEADOS_LOGIN.filter(e =>

    });

  if(empMatch.length) {
    html += `<div class="login-dropdown-section">Equipo · ${empMatch.length} activos</div>`;
    empMatch.forEach(e => {
      const initials = e.nombre.split(' ').map(w=>w[0]).slice(0,2).join('');

  dd.style.display = 'block';
}

function loginKeyNav(e) {
  const items = document.querySelectorAll('.login-dropdown-item');
  if(!items.length) return;
  if(e.key === 'ArrowDown') {
    e.preventDefault();
    _loginFocusIdx = Math.min(_loginFocusIdx + 1, items.length - 1);
    items[_loginFocusIdx]?.scrollIntoView({ block:'nearest' });
    items.forEach((el,i) => el.style.background = i===_loginFocusIdx ? '#1e1e1e' : '');
  } else if(e.key === 'ArrowUp') {
    e.preventDefault();
    _loginFocusIdx = Math.max(_loginFocusIdx - 1, 0);
    items[_loginFocusIdx]?.scrollIntoView({ block:'nearest' });
    items.forEach((el,i) => el.style.background = i===_loginFocusIdx ? '#1e1e1e' : '');
  } else if(e.key === 'Enter' && _loginFocusIdx >= 0) {
    items[_loginFocusIdx]?.click();
  } else if(e.key === 'Escape') {
    document.getElementById('login-dropdown').style.display = 'none';
  }
}

function pinKey(k){
  if(k==='⌫'){
    _pinBuffer = _pinBuffer.slice(0,-1);
    updatePinDisplay();
    return;
  }
  if(_pinBuffer.length >= 4) return;
  _pinBuffer += String(k);
  updatePinDisplay();
  if(_pinBuffer.length === 4) setTimeout(checkPin, 120);
}

function updatePinDisplay(){
  for(let i=0;i<4;i++){
    const dot = document.getElementById('pd'+i);
    dot.className = 'pin-dot' + (i<_pinBuffer.length?' filled':'');
  }
}

function checkPin(){
  let ok = false, role = null, user = null;

  if(_pinTarget === 'owner' && _pinBuffer === OWNER_PIN){
    ok = true; role = 'owner'; user = 'Dueño';
  } else if(_pinTarget === 'manager' && _pinBuffer === MANAGER_PIN){
    ok = true; role = 'manager'; user = 'Manager';
  } else if(_pinTarget === 'ggeneral' && _pinBuffer === CONTADOR_PIN){
    ok = true; role = 'ggeneral'; user = 'G.General';
  }

  if(ok){
    closePinModal();
    MODE = role; CURRENT_USER = user;
    showApp();
  } else {
    document.getElementById('pin-error').textContent = 'PIN incorrecto';
    for(let i=0;i<4;i++) document.getElementById('pd'+i).className='pin-dot error';
    setTimeout(()=>{ _pinBuffer=''; updatePinDisplay(); document.getElementById('pin-error').textContent=''; }, 1200);
  }
}

function buildNav() {
  const tabs       = getTabs();
  const moduleDefs = getModuleDefs();
  const navEl      = document.getElementById('nav-primary');

  if(!_activeTabId) _activeTabId = tabs[0]?.id;

  let html = '';
  let prevModule = null;

  tabs.forEach((t, i) => {
    // New group — add separator + label
    if(t.module !== prevModule) {
      if(prevModule !== null) html += `<div class="nav-group-sep"></div>`;
      const mod = moduleDefs.find(m => m.id === t.module);
      if(mod) html += `<div class="nav-group-label ${mod.cssClass}">${mod.label}</div>`;
      prevModule = t.module;
    }
    const isActive = _activeTabId === t.id;
    html += `<div class="ntab mod-${t.module}${isActive?' active':''}"
      data-id="${t.id}"
      onclick="activateTab(${i})">${t.label}</div>`;
  });

  navEl.innerHTML = html;
}

// Navigate to a tab by its id string (useful for cross-section links)
function activateTabById(id) {
  const tabs = getTabs();
  const idx = tabs.findIndex(t => t.id === id);
  if(idx >= 0) activateTab(idx);
}

function activateTab(i){
  const tabs    = getTabs();
  const tab     = tabs[i];
  if(!tab) return;
  _activeTabId  = tab.id;
  _activeModule = tab.module;

  // Update nav active state
  document.querySelectorAll('.ntab').forEach(el => {
    el.classList.toggle('active', el.dataset.id === tab.id);
  });

  // Show/hide views
  document.querySelectorAll('.view').forEach((v, j) => {
    v.classList.toggle('active', j === i);
    if(j === i) renderView(tabs[j].id);
  });
}

function fmtRatio(r){
  if(!r) return '—';
  const s = r.toFixed(2)+':1';
  const cls = r>=2.5&&r<=4.5 ? 'ratio-ok' : r<2.5 ? 'ratio-low' : 'ratio-high';
  return `<span class="${cls}">${s}</span>`;
}
function fmtRatioU(r){
  if(!r) return '—';
  const s = r.toFixed(1)+':1';
  const cls = r>=1.5&&r<=3.5 ? 'ratio-ok' : r<1.5 ? 'ratio-low' : 'ratio-high';
  return `<span class="${cls}">${s}</span>`;
}
function fmtBebPax(bebPax, salName){
  if(!bebPax) return '—';
  const s = bebPax.toFixed(2);
  const metaThresh = (salName ? getMeta(salName,'bebPax') : 0) || METAS.global?.bebPax || 1.2;
  const cls = bebPax>=metaThresh ? 'ratio-ok' : bebPax>=metaThresh*0.67 ? 'ratio-mid' : 'ratio-low';
  const emoji = bebPax>=metaThresh ? '🟢' : bebPax>=metaThresh*0.67 ? '🟡' : '🔴';
  return `<span class="${cls}">${emoji} ${s}</span>`;
}
function fmtBothRatios(cb, u){
  const cbStr = cb ? fmtRatio(cb) : '—';
  const uStr  = u  ? fmtRatioU(u) : '—';
  return `<div style="line-height:1.7"><div><small style="opacity:.55">₡ </small>${cbStr}</div><div><small style="opacity:.55">uds </small>${uStr}</div></div>`;
}

function fmtDate(d){
  if(!d) return '—';
  // Normalize: accept "2026-03-13", Date objects, or timestamp strings
  let str = d;
  if(typeof d !== 'string') str = String(d);
  // If it looks like a full date string or Date.toString(), extract YYYY-MM-DD
  const isoMatch = str.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(!isoMatch) return str; // fallback: show raw
  const [,y,m,day] = isoMatch;
  const M=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${parseInt(day)} ${M[parseInt(m)-1]} ${y}`;
}

function aggSalonero(name, dates){
  let total=0, com=0, beb=0, pax=0, iCom=0, iBeb=0, days=0;
  const prodAcc={}, prodComAcc={}, prodBebAcc={};
  // Also track per-date beb totals for the whole day (fallback estimation)
  const dayBebShare = {}; // date → {salBeb, dayBeb}

  dates.forEach(d => {
    const s = DIAS[d]?.saloneros?.[name];
    if(!s) return;
    total+=s.total||0; com+=s.com||0; beb+=s.beb||0;
    pax+=s.pax||0; iCom+=s.iCom||0; iBeb+=s.iBeb||0; days++;

    // Track this salonero's beb share of the day for fallback estimation
    const dayBebTotal = Object.values(DIAS[d].saloneros||{})
      .filter(sx=>!sx.esCajero).reduce((acc,sx)=>acc+(sx.beb||0),0);
    if(dayBebTotal>0 && (s.beb||0)>0)
      dayBebShare[d] = (s.beb||0) / dayBebTotal;

    (s.prods||[]).forEach(([pn,qty,monto])=>{
      if(!prodAcc[pn]) prodAcc[pn]={q:0,m:0};
      prodAcc[pn].q+=qty||0; prodAcc[pn].m+=monto||0;
      const tipo = classifyProd(pn);
      const mult = getProdMult(pn);
      if(tipo==='bebida'){
        const qAdj = (qty||0) * mult;
        if(!prodBebAcc[pn]) prodBebAcc[pn]={q:0,m:0};
        prodBebAcc[pn].q+=qAdj; prodBebAcc[pn].m+=monto||0;
        if(mult > 1) iBeb += (qty||0) * (mult - 1);
      } else if(tipo==='comida'){
        if(!prodComAcc[pn]) prodComAcc[pn]={q:0,m:0};
        prodComAcc[pn].q+=qty||0; prodComAcc[pn].m+=monto||0;
      }
    });
  });

  // ── Fallback: if no beverage products found in prods (old data format),
  // estimate from all saloneros' prods for those dates, scaled by this
  // salonero's share of total beverage sales ──────────────────────────────
  if(Object.keys(prodBebAcc).length === 0 && beb > 0){
    const fallbackBebAcc = {};
    dates.forEach(d => {
      const share = dayBebShare[d];
      if(!share || !DIAS[d]) return;
      Object.values(DIAS[d].saloneros||{}).forEach(sx => {
        (sx.prods||[]).forEach(([pn,qty,monto])=>{
          if(!pn || classifyProd(pn)!=='bebida') return;
          const mult = getProdMult(pn);
          const qAdj = (qty||0) * mult * share;
          const mAdj = (monto||0) * share;
          if(!fallbackBebAcc[pn]) fallbackBebAcc[pn]={q:0,m:0};
          fallbackBebAcc[pn].q += qAdj;
          fallbackBebAcc[pn].m += mAdj;
        });
      });
    });
    // Use fallback if it has data
    if(Object.keys(fallbackBebAcc).length > 0){
      Object.entries(fallbackBebAcc).forEach(([pn,v])=>{
        prodBebAcc[pn] = v;
      });
    }
  }
  const mk5m = acc => Object.entries(acc).sort((a,b)=>b[1].m-a[1].m).slice(0,5).map(([n,{q,m}])=>[n,q,Math.round(m)]);
  const mk5q = acc => Object.entries(acc).sort((a,b)=>b[1].q-a[1].q).slice(0,5).map(([n,{q,m}])=>[n,q,Math.round(m)]);
  const entries = Object.entries(prodAcc);
  // top3 por monto (para mostrar en tabla ranking)
  const top3m = entries.sort((a,b)=>b[1].m-a[1].m).slice(0,3)
    .map(([n,{q,m}])=>({n, q, m:Math.round(m), prom: q ? Math.round(m/q) : 0}));
  // precio promedio ponderado por item
  const totalUnits = entries.reduce((s,[,{q}])=>s+q, 0);
  const promTicket = totalUnits ? Math.round(entries.reduce((s,[,{q,m}])=>s+m, 0) / totalUnits) : 0;
  return {
    total, com, beb, pax, iCom, iBeb, days,
    top3m,
    top5:    mk5m(prodAcc),    top5q:    mk5q(prodAcc),
    top5com: mk5m(prodComAcc), top5comq: mk5q(prodComAcc),
    top5beb: mk5m(prodBebAcc), top5beqq: mk5q(prodBebAcc),
    promTicket,
    promPax:    pax    ? total/pax    : 0,
    promPlato:  iCom   ? com/iCom     : 0,
    promBebida: iBeb   ? beb/iBeb     : 0,
    ratioCB:    beb    ? (com/beb)    : 0,
    ratioU:     iBeb   ? (iCom/iBeb)  : 0,
    bebPax:     pax    ? (iBeb/pax)   : 0,
  };
}

// Clasificación de productos — se carga desde Google Sheets (hoja 'productos')
// PRODUCT_MAP: { NOMBRE: { tipo, clas, subcl } }
// Fallback vacío → classifyProd retorna 'desconocido' hasta que cargue
let PRODUCT_MAP = {};
let PRODUCTOS_LOADED = false;

// Normaliza nombre para búsqueda: mayúsculas, sin tildes, sin puntuación extra
function normalizeProdName(s) {
  return (s||'').toUpperCase().trim()
    .normalize('NFD').replace(/[̀-ͯ]/g,'') // quita tildes
    .replace(/[^\w\s]/g,' ')                          // reemplaza puntuación con espacio
    .replace(/\s+/g,' ').trim();
}

// Caché de normalización para no recalcular
let _PROD_NORM_CACHE = null;
function getProdNormCache() {
  if(!_PROD_NORM_CACHE || Object.keys(_PROD_NORM_CACHE).length !== Object.keys(PRODUCT_MAP).length) {
    _PROD_NORM_CACHE = {};
    Object.entries(PRODUCT_MAP).forEach(([k,v]) => {
      _PROD_NORM_CACHE[normalizeProdName(k)] = v;
    });
  }
  return _PROD_NORM_CACHE;
}

// Retorna el tipo del producto: 'bebida'|'comida'|'cortesia'|'personal'|'nofood'|'desconocido'
function classifyProd(name) {
  const u = (name||'').toUpperCase().trim();
  let p = PRODUCT_MAP[u];
  if(!p) p = getProdNormCache()[normalizeProdName(name)];
  if(!p) return 'desconocido';
  return typeof p === 'object' ? (p.tipo || 'desconocido') : p;
}

// Retorna multiplicador del producto (cuántas bebidas equivale: botella vino = 5)
function getProdMult(name) {
  const u = (name||'').toUpperCase().trim();
  let p = PRODUCT_MAP[u];
  if(!p) p = getProdNormCache()[normalizeProdName(name)];
  if(!p || typeof p !== 'object') return 1;
  return p.mult || 1;
}

// Retorna objeto completo del producto o null
function getProdInfo(name) {
  const u = (name||'').toUpperCase().trim();
  let p = PRODUCT_MAP[u];
  if(!p) p = getProdNormCache()[normalizeProdName(name)];
  if(!p) return null;
  if(typeof p === 'object') return p;
  return { tipo: p, clas: '', subcl: '', mult: 1 };
}

// ── carga productos desde Sheets ──────────────────────────────
async function loadProductos() {
  if(!BACKEND_URL) return;
  const r = await apiCall({ action:'getProductos' });
  if(r && r.productos && Object.keys(r.productos).length > 0){
    PRODUCT_MAP = r.productos;
    PRODUCTOS_LOADED = true;
    _PROD_NORM_CACHE = null; // invalidate normalize cache
    localStorage.setItem('satori_productos', JSON.stringify(PRODUCT_MAP));
    console.log(`Productos cargados: ${r.count}`);
  } else {
    // fallback a caché local
    const cached = localStorage.getItem('satori_productos');

  }
}

// Aggregate all saloneros for a set of dates → general metrics
function aggGeneral(dates){
  let total=0, com=0, beb=0, pax=0, iCom=0, iBeb=0;
  let cajTotal=0, cajDelivery=0, cajSalon=0;
  let cortTotal=0, cortQ=0;   // cortesías: monto y unidades
  let persTotal=0, persQ=0;   // personal: monto y unidades
  let descTotal=0, descQ=0;   // desconocidos: para auditoría
  const prodAcc={}, prodComAcc={}, prodBebAcc={};
  const prodCortAcc={}, prodPersAcc={}, prodDescAcc={};
  dates.forEach(d => {
    const day = DIAS[d];
    if(!day) return;
    Object.values(day.saloneros||{}).forEach(s => {
      if(s.esCajero){
        cajTotal    += s.total||0;
        cajDelivery += s.delivery||0;
        cajSalon    += s.salon||0;
      } else {
        total+=s.total||0; com+=s.com||0; beb+=s.beb||0;
        pax+=s.pax||0; iCom+=s.iCom||0; iBeb+=s.iBeb||0;
      }
      // Accumulate products with classification
      (s.prods||[]).forEach(([pn,qty,monto])=>{
        if(!pn) return;
        const tipo = classifyProd(pn);
        const mult = getProdMult(pn); // multiplicador: botella vino=5, resto=1
        if(!prodAcc[pn]) prodAcc[pn]={q:0,m:0};
        prodAcc[pn].q+=qty||0; prodAcc[pn].m+=monto||0;
        if(tipo==='bebida'){
          const qAdj = (qty||0) * mult;
          if(!prodBebAcc[pn]) prodBebAcc[pn]={q:0,m:0};
          prodBebAcc[pn].q+=qAdj; prodBebAcc[pn].m+=monto||0;
          // Solo agregar el extra (mult-1) — el XLS ya contó qty×1
          if(!s.esCajero && mult > 1){
            iBeb += (qty||0) * (mult - 1);
          }
        } else if(tipo==='cortesia'){
          cortTotal+=monto||0; cortQ+=qty||0;
          if(!prodCortAcc[pn]) prodCortAcc[pn]={q:0,m:0};
          prodCortAcc[pn].q+=qty||0; prodCortAcc[pn].m+=monto||0;
        } else if(tipo==='personal'){
          persTotal+=monto||0; persQ+=qty||0;
          if(!prodPersAcc[pn]) prodPersAcc[pn]={q:0,m:0};
          prodPersAcc[pn].q+=qty||0; prodPersAcc[pn].m+=monto||0;
        } else if(tipo==='desconocido'){
          descTotal+=monto||0; descQ+=qty||0;
          if(!prodDescAcc[pn]) prodDescAcc[pn]={q:0,m:0};
          prodDescAcc[pn].q+=qty||0; prodDescAcc[pn].m+=monto||0;
        } else if(tipo==='comida'){
          if(!prodComAcc[pn]) prodComAcc[pn]={q:0,m:0};
          prodComAcc[pn].q+=qty||0; prodComAcc[pn].m+=monto||0;
        }
        // nofood: se acumula en prodAcc general pero no en com/beb
      });
    });
  });
  const mk5m = acc => Object.entries(acc)
    .sort((a,b)=>b[1].m-a[1].m).slice(0,5)
    .map(([n,{q,m}])=>[n,q,Math.round(m)]);
  const mk5q = acc => Object.entries(acc)
    .sort((a,b)=>b[1].q-a[1].q).slice(0,5)
    .map(([n,{q,m}])=>[n,q,Math.round(m)]);
  const mkAll = acc => Object.entries(acc)
    .sort((a,b)=>b[1].m-a[1].m)
    .map(([n,{q,m}])=>[n,q,Math.round(m)]);
  const totalRest = total + cajTotal;
  return { total, com, beb, pax, iCom, iBeb,
    cajTotal, cajDelivery, cajSalon, totalRest,
    cortTotal, cortQ, persTotal, persQ,
    descTotal, descQ,
    top5:    mk5m(prodAcc),    top5q:    mk5q(prodAcc),
    top5com: mk5m(prodComAcc), top5comq: mk5q(prodComAcc),
    top5beb: mk5m(prodBebAcc), top5beqq: mk5q(prodBebAcc),
    top5cort: mkAll(prodCortAcc),
    top5pers: mkAll(prodPersAcc),
    top5desc: mkAll(prodDescAcc),
    pctDelivery: totalRest ? (cajDelivery/totalRest*100) : 0,
    pctSalon:    totalRest ? ((total+cajSalon)/totalRest*100) : 0,
    promPax: pax?total/pax:0,
    promPlato: iCom?com/iCom:0,
    promBebida: iBeb?beb/iBeb:0,
    ratioCB: beb?(com/beb):0,
    ratioU: iBeb?(iCom/iBeb):0,
    bebPax: pax?(iBeb/pax):0,
  };
}

    return arr.map(([n,q,m],i)=>{
      const primary   = mode==='q' ? `${q} uds` : fi(m);

      const pCol      = mode==='q' ? '#f0ece4'   : color;
      return `
      <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #1a1a1a;">

        </div>
        <div style="font-size:14px;font-weight:700;color:${pCol};white-space:nowrap">${primary}</div>
      </div>`;
    }).join('');
  };

  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin-top:8px;';

  const outerTabs = document.createElement('div');
  outerTabs.style.cssText = 'display:flex;gap:0;border-bottom:1px solid var(--border);';

  const tabData = [
    {id:'gen', label:'🍽 General', arrM:top5,    arrQ:top5q,    color:'var(--red)'},
    {id:'com', label:'🥢 Comidas', arrM:top5com,  arrQ:top5comq, color:'var(--green)'},
    {id:'beb', label:'🍶 Bebidas', arrM:top5beb,  arrQ:top5beqq, color:'#5588cc'},
  ];

  let currentMode = 'm';
  const allPanels = {};
  let activeTab = 'gen';

  tabData.forEach((t,i)=>{
    const btn = document.createElement('div');
    btn.style.cssText = `padding:10px 16px;cursor:pointer;font-size:10px;letter-spacing:.1em;
      text-transform:uppercase;border-bottom:2px solid ${i===0?'var(--gold)':'transparent'};
      color:${i===0?'var(--gold)':'#666'};transition:all .15s;white-space:nowrap;font-weight:${i===0?'700':'400'};`;
    btn.textContent = t.label;
    btn.dataset.tab = t.id;
    outerTabs.appendChild(btn);

    const panelM = document.createElement('div');
    panelM.style.cssText = `background:var(--ink);border-radius:0 0 2px 2px;display:${i===0?'block':'none'}`;
    panelM.innerHTML = mkTable(t.arrM, t.color, 'm');
    const panelQ = document.createElement('div');
    panelQ.style.cssText = 'background:var(--ink);border-radius:0 0 2px 2px;display:none';
    panelQ.innerHTML = mkTable(t.arrQ, t.color, 'q');
    allPanels[t.id] = {m:panelM, q:panelQ};
  });

  const modeRow = document.createElement('div');
  modeRow.style.cssText = 'display:flex;background:#0a0a0a;border-bottom:1px solid #1a1a1a;';
  const mkModeBtn = (mode, label) => {
    const b = document.createElement('div');
    b.style.cssText = `padding:6px 14px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
      cursor:pointer;color:${currentMode===mode?'var(--gold)':'#444'};
      border-bottom:2px solid ${currentMode===mode?'var(--gold)':'transparent'};transition:all .15s;`;
    b.textContent = label; b.dataset.mode = mode; return b;
  };
  const btnM = mkModeBtn('m','₡ Por monto');
  const btnQ = mkModeBtn('q','# Por unidades');
  modeRow.appendChild(btnM); modeRow.appendChild(btnQ);

  const switchMode = mode => {
    currentMode = mode;
    [btnM,btnQ].forEach(b=>{
      const a=b.dataset.mode===mode;
      b.style.color=a?'var(--gold)':'#444';
      b.style.borderBottomColor=a?'var(--gold)':'transparent';
    });
    Object.values(allPanels).forEach(p=>{p.m.style.display='none';p.q.style.display='none';});
    const ap=allPanels[activeTab]; if(ap) ap[mode].style.display='block';
  };
  modeRow.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)switchMode(b.dataset.mode);});

  outerTabs.addEventListener('click',e=>{
    const btn=e.target.closest('[data-tab]'); if(!btn) return;
    activeTab=btn.dataset.tab;
    outerTabs.querySelectorAll('[data-tab]').forEach(b=>{
      const a=b.dataset.tab===activeTab;
      b.style.borderBottomColor=a?'var(--gold)':'transparent';
      b.style.color=a?'var(--gold)':'#666'; b.style.fontWeight=a?'700':'400';
    });
    Object.values(allPanels).forEach(p=>{p.m.style.display='none';p.q.style.display='none';});
    allPanels[activeTab][currentMode].style.display='block';
  });

  wrap.appendChild(outerTabs);
  wrap.appendChild(modeRow);
  Object.values(allPanels).forEach(p=>{wrap.appendChild(p.m);wrap.appendChild(p.q);});
  return wrap;
}

// DATE RANGE BAR
// ═══════════════════════════════════════════════════════════════
function makeRangeBar(fromId, toId, onApply){
  const dates = getDates();
  const last  = dates[dates.length-1] || today();
  // Default: first day of the month of the last date
  const lastObj = new Date((last)+'T12:00:00');
  const firstOfMonth = new Date(lastObj.getFullYear(), lastObj.getMonth(), 1).toISOString().slice(0,10);
  // Use firstOfMonth if there are dates in that month, else use earliest date
  const first = dates.find(d => d >= firstOfMonth) ? firstOfMonth : (dates[0] || today());

  const wrap = document.createElement('div');
  wrap.className = 'range-bar';

  // Build via DOM to avoid template literal conflicts
  const applyFn = typeof onApply === 'function' ? onApply : () => { try{ eval(onApply); }catch(e){} };

  function mkLabel(txt){ const l=document.createElement('label'); l.textContent=txt; return l; }
  function mkInput(id, val){
    const inp = document.createElement('input');
    inp.className = 'range-input';
    inp.type = 'date';
    inp.id = id;
    inp.value = val;
    let lastVal = val;
    // Multi-event approach for cross-browser compatibility
    // Safari/iOS: fires 'change' on blur after picker closes
    // Chrome: fires 'change' + 'input' immediately
    // Firefox: fires 'change' on blur
    ['change','input','blur'].forEach(evt => {
      inp.addEventListener(evt, () => {
        if(inp.value && inp.value !== lastVal){
          lastVal = inp.value;
          applyFn();
        }
      });
    });
    // Polling fallback: check every 300ms while focused (covers all edge cases)
    inp.addEventListener('focus', () => {
      const poll = setInterval(() => {
        if(document.activeElement !== inp){ clearInterval(poll); return; }
        if(inp.value && inp.value !== lastVal){
          lastVal = inp.value;
          applyFn();
        }
      }, 300);
      // Auto-clear after 30s
      setTimeout(() => clearInterval(poll), 30000);
    });
    return inp;
  }
  function mkPreset(label, days){
    const btn = document.createElement('button');
    btn.className = 'range-preset';
    btn.textContent = label;
    btn.onclick = (e) => { setPreset(fromId, toId, days, btn, e); };
    return btn;
  }

  const sep = document.createElement('span');
  sep.className = 'range-sep';
  sep.textContent = '→';

  const applyBtn = document.createElement('button');
  applyBtn.className = 'btn-primary';
  applyBtn.style.cssText = 'padding:7px 18px;font-size:9px';
  applyBtn.textContent = 'Aplicar';
  applyBtn.id = 'range-apply-' + fromId;
  applyBtn.onclick = applyFn;

  wrap.appendChild(mkLabel('Desde'));
  wrap.appendChild(mkInput(fromId, first));
  wrap.appendChild(sep);
  wrap.appendChild(mkLabel('Hasta'));
  wrap.appendChild(mkInput(toId, last));
  wrap.appendChild(mkPreset('7d', 7));
  wrap.appendChild(mkPreset('15d', 14));
  wrap.appendChild(mkPreset('30d', 30));
  wrap.appendChild(mkPreset('Todo', 0));
  wrap.appendChild(applyBtn);

  return wrap;
}

function setPreset(fromId, toId, days, btn, e){
  e && e.stopPropagation();
  const dates = getDates();
  const last = dates[dates.length-1] || today();
  document.getElementById(toId).value = last;
  if(days===0) document.getElementById(fromId).value = dates[0]||today();
  else document.getElementById(fromId).value = addDays(last, -days+1);
  document.querySelectorAll('.range-preset').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  // Auto-apply: click the apply button in the same range-bar
  const applyBtn = document.getElementById('range-apply-'+fromId);
  if(applyBtn) applyBtn.click();
}

function renderResumen(el){
  const dates = getDates();
  if(!dates.length){
    el.innerHTML = emptyState('📂','Sin datos','Sube el primer XLS en la pestaña "Subir XLS"');

  const deltaStr = (cur, prev, prefix='') => {
    if(!prev) return '';
    const d = pct(cur, prev);
    const cls = d>0?'up':d<0?'down':'flat';
    const sign = d>0?'▲':d<0?'▼':'';

  el.innerHTML = `
    <div class="sl">Resumen · ${fmtDate(lastDate)}</div>

    ${gen.totalRest > 0 ? `
    <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:10px">Restaurante completo</div>
    <div class="kpi-grid" style="margin-bottom:6px">
      <div class="kpi red">
        <div class="kpi-label">Ventas Totales Restaurante</div>
        <div class="kpi-val">${fi(gen.totalRest)}</div>
        ${deltaStr(gen.totalRest, genPrev?.totalRest)}
      </div>
      <div class="kpi">
        <div class="kpi-label">Salón (saloneros)</div>
        <div class="kpi-val">${fi(gen.total)}</div>
        <div class="kpi-sub">${gen.totalRest?gen.pctSalon.toFixed(1)+'% del total':'—'}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Cajeros / Delivery</div>
        <div class="kpi-val">${fi(gen.cajTotal)}</div>
        <div class="kpi-sub">${gen.totalRest?((gen.cajTotal/gen.totalRest)*100).toFixed(1)+'% del total':'—'}</div>
      </div>
      <div class="kpi blue">
        <div class="kpi-label">Solo Delivery</div>
        <div class="kpi-val">${fi(gen.cajDelivery)}</div>
        <div class="kpi-sub">${gen.totalRest?(gen.pctDelivery).toFixed(1)+'% del total':'—'}</div>
      </div>
    </div>
    <div style="height:1px;background:var(--border);margin:16px 0 14px"></div>
    <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:10px">Saloneros · salón</div>
    ` : ''}

    <div class="kpi-grid">
      <div class="${gen.totalRest>0?'kpi':'kpi red'}">
        <div class="kpi-label">${gen.totalRest>0?'Ventas Salón':'Ventas Totales'}</div>
        <div class="kpi-val">${fi(gen.total)}</div>
        ${deltaStr(gen.total, genPrev?.total)}
      </div>
      <div class="kpi">
        <div class="kpi-label">PAX ticket (real)</div>
        <div class="kpi-val">${gen.pax}</div>
        ${deltaStr(gen.pax, genPrev?.pax)}
      </div>
      <div class="kpi green">
        <div class="kpi-label">Prom / PAX</div>
        <div class="kpi-val">${fi(gen.promPax)}</div>
        ${deltaStr(gen.promPax, genPrev?.promPax)}
      </div>
      <div class="kpi">
        <div class="kpi-label">Ventas Comidas</div>
        <div class="kpi-val">${fi(gen.com)}</div>
        <div class="kpi-sub">${gen.iCom} platos</div>
      </div>
      <div class="kpi blue">
        <div class="kpi-label">Ventas Bebidas</div>
        <div class="kpi-val">${fi(gen.beb)}</div>
        <div class="kpi-sub">${gen.iBeb} bebidas</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Prom / Plato</div>
        <div class="kpi-val">${fi(gen.promPlato)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Prom / Bebida</div>
        <div class="kpi-val">${fi(gen.promBebida)}</div>
      </div>
      <div class="${(()=>{const m=getMeta('__gen__','bebPax')||METAS.global?.bebPax||0; return m?metaColor(gen.bebPax,m)?`kpi ${metaColor(gen.bebPax,m)==='var(--green)'?'green':'red'}`:'kpi':'kpi';})()}">
        <div class="kpi-label">Beb / PAX</div>
        <div class="kpi-val" style="font-size:22px">${fmtBebPax(gen.bebPax)}</div>
        ${METAS.global?.bebPax?`<div class="kpi-sub" style="color:${metaColor(gen.bebPax,METAS.global.bebPax)}">meta ${METAS.global.bebPax.toFixed(1)}</div>`:'<div class="kpi-sub">ideal ≥ 1.2</div>'}
      </div>
      <div class="kpi">
        <div class="kpi-label">Ratio Comida / Bebida</div>
        <div class="kpi-val" style="font-size:18px">${fmtBothRatios(gen.ratioCB, gen.ratioU)}</div>

      </div>

  // ── Bloque de meta mensual en "Hoy" ──────────────────────
  (function(){
    const _mk = lastDate.slice(0,7);
    const _meta = METAS.restaurante?.[_mk] || 0;
    if(!_meta) return;
    const _monthDates = getDates().filter(d=>d.startsWith(_mk));
    // Usar aggGeneral para consistencia con Ventas (totalRest = saloneros + cajeros, sin duplicar delivery)
    const _ventasMes = _monthDates.reduce((s,d)=>{
      const g=aggGeneral([d]); return s+(g.totalRest||0);
    },0);
    const _dim = new Date(+_mk.slice(0,4),+_mk.slice(5,7),0).getDate();
    const _dp = _monthDates.length;
    const _pct = Math.min(_ventasMes/_meta*100,100);
    const _proj = _dp ? (_ventasMes/_dp)*_dim : 0;
    const _ok = _proj >= _meta;
    const _metaDia = _meta/_dim;
    const _promDia = _dp ? _ventasMes/_dp : 0;
    const _diasRest = _dim - _dp;
    const _faltante = _meta - _ventasMes;
    const _esf = (_diasRest>0 && _faltante>0) ? _faltante/_diasRest : null;
    const _promColor = _promDia>=_metaDia ? 'var(--green)' : 'var(--red)';
    const _div = document.createElement('div');
    _div.style.cssText = 'background:var(--ink);border-radius:2px;padding:14px 18px;margin-bottom:18px;border-left:3px solid '+(_ok?'var(--green)':'var(--red)')+';';
    let _esfHtml = '';
    if(_esf!==null) _esfHtml = '<span style="color:'+(_esf<=_metaDia?'var(--green)':'var(--red)')+'">&#9889; Esfuerzo req. ('+_diasRest+'d): <strong>'+fi(_esf)+'</strong>/día</span>';
    else if(_faltante<=0) _esfHtml = '<span style="color:var(--green)">✓ Meta alcanzada</span>';

      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
        '<span style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#888">META '+_mk+' · '+_dp+' DE '+_dim+' DÍAS</span>'+
        '<div><span style="font-family:Syne,sans-serif;font-size:16px;font-weight:800;color:'+(_ok?'var(--green)':'var(--red)')+'">'+fi(_ventasMes)+'</span>'+
        '<span style="font-size:9px;color:#555;margin-left:6px">de '+fi(_meta)+'</span></div>'+
      '</div>'+
      '<div style="height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin-bottom:8px">'+
        '<div style="height:100%;width:'+_pct.toFixed(1)+'%;border-radius:3px;background:'+(_pct>=100?'var(--green)':_pct>=70?'var(--gold)':'var(--red)')+'"></div></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:9px;color:#666;margin-bottom:8px">'+
        '<span>'+_pct.toFixed(1)+'% completado</span>'+
        '<span style="color:'+(_ok?'var(--green)':'var(--red)')+'">'+(_ok?'✓ En camino':'⚠ Por debajo')+' · Proyección: '+fi(_proj)+' ('+(Math.min(_proj/_meta,9.99)*100).toFixed(0)+'%)</span>'+
      '</div>'+
      '<div style="font-size:10px;color:#666;display:flex;gap:16px;flex-wrap:wrap;">'+
        '<span>Meta diaria implícita: <strong style="color:#f0ece4">'+fi(_metaDia)+'</strong></span>'+
        '<span>Promedio actual/día: <strong style="color:'+_promColor+'">'+fi(_promDia)+'</strong></span>'+
        _esfHtml+
      '</div>';
    // Insertar antes del primer <div class="sl">
    const _slEl = el.querySelector('.sl');
    if(_slEl) el.insertBefore(_div, _slEl);
    else el.appendChild(_div);
  })();

  // Ranking table — sortable
  const sal_raw = ALL_SALS
    .map(n => ({ n, ...aggSalonero(n,[lastDate]) }))
    .filter(s => s.total > 0 && s.pax > 0);

  // Sort state: persisted in closure
  if(typeof renderResumen._sortKey === 'undefined'){
    renderResumen._sortKey = 'promPax';

  }

  function buildRankingTable(sortKey){
    if(sortKey === renderResumen._sortKey){ renderResumen._sortAsc = !renderResumen._sortAsc; }
    else { renderResumen._sortKey = sortKey; renderResumen._sortAsc = false; }

    const sorted = [...sal_raw].sort((a,b) => asc ? a[sortKey]-b[sortKey] : b[sortKey]-a[sortKey]);
    const maxVal = sorted[0]?.[sortKey] || 1;

    const cols = [
      { key: null,         label: '#' },
      { key: null,         label: 'Salonero' },

      { key: 'total',      label: 'Ventas' },

      const mRatio      = getMeta(s.n, 'ratioCB');
      const cBebPax     = metaColor(s.bebPax,     mBebPax,  'hi');
      const cPromPax    = metaColor(s.promPax,    mPromPax, 'hi');
      const cTicket     = mTicket ? metaColor(s.promTicket, mTicket, 'hi') : ticketColor;

          <span style="font-size:9px;color:${pi===0?'var(--gold)':'#444'};min-width:10px">${pi+1}</span>

        <td style="color:${cBebPax||'inherit'}" title="${mBebPax?'Meta: '+mBebPax.toFixed(1):''}">

    el.appendChild(spGrid);

    </div>

    <div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#5a5040;font-weight:600;margin-bottom:10px">Saloneros · salón</div>

      <div class="kpi blue"><div class="kpi-label">Ventas Bebidas</div><div class="kpi-val">${fi(gen.beb)}</div></div>
      <div class="kpi"><div class="kpi-label">Prom/Plato promedio</div><div class="kpi-val">${fi(gen.promPlato)}</div></div>
      <div class="kpi"><div class="kpi-label">Prom/Bebida promedio</div><div class="kpi-val">${fi(gen.promBebida)}</div></div>
      <div class="kpi"><div class="kpi-label">Beb / PAX</div><div class="kpi-val" style="font-size:22px">${fmtBebPax(gen.bebPax)}</div><div class="kpi-sub">ideal ≥ 1.2</div></div>

    </div>`;

  el.innerHTML = kpiHtml;

  // ── Top 5 productos del período ──

  t5title.textContent = 'Top productos · período seleccionado';
  t5wrap.appendChild(t5title);
  t5wrap.appendChild(renderTop5Block(gen.top5, gen.top5com, gen.top5beb, gen.top5q, gen.top5comq, gen.top5beqq));
  el.appendChild(t5wrap);

  // Chart
  const chartWrap = document.createElement('div');
  chartWrap.className = 'chart-wrap';

  const lastPP = genLast.promPax;
  const prevPP = genPrev?.promPax;
  const delta = prevPP ? pct(lastPP, prevPP) : null;
  const deltaClass = !delta ? 'flat' : delta>0?'up':'down';
  const deltaSign = !delta ? '' : delta>0?'▲ ':'▼ ';

  chartWrap.innerHTML = `
    <div class="chart-header">
      <div>

      </div>
      <div class="chart-meta">
        <div class="chart-current">${fi(lastPP)}</div>

      </div>
    </div>

    <canvas id="chart-canvas" height="220"></canvas>
    <div id="chart-tooltip" style="display:none;position:absolute;background:var(--ink);color:#f0ece4;
      padding:10px 14px;border-radius:2px;font-size:10px;pointer-events:none;z-index:10;min-width:140px;"></div>
  `;
  el.appendChild(chartWrap);

  // Build chart data — colores dinámicos para cualquier salonero
  const PALETTE = ['#c23b22','#4a7c59','#2a4a6b','#b09060','#7a5c8a','#3a8a8a','#a05020','#506090','#608030','#904060'];
  const seriesData = {};
  const colors = { General:'#c8a96e' };
  ALL_SALS.forEach((name,i) => { colors[name] = PALETTE[i % PALETTE.length]; });

  ALL_SALS.forEach(name => {
    seriesData[name] = dates.map(d => {
      const s = DIAS[d]?.saloneros?.[name];
      return s?.pax ? s.total/s.pax : null;
    });
  });
  seriesData['General'] = dates.map(d => {
    const g = aggGeneral([d]);
    return g.pax ? g.promPax : null;
  });

  // Legend
  const legend = chartWrap.querySelector('#chart-legend');
  const visibleLines = {};
  Object.keys(colors).forEach(name => {
    visibleLines[name] = true;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.id = 'leg-'+name;
    item.innerHTML = `<div class="legend-dot" style="background:${colors[name]}"></div><span>${name}</span>`;
    item.onclick = () => {
      visibleLines[name] = !visibleLines[name];
      item.style.opacity = visibleLines[name] ? '1' : '0.35';
      drawChart(canvas, dates, seriesData, colors, visibleLines, chartWrap);
    };
    legend.appendChild(item);
  });

  const canvas = chartWrap.querySelector('#chart-canvas');
  setTimeout(() => drawChart(canvas, dates, seriesData, colors, visibleLines, chartWrap), 50);
}

function drawChart(canvas, dates, seriesData, colors, visibleLines, wrap){
  const W = canvas.offsetWidth;
  const H = 220;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  // Dark background
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, W, H);
  const PAD = {t:16, r:20, b:40, l:70};
  const CW = W - PAD.l - PAD.r;
  const CH = H - PAD.t - PAD.b;

  // Gather all visible values to determine Y range
  let allVals = [];
  Object.entries(seriesData).forEach(([name, vals]) => {
    if(!visibleLines[name]) return;
    vals.forEach(v => { if(v!=null) allVals.push(v); });
  });
  if(!allVals.length){ ctx.clearRect(0,0,W,H); return; }
  const minV = Math.min(...allVals) * 0.88;
  const maxV = Math.max(...allVals) * 1.06;
  const range = maxV - minV || 1;

  const xPos = (i) => PAD.l + (dates.length<2 ? CW/2 : i/(dates.length-1)*CW);
  const yPos = (v) => PAD.t + CH - ((v - minV)/range)*CH;

  ctx.clearRect(0,0,W,H);

  // Grid lines
  const ticks = 5;
  ctx.strokeStyle = '#e8e2d8';
  ctx.lineWidth = 1;
  for(let i=0;i<=ticks;i++){
    const y = PAD.t + i*(CH/ticks);
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(PAD.l+CW, y); ctx.stroke();
    const val = maxV - i*(range/ticks);
    ctx.fillStyle = '#8a8070';
    ctx.font = '9px DM Mono';
    ctx.textAlign = 'right';
    ctx.fillText('₡'+Math.round(val/1000)+'k', PAD.l-6, y+3);
  }

  // X axis labels
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8a8070';
  const maxLabels = Math.floor(CW/60);
  const step = Math.max(1, Math.ceil(dates.length/maxLabels));
  dates.forEach((d,i) => {
    if(i % step !== 0 && i !== dates.length-1) return;
    const [,m,day] = d.split('-');
    const M=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    ctx.fillText(`${parseInt(day)} ${M[parseInt(m)-1]}`, xPos(i), H-PAD.b+14);
  });

  // Draw each series
  Object.entries(seriesData).forEach(([name, vals]) => {
    if(!visibleLines[name]) return;
    const color = colors[name];
    const isGen = name === 'General';

    // Collect valid points
    const pts = vals.map((v,i) => v!=null ? {x:xPos(i), y:yPos(v), v} : null);

    // Draw gradient fill for General
    if(isGen){
      const valid = pts.filter(Boolean);
      if(valid.length < 2) return;
      const grad = ctx.createLinearGradient(0, PAD.t, 0, PAD.t+CH);
      grad.addColorStop(0, color+'44');
      grad.addColorStop(1, color+'08');
      ctx.beginPath();
      ctx.moveTo(valid[0].x, PAD.t+CH);
      ctx.lineTo(valid[0].x, valid[0].y);
      valid.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(valid[valid.length-1].x, PAD.t+CH);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // Draw line (skip null segments)
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = isGen ? 2.5 : 1.5;
    ctx.setLineDash(isGen ? [] : [4,3]);
    let started = false;
    pts.forEach(p => {
      if(!p){ started=false; return; }
      if(!started){ ctx.moveTo(p.x,p.y); started=true; }
      else ctx.lineTo(p.x,p.y);
    });
    ctx.stroke();
    ctx.setLineDash([]);

    // ── Moving average (7-day) overlay ─────────────────────────────────────
    if(isGen && vals.length >= 7){
      const window = 7;
      const maVals = vals.map((v, i) => {
        if(v === null) return null;
        const slice = vals.slice(Math.max(0,i-Math.floor(window/2)),
                                 Math.min(vals.length, i+Math.ceil(window/2)));
        const valid = slice.filter(x => x !== null);
        return valid.length >= 3 ? valid.reduce((a,b)=>a+b,0)/valid.length : null;
      });
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(200,169,110,0.35)';
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      let maStarted = false;
      maVals.forEach((v, i) => {
        if(v === null){ maStarted = false; return; }
        const x = xPos(i), y = yPos(v);
        if(!maStarted){ ctx.moveTo(x,y); maStarted=true; }
        else ctx.lineTo(x,y);
      });
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Dots on data points
    pts.forEach(p => {
      if(!p) return;
      ctx.beginPath();
      ctx.arc(p.x, p.y, isGen?4:3, 0, Math.PI*2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, isGen?2:1.5, 0, Math.PI*2);
      ctx.fillStyle = '#0d0d0d';
      ctx.fill();
    });
  });

  // Hover
  const tooltip = wrap.querySelector('#chart-tooltip');
  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    if(dates.length < 2){ tooltip.style.display='none'; return; }
    const i = Math.round((mx - PAD.l) / CW * (dates.length-1));
    if(i<0||i>=dates.length){ tooltip.style.display='none'; return; }

    let html = `<div style="color:var(--gold);margin-bottom:6px;font-size:9px;letter-spacing:.15em">${fmtDate(dates[i])}</div>`;
    Object.entries(seriesData).forEach(([name, vals]) => {
      if(!visibleLines[name]||vals[i]==null) return;
      html += `<div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:3px">
        <span style="color:${colors[name]}">${name}</span>
        <span style="font-weight:700">${fi(vals[i])}</span>
      </div>`;
    });
    tooltip.innerHTML = html;
    const tx = Math.min(e.clientX - rect.left + 12, W - 160);
    const ty = Math.max(e.clientY - rect.top - 10, 4);
    tooltip.style.left = tx+'px'; tooltip.style.top = ty+'px';
    tooltip.style.display = 'block';
    // Draw vertical cursor
    drawChart(canvas, dates, seriesData, colors, visibleLines, wrap);
    ctx.beginPath(); ctx.strokeStyle = '#c8a96e44'; ctx.lineWidth=1;
    ctx.moveTo(xPos(i), PAD.t); ctx.lineTo(xPos(i), PAD.t+CH); ctx.stroke();
  };
  canvas.onmouseleave = () => { tooltip.style.display='none'; };
}

function applySaloneros(){
  const from = document.getElementById('sal-from')?.value;
  const to   = document.getElementById('sal-to')?.value;
  const dates = getDatesInRange(from||'2000-01-01', to||'2099-01-01');
  const el = document.getElementById('sal-container');
  if(!el) return;

  if(!dates.length){ el.innerHTML = emptyState('📅','Sin datos','Ajusta el rango de fechas'); return; }

  const gen = aggGeneral(dates);
  const sals = ALL_SALS
    .map(n => ({ n, ...aggSalonero(n, dates) }))
    .filter(s => s.total > 0)
    .sort((a,b) => b.total - a.total);

  if(!sals.length){ el.innerHTML = emptyState('📊','Sin ventas','No hay datos de saloneros en este período'); return; }

  const maxTotal = sals[0].total;
  const grid = document.createElement('div');
  grid.className = 'cards-grid';

  sals.forEach((s, i) => {
    const above = s.promPax >= gen.promPax;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div>

  const storageBar = document.createElement('div');
  storageBar.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 16px;background:var(--panel);border:1px solid var(--border);border-radius:2px;font-size:10px;';

    <span style="color:var(--muted)">💾 ${getStorageUsage()} KB · ${Object.keys(DIAS).length} reporte(s)</span>

    <input type="file" id="import-inp" accept=".json" style="display:none" onchange="importBackup(this)">
  `;
  el.appendChild(storageBar);

  // ── Two column layout: Upload + Calendar ──
  const twoCol = document.createElement('div');
  twoCol.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;';
  el.appendChild(twoCol);

  // Left: upload zone
  const uploadCol = document.createElement('div');
  uploadCol.innerHTML = `
    <div class="upload-zone" id="drop-zone"
      ondragover="event.preventDefault();this.classList.add('drag')"

      onclick="document.getElementById('xls-file-inp').click()">
